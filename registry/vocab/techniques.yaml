vocabulary: techniques
note: >-
  Interim documented vocabulary (same posture as endpoint-tests and
  temperature-stages — see registry/entries/README.md). Techniques are the
  semantic layer over primitives: research 06 makes them the substitution
  fallback anchor ("you removed the only creaming step but a slot still
  declares leavening.mechanical"), and DECISIONS #10 lists them as a
  derived facet. The full registry-kind treatment (documented gestures
  with media, teaches links, per-primitive tagging) is FEAT-REG-003 (v1).
  L2 validates executionMode.technique membership against this list.
techniques:
  - id: stir
    display_name: { pt: Mexer com gelo, en: Stirred }
    definition: >-
      Cocktail dilution-and-chill by stirring over ice — distinct from the
      step primitive of the same bare name; this is the drink-mode gesture.
  - id: none
    display_name: { pt: Sem técnica, en: None }
    definition: >-
      Sentinel: the execution mode applies no technique (e.g. batched
      drinks take their dilution from added water, not from a gesture).
