id: technique.saute.refogado
kind: technique
display_name: { pt: Refogado, en: Refogado }
definition: >-
  The Portuguese foundational base: onion (often with garlic) sweated in
  olive oil until translucent and sweet, the flavour bed most savoury
  pt-PT cooking builds on. A form of the sauté family with its own
  identity — slower and softer than a generic sauté, aiming at
  translucency, not browning.
