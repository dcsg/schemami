id: technique.bulhao-pato
kind: technique
display_name: { pt: À Bulhão Pato, en: Bulhão Pato style }
definition: >-
  Named Portuguese preparation style for bivalves: clams opened fast in
  olive oil and garlic, finished with fresh coriander, white wine and
  lemon. A proper-name style — the name is the identifier, per the
  named-style exception to English-base vocabulary (DECISIONS #24).
