name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install exact mise bootstrap trust anchor
        run: bash tools/ci/install-mise-ci.sh >> "$GITHUB_ENV"
      - name: Bootstrap the checksum-locked toolchain
        run: bash tools/bootstrap.sh
      - name: Run the local-equivalent gate DAG
        run: make ci

  swift-sdk:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the locked Swift SDK package
        run: swift test --package-path sdk/swift --disable-sandbox
      - name: Test the repository-root Swift Package distribution
        run: swift test --disable-sandbox --disable-automatic-resolution --skip-update
