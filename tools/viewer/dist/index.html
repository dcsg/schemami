<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-zto6+E4Zu7Su4EiGY12PKn8SqnrxdbunrBXWcOTP51Q='; style-src 'sha256-AFABKVBgeidcQ8u8bJ+1h0Wd3rTmxaKpVMYTJTUTSTI='; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCP viewer</title>
<style>/* RCP viewer — recipe-card styling. Classes only (CSP bans style attrs). */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 60rem; padding: 1.5rem; font: 16px/1.55 system-ui, sans-serif; }
h1 { font-size: 1.4rem; }
main { display: grid; gap: 1.25rem; }
textarea#input { width: 100%; min-height: 12rem; padding: .75rem; font: 13px/1.4 ui-monospace, monospace; border: 2px dashed color-mix(in srgb, currentColor 35%, transparent); border-radius: 8px; }
textarea#input:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.empty .hint { opacity: .7; font-size: .9rem; }
.verdicts { border-left: 4px solid #4a7dbd; padding: .25rem 1rem; overflow-x: auto; }
.verdicts.parse-error { border-color: #b04a4a; }
.verdicts .ok { color: #2c7a3d; font-weight: 600; }
.verdicts .bad { color: #b04a4a; font-weight: 600; }
.verdicts .sev { font-weight: 700; font-size: .75rem; margin-right: .35rem; }
.verdicts li.sev-error .sev { color: #b04a4a; }
.verdicts li.sev-warning .sev { color: #9a7b1f; }
.verdicts code, .taxonomy .tag { overflow-wrap: anywhere; }
.recipe { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 10px; padding: 1rem 1.25rem; }
.recipe header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.badge { font-size: .72rem; padding: .15rem .5rem; border-radius: 999px; background: #2c7a3d22; border: 1px solid #2c7a3d66; }
.badge-warn { background: #9a7b1f22; border-color: #9a7b1f66; }
.taxonomy { opacity: .85; }
.taxonomy .tag { background: color-mix(in srgb, currentColor 10%, transparent); border-radius: 4px; padding: 0 .35rem; }
.ingredients { max-height: 24rem; overflow-y: auto; padding-left: 1.25rem; }
.ingredients .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
.ingredients .unresolved { opacity: .75; }
.ingredients .prep, .steps .note { opacity: .8; font-size: .9rem; }
.steps li { margin: .35rem 0; overflow-wrap: anywhere; }
.component { margin-top: 1rem; border-top: 1px dashed color-mix(in srgb, currentColor 25%, transparent); padding-top: .5rem; }
#busy { font-style: italic; }
.toolbar { display: flex; justify-content: flex-end; }
.toolbar button { font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); cursor: pointer; }
.toolbar button:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
</style>
</head>
<body>
<main>
<h1>RCP viewer</h1>
<p>Valide e leia um documento RCP — tudo corre localmente, nada é enviado. A caixa aceita colar (teclado) ou arrastar o ficheiro.</p>
<label for="input">Documento .rcp.yaml ou JSON</label>
<div class="toolbar"><button id="load-example" type="button">Carregar exemplo (torta de três camadas)</button></div>
<textarea id="input" spellcheck="false" autocomplete="off"></textarea>
<p id="busy" hidden>a validar…</p>
<div id="verdicts" aria-live="polite"></div>
<div id="render"></div>
</main>

ards, so every path is reviewed and testable. Downstream steps anchor on produced intermediates, not step ids, so whichever path is active satisfies the DAG.",items:{type:"object",required:["id","kind"],properties:{id:{$ref:"#/$defs/slug"},kind:{enum:["toggle","choice"]},default:{type:["boolean","string"]},choices:{type:"array",items:{$ref:"#/$defs/slug"}},label:{$ref:"#/$defs/text"},note:{$ref:"#/$defs/text"}},additionalProperties:!1}},substitutions:{type:"array",items:{$ref:"#/$defs/substitution"}},execution_modes:{type:"array",items:{$ref:"#/$defs/executionMode"}},serving:{type:"object"},times:{description:"Recipe-level time metadata (DS-PR-005; research 04:79-80). `active` (hands-on) and `total` are deliberately separate fields — same total, opposite effort (stir-fry vs risotto). Each value is a duration window; single book values encode as `target`. Closed object: a new phase name is a schema change, not authoring freedom.",type:"object",properties:{active:{$ref:"#/$defs/duration"},total:{$ref:"#/$defs/duration"},prep:{$ref:"#/$defs/duration"},cook:{$ref:"#/$defs/duration"},chill:{$ref:"#/$defs/duration"},rest:{$ref:"#/$defs/duration"}},additionalProperties:!1},storage:{description:"Storage guidance (DS-PR-007). An array because book pages routinely give multiple conditions (days airtight at room, months frozen). `where` is a closed enum; free-text nuance goes in `container`/`note`.",type:"array",items:{type:"object",required:["where"],properties:{where:{enum:["room","refrigerator","freezer"]},container:{$ref:"#/$defs/text"},duration:{$ref:"#/$defs/duration"},note:{$ref:"#/$defs/text"}},additionalProperties:!1}},provenance:{$ref:"#/$defs/provenance"},licence:{type:"object",properties:{text:{type:"string"},media:{type:"string"}},additionalProperties:!1},version:{type:"integer",minimum:1,description:"Revision number of THIS document, pinned by componentRef.version at reference sites. HARDENED (P8 triage): componentRef always pinned a version, but no field existed ss, never a purchasable product — the shopping layer resolves class to product. HARDENED (SR-PR-002/DS-PR-003): null is schema-valid and marks an unresolved import (freshly-ingested, not yet mapped) — the semantic linter WARNS on null, the schema never errors; `raw` always survives for audit and re-parsing."},amount:{$ref:"#/$defs/quantity"},roles:{type:"array",items:{$ref:"#/$defs/role"}},component:{$ref:"#/$defs/slug",description:"This ingredient is produced by the named component."},prep:{type:"object",properties:{cut:{$ref:"#/$defs/slug"},state:{$ref:"#/$defs/slug"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},constraints:{type:"array",items:{$ref:"#/$defs/constraint"}},optional:{type:"boolean",default:!1},removed_after:{$ref:"#/$defs/slug",description:"Step id. For cultures/SCOBYs/aromatics present during the process but removed rather than consumed — excluded from final nutrition."},proposed_class:{$ref:"#/$defs/slug",description:"Extraction's proposed canonical ENGLISH class for an unresolved item (item: null) — the gap ledger groups by this so cross-language raws (cebola/onion) consolidate under one mint candidate (SR-REG-005). Never a mint; a proposal for the steward."},raw:{type:"string",description:"Original text as scraped or extracted. Preserved for audit and re-parsing even after canonical resolution."},note:{$ref:"#/$defs/text"}},additionalProperties:!1},constraint:{description:"Bounded quantity. A `critical` constraint may not be violated by scaling or substitution — the engine must refuse and explain, not silently produce an unsafe recipe. HARDENED (SR-PR-002): at least one bound is required — a constraint without bounds is not a constraint; ratio bounds require `of` naming the basis they are ratios of.",type:"object",required:["severity","reason"],anyOf:[{required:["min_ratio"]},{required:["max_ratio"]},{required:["min_value"]},{required:["max_value"]}],dependentRequired:{min_ratio:["of"],max_ratio:["of"]},properties:{min_ratio:{type:"numbe id: torta-tres-camadas-teste
kind: pastry
lang: pt-PT
name:
  pt: Torta de três camadas (documento de teste)
  en: Three-layer torte (test document)
description:
  pt: Documento sintético para testar o visualizador — três camadas, duas delas sub-receitas.
taxonomy:
  category: pastry
  subcategory:
  - cake
  - chocolate
  difficulty: 4
tags:
- classic
times:
  active:
    target: 1h10m
  total:
    min: 4h
    target: 5h
  prep:
    target: 40m
  cook:
    target: 30m
  chill:
    min: 2h
    max: 12h
storage:
- where: refrigerator
  container:
    pt: Caixa hermética
  duration:
    min: 2d
    max: 3d
  note:
    pt: Retirar 30 minutos antes de servir.
- where: freezer
  duration:
    target: 3w
  note:
    pt: Congelar sem a cobertura.
provenance:
  confidence: LOW
  status: draft
  sources:
  - label: Documento sintético de teste
    type: blog
    work: RCP viewer stress test
    page: n/a
  notes:
    pt: Dificuldade assinalada diretamente na escala 1-5 (sem mapeamento de livro).
scaling:
  default_yield:
    servings: 10
bases:
  flour:
    sum: ingredients
    where:
      roles:
      - flour
ingredients:
- id: farinha
  item: ingredient.flour.wheat.t55
  amount:
    value: 250
    unit: g
  roles:
  - flour
- id: acucar
  item: ingredient.sweetener.sugar.white
  amount:
    ratio: 0.8
    of: flour
  roles:
  - sweetener
- id: manteiga
  item: ingredient.fat.butter
  amount:
    ratio: 0.6
    of: flour
  roles:
  - fat
  prep:
    state: softened
    note:
      pt: amolecida
- id: ovos
  item: ingredient.egg.whole
  amount:
    value: 200
    unit: g
  roles:
  - binder
  - hydration
- id: fermento
  item: ingredient.raising.baking-powder
  amount:
    ratio: 0.04
    of: flour
  roles:
  - leaven
components:
- id: ganache-cobertura
  kind: component
  name:
    pt: Ganache de cobertura
  ingredients:
  - id: chocolate
    item: ingredient.chocolate.dark.70
    amount:
      value: 200
      unit: g
    roles:
    - flavour
    - thickener
  - id: natas
    item: ingredient.dairy.cream.35
    amount:
      value: 200
      unit: g
    roles:
    - fat
    - hydration
  steps:
  - id: g1
    primitive:
      id: primitive.melt
      v: 1
    uses:
    - chocolate
  - id: g2
    primitive:
      id: primitive.emulsify
      v: 1
    uses:
    - natas
    after:
    - g1
- id: calda-cafe
  kind: component
  name:
    pt: Calda para embeber
  ingredients:
  - id: agua-calda
    item: ingredient.water
    amount:
      value: 100
      unit: g
    roles:
    - hydration
  - id: acucar-calda
    item: ingredient.sweetener.sugar.white
    amount:
      value: 80
      unit: g
    roles:
    - sweetener
  steps:
  - id: c1
    primitive:
      id: primitive.cook-syrup
      v: 1
    uses:
    - agua-calda
    - acucar-calda
    until:
    - kind: core-temperature
      value: 104
      unit: C
steps:
- id: s1
  title:
    pt: Bater a manteiga com o açúcar até ficar clara e fofa.
  primitive:
    id: primitive.mix
    v: 1
  uses:
  - manteiga
  - acucar
- id: s2
  title:
    pt: Incorporar os ovos, depois a farinha com o fermento.
  primitive:
    id: primitive.incorporate
    v: 1
  uses:
  - ovos
  - farinha
  - fermento
  after:
  - s1
- id: s3
  title:
    pt: Cozer em forma untada.
  primitive:
    id: primitive.bake
    v: 1
  duration:
    min: 25m
    target: 30m
    max: 35m
  until:
  - kind: visual
    expect: palito sai seco
  after:
  - s2
- id: s4
  title:
    pt: Arrefecer completamente antes de montar.
  primitive:
    id: primitive.cool
    v: 1
  after:
  - s3
- id: s5
  title:
    pt: Montar em camadas, embeber com a calda, cobrir com a ganache.
  primitive:
    id: primitive.assemble
    v: 1
  after:
  - s4
options:
- id: sem-calda
  kind: toggle
  default: false
  label:
    pt: Versão sem calda (mais firme)
substitutions:
- scope: ingredient
  replaces: manteiga
  class: direct
  with: ingredient.fat.olive-oil
  note:
    pt: Versão com azeite — textura mais densa, sabor mais rústico.
