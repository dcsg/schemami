<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-YOAhJClApV80nz9Hyc2tqjFcl9CFwWYrlyPvSETgNR0='; style-src 'sha256-FzWQdKxigm1tjhASxg6cT49CfsXugMBATUg8/G5lb3A='; img-src data: blob:; media-src data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCP viewer</title>
<style>/* RCP viewer — recipe-card styling. Classes only (CSP bans style attrs). */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 60rem; padding: 1.5rem; font: 16px/1.55 system-ui, sans-serif; }
h1 { font-size: 1.4rem; }
main { display: grid; gap: 1.25rem; }
textarea#input { width: 100%; min-height: 12rem; padding: .75rem; font: 13px/1.4 ui-monospace, monospace; border: 2px dashed color-mix(in srgb, currentColor 35%, transparent); border-radius: 8px; }
textarea#input:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.empty .hint { opacity: .7; font-size: .9rem; }
.verdicts { border-left: 4px solid #4a7dbd; padding: .25rem 1rem; overflow-x: auto; }
.verdicts.parse-error { border-color: #b04a4a; }
.verdicts .ok { color: #2c7a3d; font-weight: 600; }
.verdicts .bad { color: #b04a4a; font-weight: 600; }
.verdicts .sev { font-weight: 700; font-size: .75rem; margin-right: .35rem; }
.verdicts li.sev-error .sev { color: #b04a4a; }
.verdicts li.sev-warning .sev { color: #9a7b1f; }
.verdicts code, .taxonomy .tag { overflow-wrap: anywhere; }
.recipe { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 10px; padding: 1rem 1.25rem; }
.recipe header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.badge { font-size: .72rem; padding: .15rem .5rem; border-radius: 999px; background: #2c7a3d22; border: 1px solid #2c7a3d66; }
.badge-warn { background: #9a7b1f22; border-color: #9a7b1f66; }
.taxonomy { opacity: .85; }
.taxonomy .tag { background: color-mix(in srgb, currentColor 10%, transparent); border-radius: 4px; padding: 0 .35rem; }
.ingredients { max-height: 24rem; overflow-y: auto; padding-left: 1.25rem; }
.ingredients .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
.ingredients .unresolved { opacity: .75; }
.ingredients .prep, .steps .note { opacity: .8; font-size: .9rem; }
.steps li { margin: .35rem 0; overflow-wrap: anywhere; }
.component { margin-top: 1rem; border-top: 1px dashed color-mix(in srgb, currentColor 25%, transparent); padding-top: .5rem; }
#busy { font-style: italic; }
.toolbar { display: flex; justify-content: flex-end; }
.toolbar button { font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); cursor: pointer; }
.toolbar button:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.steps .chip { font-size: .72rem; padding: .1rem .45rem; border-radius: 999px; background: color-mix(in srgb, currentColor 9%, transparent); border: 1px solid color-mix(in srgb, currentColor 20%, transparent); white-space: nowrap; }
.toolbar { align-items: center; gap: .75rem; flex-wrap: wrap; }
.file-label { font-size: .85rem; opacity: .85; }
#file-input { font: inherit; font-size: .85rem; max-width: 16rem; }
#file-input:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.media-list { display: flex; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }
.media { margin: 0; max-width: 14rem; }
.media img, .media video { max-width: 100%; border-radius: 6px; display: block; }
.media audio { max-width: 100%; display: block; }
.media figcaption { font-size: .78rem; display: flex; gap: .4rem; flex-wrap: wrap; align-items: baseline; }
.media-role { text-transform: uppercase; letter-spacing: .04em; font-weight: 600; opacity: .8; }
.media-role.media-failure { color: #b04a4a; opacity: 1; }
.media-absent { border: 1px dashed color-mix(in srgb, currentColor 30%, transparent); border-radius: 6px; padding: .5rem .6rem; }
.media-missing { opacity: .7; font-style: italic; }
.scale-control { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; margin: .75rem 0; }
.scale-control label { font-size: .85rem; }
.scale-control input { font: inherit; width: 5rem; padding: .25rem .4rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
.scale-control input:focus-visible, .scale-control button:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.scale-control button { font: inherit; font-size: .85rem; padding: .25rem .8rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); cursor: pointer; }
.scale-msg-invalid { color: #b04a4a; font-size: .85rem; }
.clamp-refusal { border: 1px solid #b04a4a88; border-radius: 8px; padding: .5rem .75rem; margin: .5rem 0; }
.clamp-refusal p { font-weight: 600; color: #b04a4a; }
.schedule { margin-top: 1rem; border-top: 1px dashed color-mix(in srgb, currentColor 25%, transparent); padding-top: .5rem; }
.sched-day h4 { margin: .5rem 0 .25rem; text-transform: uppercase; letter-spacing: .04em; font-size: .78rem; opacity: .8; }
.sched-day ol { padding-left: 1.25rem; }
.sched-offset { font-variant-numeric: tabular-nums; font-weight: 600; }
.sched-range { opacity: .7; font-size: .85rem; }
.schedule time { font-variant-numeric: tabular-nums; }
.scale-default { font-size: .85rem; opacity: .8; }
.linked-method { margin: .5rem 0; border-left: 3px solid color-mix(in srgb, currentColor 25%, transparent); padding-left: .75rem; }
.linked-method summary { cursor: pointer; font-size: .9rem; }
.linked-method summary:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.linked-body { margin-top: .5rem; }
.link-omission { color: #9a7b1f; font-size: .9rem; margin-top: .5rem; }
</style>
</head>
<body>
<main>
<h1>RCP viewer</h1>
<p>Valide e leia um documento RCP — tudo corre localmente, nada é enviado. A caixa aceita colar (teclado) ou arrastar o ficheiro.</p>
<label for="input">Documento .rcp.yaml ou JSON</label>
<div class="toolbar"><button id="load-example" type="button">Carregar exemplo (torta de três camadas)</button>
<label class="file-label" for="file-input">Ficheiros (documento e/ou media)</label>
<input id="file-input" type="file" multiple></div>
<textarea id="input" spellcheck="false" autocomplete="off"></textarea>
<p id="busy" hidden>a validar…</p>
<div id="verdicts" aria-live="polite"></div>
<div id="render"></div>
</main>

es that."},credit:{type:"string"},source_url:{type:"string",format:"uri"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},equipmentRef:{type:"object",required:["ref"],properties:{ref:{$ref:"#/$defs/slug",description:"Registry reference to an equipment profile document."},role:{enum:["primary","vessel","mould","tool","measuring"]},required:{type:"boolean",default:!0,description:"False where the equipment is a convenience; true where it is a feasibility gate (brioche at 60% butter, Italian meringue)."},substitutes:{type:"array",items:{$ref:"#/$defs/slug"},description:"Swapping these triggers a method delta via the same mechanism as ingredient substitution."},note:{$ref:"#/$defs/text"}},additionalProperties:!1},substitution:{description:"Substitution targets are NOT only ingredients. `scope` says what is being swapped: an ingredient slot, a piece of equipment, one or more steps, a whole named section of the method (hand-knead vs mixer vs no-knead folds; steam vs bake), or an entire component sub-recipe (levain -> commercial-yeast prep). Method-level substitutions use `with_steps`; everything else uses `with`.",type:"object",required:["replaces","class"],anyOf:[{required:["with"]},{required:["with_steps"]}],properties:{scope:{enum:["ingredient","equipment","steps","section","component"],default:"ingredient"},replaces:{oneOf:[{$ref:"#/$defs/slug"},{type:"array",items:{$ref:"#/$defs/slug"}}]},with:{$ref:"#/$defs/slug"},with_steps:{type:"array",items:{$ref:"#/$defs/step"},description:"Replacement steps when scope is steps/section. Must produce the same intermediate (`produces`) as the replaced ones so downstream steps still resolve."},ratio:{type:"number"},amount:{$ref:"#/$defs/quantity"},formula:{type:"string",description:"Closed arithmetic grammar, never eval. E.g. hop substitution by alpha-acid units."},class:{enum:["direct","quantity-forcing","technique-forcing","balance-forcing","compensation-forcing","computed","method-changing"],description:"What else must be r ance:{description:"First-class, and disagreement is data. Almost nobody else models this; for a heritage archive it is the whole point.",type:"object",properties:{confidence:{enum:["HIGH","MEDIUM-HIGH","MEDIUM","LOW"]},notes:{$ref:"#/$defs/text",description:"Provenance working notes — where per-ingest judgment calls are recorded (e.g. the DS-PR-006 hat-scale-to-1..5 difficulty mapping, a storage-location reading the book left implicit). ADDITION during PLAN-rcp-v02 Phase 8: DS-PR-006 mandated the record but no field existed."},status:{enum:["draft","unverified","published","archived"]},sources:{type:"array",items:{type:"object",required:["label"],properties:{label:{type:"string"},url:{type:"string",format:"uri"},type:{enum:["official","academic","press","testimony","blog","book"]},work:{type:"string",description:"Publication/book title (DS-PR-008) — the work the page reference points into."},page:{type:"string",description:"Page reference as a string: admits '123', '123-125', 'xii' (DS-PR-008)."}},additionalProperties:!1}},witnesses:{type:"array",items:{type:"object",properties:{name:{type:"string"},role:{$ref:"#/$defs/text"},place:{type:"string"},quote:{$ref:"#/$defs/text"},source:{type:"string"}},additionalProperties:!1}},divergences:{description:"Recorded disagreements between sources, deliberately left unresolved.",type:"array",items:{type:"object",required:["topic","versions"],properties:{topic:{$ref:"#/$defs/text"},versions:{type:"array",items:{type:"object",properties:{claim:{$ref:"#/$defs/text"},source:{type:"string"}},additionalProperties:!1}}},additionalProperties:!1}},verified:{type:"object",properties:{by:{type:"string"},role:{$ref:"#/$defs/text"},place:{type:"string"},date:{type:"string",format:"date"}},additionalProperties:!1}},additionalProperties:!1},import:{description:"Ingestion metadata. Capture loosely, resolve canonically later, never block on perfect identity resolution. Imported recipes land unverified — for this archive an import is a lead, not a publication.",type:"object",properties:{source_url:{type:"string",format:"uri"},method:{enum:["json-ld","microdata","opengraph","selector","vision-llm","manual"]},extracted_at:{type:"string",format:"date-time"},extractor:{type:"string"},field_confidence:{type:"object",additionalProperties:{type:"number",minimum:0,maximum:1}},unresolved:{type:"array",items:{type:"string"},description:"Paths the extractor could not resolve to registry values. It emits null and keeps `raw`; it never invents."}},additionalProperties:!1},collectionId:{type:"string",minLength:1,maxLength:200,pattern:"^[^\\s]+$",description:"A collection identifier — an opaque string in its own value space, deliberately separate from the recipe `id` slug so a distribution layer can use domains or URIs here without widening the frozen id pattern."},lineageRef:{description:"A pointer to another document, in componentRef's shape: the target id, an OPTIONAL collection qualifier (required only when crossing collections — an unqualified pointer resolves in this document's own collection), and an OPTIONAL pinned revision. Pinning is what makes drift DETECTABLE: when the target moves past the pinned revision, validation reports staleness naming both. Compiled variants were considered and rejected (DECISIONS #29) — a variant is a self-contained snapshot, so detection replaces propagation.",oneOf:[{$ref:"#/$defs/slug",description:"Shorthand: the target id, unqualified and unpinned."},{type:"object",additionalProperties:!1,required:["id"],properties:{id:{$ref:"#/$defs/slug",description:"The target document's id."},collection:{$ref:"#/$defs/collectionId",description:"The target's collection. REQUIRED when the pointer crosses collections; omitted means this document's own collection."},version:{type:"integer",minimum:1,description:"Pinned revision of the target. When the target declares a later revision, validation reports staleness; when the target declares a DIFFERENT revision than pinned, that is a mismatch and nt, technique) resolves there when it ships."},order:{type:"integer",description:"Position within a GRADED family, when the axis is ordinal (thin=1 … thick=4). Lets a surface sort the family without parsing prose."}}}}},profiles:{coffee:{$schema:"https://json-schema.org/draft/2020-12/schema",$id:"https://paodeportugal.pt/schema/rcp/1/profiles/coffee.schema.json",title:"RCP Coffee Profile (DRAFT)","x-rcp-maturity":"draft",description:"DRAFT profile (SR-PROF-003; DECISIONS #18 spec-all-7): valid to author against, NOT conformance-guaranteed — the harness labels every pass 'maturity: draft'. brew-ratio fields arrive at hardening (FEAT-PROF-006); minimal draft. Additive alongside core (SSP-002).",type:"object",properties:{profile:{type:"object",properties:{},additionalProperties:!0,description:"Draft: known fields typed, unknown fields admitted (drafts grow; hardening closes them)."}}},preserve:{$schema:"https://json-schema.org/draft/2020-12/schema",$id:"https://paodeportugal.pt/schema/rcp/1/profiles/preserve.schema.json",title:"RCP Preserve Profile (DRAFT)","x-rcp-maturity":"draft",description:"DRAFT profile (SR-PROF-003; DECISIONS #18 spec-all-7): valid to author against, NOT conformance-guaranteed — the harness labels every pass 'maturity: draft'. cure ppm two-hop conversions arrive at hardening (FEAT-PROF-006); minimal draft. Additive alongside core (SSP-002).",type:"object",properties:{profile:{type:"object",properties:{},additionalProperties:!0,description:"Draft: known fields typed, unknown fields admitted (drafts grow; hardening closes them)."}}},bread:{$schema:"https://json-schema.org/draft/2020-12/schema",$id:"https://paodeportugal.pt/schema/rcp/1/profiles/bread.schema.json",title:"RCP Bread Profile","x-rcp-maturity":"hardened",description:"Hardened bread profile (SR-PROF-001; DECISIONS #18). Evaluated ALONGSIDE core (validation = core AND profile[kind], DS-VAL-001): additive — tightens, never removes or redefines core fields (SSP-002). Numeric bounds live ONL provenance:
  confidence: LOW
  status: draft
  sources:
  - label: Documento sintético de teste
    type: blog
    work: RCP viewer stress test
    page: n/a
  notes:
    pt: Dificuldade assinalada diretamente na escala 1-5 (sem mapeamento de livro).
scaling:
  default_yield:
    servings: 10
bases:
  flour:
    sum: ingredients
    where:
      roles:
      - flour
ingredients:
- id: farinha
  item: ingredient.flour.wheat.t55
  amount:
    value: 250
    unit: g
  roles:
  - flour
- id: acucar
  item: ingredient.sweetener.sugar.white
  amount:
    ratio: 0.8
    of: flour
  roles:
  - sweetener
- id: manteiga
  item: ingredient.fat.butter
  amount:
    ratio: 0.6
    of: flour
  roles:
  - fat
  prep:
    state: softened
    note:
      pt: amolecida
- id: ovos
  item: ingredient.egg.whole
  amount:
    value: 200
    unit: g
  roles:
  - binder
  - hydration
- id: fermento
  item: ingredient.raising.baking-powder
  amount:
    ratio: 0.04
    of: flour
  roles:
  - leaven
components:
- id: ganache-cobertura
  kind: component
  name:
    pt: Ganache de cobertura
  ingredients:
  - id: chocolate
    item: ingredient.chocolate.dark.70
    amount:
      value: 200
      unit: g
    roles:
    - flavour
    - thickener
  - id: natas
    item: ingredient.dairy.cream.35
    amount:
      value: 200
      unit: g
    roles:
    - fat
    - hydration
  steps:
  - id: g1
    primitive:
      id: primitive.melt
      v: 1
    uses:
    - chocolate
  - id: g2
    primitive:
      id: primitive.emulsify
      v: 1
    uses:
    - natas
    after:
    - g1
- id: calda-cafe
  kind: component
  name:
    pt: Calda para embeber
  ingredients:
  - id: agua-calda
    item: ingredient.water
    amount:
      value: 100
      unit: g
    roles:
    - hydration
  - id: acucar-calda
    item: ingredient.sweetener.sugar.white
    amount:
      value: 80
      unit: g
    roles:
    - sweetener
  steps:
  - id: c1
    primitive:
      id: primitive.cook-syrup
      v: 1
    uses:
    - agua-calda
    - acucar-calda
    until:
    - kind: core-temperature
      value: 104
      unit: C
steps:
- id: s1
  title:
    pt: Bater a manteiga com o açúcar até ficar clara e fofa.
  primitive:
    id: primitive.mix
    v: 1
  uses:
  - manteiga
  - acucar
- id: s2
  title:
    pt: Incorporar os ovos, depois a farinha com o fermento.
  primitive:
    id: primitive.incorporate
    v: 1
  uses:
  - ovos
  - farinha
  - fermento
  after:
  - s1
- id: s3
  title:
    pt: Cozer em forma untada.
  primitive:
    id: primitive.bake
    v: 1
  duration:
    min: 25m
    target: 30m
    max: 35m
  until:
  - kind: visual
    expect: palito sai seco
  after:
  - s2
- id: s4
  title:
    pt: Arrefecer completamente antes de montar.
  primitive:
    id: primitive.cool
    v: 1
  after:
  - s3
- id: s5
  title:
    pt: Montar em camadas, embeber com a calda, cobrir com a ganache.
  primitive:
    id: primitive.assemble
    v: 1
  after:
  - s4
  uses:
  - ganache-cobertura
  - calda-cafe
options:
- id: sem-calda
  kind: toggle
  default: false
  label:
    pt: Versão sem calda (mais firme)
substitutions:
- scope: ingredient
  replaces: manteiga
  class: direct
  with: ingredient.fat.olive-oil
  note:
    pt: Versão com azeite — textura mais densa, sabor mais rústico.
