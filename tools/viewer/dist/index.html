<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-4RpuWBeaF9VWJ4yC3iAlTx9/vcZ45sojbv8XaCC0UfM='; style-src 'sha256-Mz54UgwgOe23R/72BNvOy3SNEAKZFILqDODrUhQnG9Q='; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCP viewer</title>
<style>/* RCP viewer — recipe-card styling. Classes only (CSP bans style attrs). */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 60rem; padding: 1.5rem; font: 16px/1.55 system-ui, sans-serif; }
h1 { font-size: 1.4rem; }
main { display: grid; gap: 1.25rem; }
textarea#input { width: 100%; min-height: 12rem; padding: .75rem; font: 13px/1.4 ui-monospace, monospace; border: 2px dashed color-mix(in srgb, currentColor 35%, transparent); border-radius: 8px; }
textarea#input:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.empty .hint { opacity: .7; font-size: .9rem; }
.verdicts { border-left: 4px solid #4a7dbd; padding: .25rem 1rem; overflow-x: auto; }
.verdicts.parse-error { border-color: #b04a4a; }
.verdicts .ok { color: #2c7a3d; font-weight: 600; }
.verdicts .bad { color: #b04a4a; font-weight: 600; }
.verdicts .sev { font-weight: 700; font-size: .75rem; margin-right: .35rem; }
.verdicts li.sev-error .sev { color: #b04a4a; }
.verdicts li.sev-warning .sev { color: #9a7b1f; }
.verdicts code, .taxonomy .tag { overflow-wrap: anywhere; }
.recipe { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 10px; padding: 1rem 1.25rem; }
.recipe header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.badge { font-size: .72rem; padding: .15rem .5rem; border-radius: 999px; background: #2c7a3d22; border: 1px solid #2c7a3d66; }
.badge-warn { background: #9a7b1f22; border-color: #9a7b1f66; }
.taxonomy { opacity: .85; }
.taxonomy .tag { background: color-mix(in srgb, currentColor 10%, transparent); border-radius: 4px; padding: 0 .35rem; }
.ingredients { max-height: 24rem; overflow-y: auto; padding-left: 1.25rem; }
.ingredients .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
.ingredients .unresolved { opacity: .75; }
.ingredients .prep, .steps .note { opacity: .8; font-size: .9rem; }
.steps li { margin: .35rem 0; overflow-wrap: anywhere; }
.component { margin-top: 1rem; border-top: 1px dashed color-mix(in srgb, currentColor 25%, transparent); padding-top: .5rem; }
#busy { font-style: italic; }
</style>
</head>
<body>
<main>
<h1>RCP viewer</h1>
<p>Valide e leia um documento RCP — tudo corre localmente, nada é enviado. A caixa aceita colar (teclado) ou arrastar o ficheiro.</p>
<label for="input">Documento .rcp.yaml ou JSON</label>
<textarea id="input" spellcheck="false" autocomplete="off"></textarea>
<p id="busy" hidden>a validar…</p>
<div id="verdicts" aria-live="polite"></div>
<div id="render"></div>
</main>

fs/import"}},patternProperties:{"^x-":{description:"Vendor extension bucket. Consumers MUST ignore and MUST preserve unknown x- fields on round-trip."}}},slug:{type:"string",pattern:"^[a-z0-9][a-z0-9._-]*$"},componentRef:{description:"A component included by reference to another recipe document. Rules: (1) only `published` recipes may be referenced — a draft ref is a validation warning; (2) `version` pins the referenced revision, so editing the ganache never silently changes every brownie; (3) at publish/bundle time the ref is RESOLVED and the component embedded (SPEC-006: delivered snapshots are self-contained for offline), keeping ref+version as lineage; (4) the validator rejects reference cycles.",type:"object",required:["id","ref"],properties:{id:{$ref:"#/$defs/slug",description:"Local alias used by `ingredients[].component` and step `uses`/`after` in THIS recipe."},ref:{$ref:"#/$defs/slug",description:"Id of the referenced recipe document."},version:{type:"integer",minimum:1,description:"Pinned revision of the referenced recipe. Omit only in authoring; publish resolves and pins."},draw:{$ref:"#/$defs/quantity",description:"How much of the referenced recipe's yield this parent consumes ('makes 500 g, use 200 g'). The scaler sizes the component batch from this, respecting the child's min_batch."},overrides:{type:"array",items:{$ref:"#/$defs/substitution"},description:"Reference-site adjustments ('this brownie's ganache uses 70% chocolate') expressed with the same substitution ops, scoped to the referenced component. Large divergence should fork a variant instead — same promotion rule as D8c."},note:{$ref:"#/$defs/text"}},additionalProperties:!1},text:{description:"Prose. Either a bare string in the document's `lang`, or a locale map. Prose is permitted ONLY where the sole consumer is a human eye — anything the renderer, scaler, substitution engine or safety checker reads must be an enum or a registry reference.",oneOf:[{type:"string"},{type:"object",minProperties:1,propertyNames:{pattern:"^[a-z]{2}(-[A-Z]{2})?$"},additionalProperties:{type:"string"}}]},kind:{description:"CLOSED ENUM. Selects the profile schema. Adding a category is a new profile file, not a change to core.",enum:["bread","pastry","ferment","preserve","drink","coffee","dish","component"]},role:{description:"CLOSED ENUM. The functional role an ingredient plays. Substitution matches on roles, not names — which is why egg (binder + leavener + emulsifier + moisture + colourant) has no drop-in replacement.",enum:["flour","hydration","leaven","salt","fat","sweetener","acid","binder","emulsifier","thickener","gelling","aromatic","spirit","bitter","aromatised-wine","tannin","substrate","preservative","colourant","enzyme","tenderiser","lamination","flavour","fermentation-control","dilution","inclusion","coating"]},quantity:{description:"TAGGED UNION. A bare number cannot honestly hold every domain's quantities.",oneOf:[{title:"fixed",type:"object",required:["value","unit"],properties:{value:{type:"number",exclusiveMinimum:0},unit:{$ref:"#/$defs/unit"},scaling:{$ref:"#/$defs/scalingBehaviour"}},additionalProperties:!1},{title:"ratio",type:"object",required:["ratio","of"],properties:{ratio:{type:"number",exclusiveMinimum:0},of:{type:"string",description:"Name of a declared basis."},unit:{$ref:"#/$defs/unit"}},additionalProperties:!1},{title:"parts",type:"object",required:["parts"],properties:{parts:{type:"number",exclusiveMinimum:0}},additionalProperties:!1,description:"Dimensionless until instantiated at a chosen target. A Negroni is genuinely 1:1:1 with no absolute quantities."},{title:"range",type:"object",required:["min","max","unit"],properties:{min:{type:"number"},max:{type:"number"},unit:{$ref:"#/$defs/unit"},scaling:{$ref:"#/$defs/scalingBehaviour"}},additionalProperties:!1},{title:"open",type:"object",required:["variant"],properties:{variant:{enum:["to_taste","as_needed","to_consistency"],description:"Never scales. `to_consistency` (choux egg) additionally carries a non-binding guide and a sensory endpoint, because the true amount is not knowable in advance."},guide:{$ref:"#/$defs/quantity"},until:{type:"array",items:{$ref:"#/$defs/endpoint"}}},additionalProperties:!1}]},unit:{description:"TWO TIERS. `convertible` units map to UCUM and support exact arithmetic. `discrete` units are only ever multiplied, never converted — and the list is registry-backed, not frozen, because a closed unit enum (Crouton's mistake) cannot add a regional unit without a client update. Weight/volume conversion is per-ingredient via catalog density, never assumed 1 g = 1 ml.",type:"string",anyOf:[{enum:["g","kg","ml","l","C","F","cup","tbsp","tsp","floz","oz","lb"]},{$ref:"#/$defs/slug"}]},scalingBehaviour:{description:"CLOSED ENUM. A single global multiplier is wrong in every domain. `area` covers pan geometry (r², so 20cm→23cm is ~1.32x, not 1.15x).",enum:["linear","fixed","sublinear","stepwise","area","formula"],default:"linear"},basis:{type:"object",oneOf:[{required:["sum"],properties:{sum:{const:"ingredients"},where:{type:"object",properties:{roles:{type:"array",items:{$ref:"#/$defs/role"}}},additionalProperties:!1},include_components:{type:"boolean",default:!1}},additionalProperties:!1},{required:["ingredient"],properties:{ingredient:{$ref:"#/$defs/slug"}},additionalProperties:!1}]},ingredient:{type:"object",required:["id"],properties:{id:{$ref:"#/$defs/slug"},item:{anyOf:[{$ref:"#/$defs/slug"},{type:"null"}],description:"REGISTRY REFERENCE into the ingredient-class catalog (e.g. ingredient.flour.wheat.t65). Recipes reference a class, never a purchasable product — the shopping layer resolves class to product. HARDENED (SR-PR-002/DS-PR-003): null is schema-valid and marks an unresolved import (freshly-ingested, not yet mapped) — the semantic linter WARNS on null, the schema never errors; `raw` always survives for audit and re-parsing."},amount:{$ref:"#/$defs/quantity"},roles:{type:"array",items:{$ref:"#/$defs/role"}},component:{$ref:"#/$def ion 20 min before boil-end), recurring (fold every 30min x4; burp daily), and measurement-triggered (rack when SG < 1.005 — no calendar date at all).",type:"object",required:["kind"],properties:{kind:{enum:["at_elapsed","at_remaining","recurring","on_measurement"]},at:{$ref:"#/$defs/isoDuration"},anchor:{enum:["step_start","step_end","process_start","process_end"]},first:{$ref:"#/$defs/isoDuration"},increment:{$ref:"#/$defs/isoDuration"},times:{type:"integer",minimum:1},until:{$ref:"#/$defs/endpoint"},measurement:{$ref:"#/$defs/slug"},op:{enum:["<","<=","=",">=",">"]},value:{type:"number"},action:{$ref:"#/$defs/slug"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},step:{type:"object",required:["id","primitive"],properties:{id:{$ref:"#/$defs/slug"},primitive:{description:"REGISTRY REFERENCE, versioned. Follows SPEC-008's rule: a new capability is a new id, never a repurposed one; params only ever grow optionally.",type:"object",required:["id","v"],properties:{id:{$ref:"#/$defs/slug"},v:{type:"integer",minimum:1}},additionalProperties:!1},after:{type:"array",items:{$ref:"#/$defs/slug"},description:"Step ids, component ids, OR produced-intermediate ids this depends on. Anchoring on an intermediate (massa-misturada) rather than a step id is what lets guarded alternative paths coexist: whichever active step `produces` it satisfies the dependency. OMIT for simple sequential order — the DAG is opt-in."},uses:{type:"array",items:{$ref:"#/$defs/slug"}},produces:{$ref:"#/$defs/slug",description:"Intermediate product, e.g. 'the poolish'."},track:{enum:["main","prep","overnight","day-before"]},section:{$ref:"#/$defs/slug",description:"Named method section this step belongs to (mistura, fermentacao, cozedura). Sections are the unit method-level substitutions can replace wholesale."},title:{$ref:"#/$defs/text"},body:{$ref:"#/$defs/text"},duration:{$ref:"#/$defs/duration"},temperature:{$ref:"#/$defs/temperature"},scales_with:{enum:["temperature","batch","thickness","none"]}, ole:{enum:["technique","result","ingredient","equipment","failure"],description:"`failure` matters: kahm yeast vs mould is a photo, not a sentence."},type:{enum:["photo","video","audio","diagram"]},uri:{type:"string"},licence:{type:"string",description:"REQUIRED. This project runs two tiers deliberately: written heritage CC BY 4.0, media all rights reserved. A media model without a licence field quietly erases that."},credit:{type:"string"},source_url:{type:"string",format:"uri"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},equipmentRef:{type:"object",required:["ref"],properties:{ref:{$ref:"#/$defs/slug",description:"Registry reference to an equipment profile document."},role:{enum:["primary","vessel","mould","tool","measuring"]},required:{type:"boolean",default:!0,description:"False where the equipment is a convenience; true where it is a feasibility gate (brioche at 60% butter, Italian meringue)."},substitutes:{type:"array",items:{$ref:"#/$defs/slug"},description:"Swapping these triggers a method delta via the same mechanism as ingredient substitution."},note:{$ref:"#/$defs/text"}},additionalProperties:!1},substitution:{description:"Substitution targets are NOT only ingredients. `scope` says what is being swapped: an ingredient slot, a piece of equipment, one or more steps, a whole named section of the method (hand-knead vs mixer vs no-knead folds; steam vs bake), or an entire component sub-recipe (levain -> commercial-yeast prep). Method-level substitutions use `with_steps`; everything else uses `with`.",type:"object",required:["replaces","class"],anyOf:[{required:["with"]},{required:["with_steps"]}],properties:{scope:{enum:["ingredient","equipment","steps","section","component"],default:"ingredient"},replaces:{oneOf:[{$ref:"#/$defs/slug"},{type:"array",items:{$ref:"#/$defs/slug"}}]},with:{$ref:"#/$defs/slug"},with_steps:{type:"array",items:{$ref:"#/$defs/step"},description:"Replacement steps when scope is steps/section. Must produce the same intermediate
