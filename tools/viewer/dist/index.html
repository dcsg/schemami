<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-BJSxk2PJLHpDexdj2yBCHywCop75WVlsFAIBbpr4UuI='; style-src 'sha256-2hKSPTJ4gZaYFHLnWwehdMZyKsoalAkl6/UXmyWix8U='; img-src data: blob:; media-src data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCP viewer</title>
<style>/* RCP viewer — recipe-card styling. Classes only (CSP bans style attrs). */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 60rem; padding: 1.5rem; font: 16px/1.55 system-ui, sans-serif; }
h1 { font-size: 1.4rem; }
main { display: grid; gap: 1.25rem; }
textarea#input { width: 100%; min-height: 12rem; padding: .75rem; font: 13px/1.4 ui-monospace, monospace; border: 2px dashed color-mix(in srgb, currentColor 35%, transparent); border-radius: 8px; }
textarea#input:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.empty .hint { opacity: .7; font-size: .9rem; }
.verdicts { border-left: 4px solid #4a7dbd; padding: .25rem 1rem; overflow-x: auto; }
.verdicts.parse-error { border-color: #b04a4a; }
.verdicts .ok { color: #2c7a3d; font-weight: 600; }
.verdicts .bad { color: #b04a4a; font-weight: 600; }
.verdicts .sev { font-weight: 700; font-size: .75rem; margin-right: .35rem; }
.verdicts li.sev-error .sev { color: #b04a4a; }
.verdicts li.sev-warning .sev { color: #9a7b1f; }
.verdicts code, .taxonomy .tag { overflow-wrap: anywhere; }
.recipe { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 10px; padding: 1rem 1.25rem; }
.recipe header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.badge { font-size: .72rem; padding: .15rem .5rem; border-radius: 999px; background: #2c7a3d22; border: 1px solid #2c7a3d66; }
.badge-warn { background: #9a7b1f22; border-color: #9a7b1f66; }
.taxonomy { opacity: .85; }
.taxonomy .tag { background: color-mix(in srgb, currentColor 10%, transparent); border-radius: 4px; padding: 0 .35rem; }
.ingredients { max-height: 24rem; overflow-y: auto; padding-left: 1.25rem; }
.ingredients .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
.ingredients .unresolved { opacity: .75; }
.ingredients .prep, .steps .note { opacity: .8; font-size: .9rem; }
.steps li { margin: .35rem 0; overflow-wrap: anywhere; }
.component { margin-top: 1rem; border-top: 1px dashed color-mix(in srgb, currentColor 25%, transparent); padding-top: .5rem; }
#busy { font-style: italic; }
.toolbar { display: flex; justify-content: flex-end; }
.toolbar button { font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); cursor: pointer; }
.toolbar button:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.steps .chip { font-size: .72rem; padding: .1rem .45rem; border-radius: 999px; background: color-mix(in srgb, currentColor 9%, transparent); border: 1px solid color-mix(in srgb, currentColor 20%, transparent); white-space: nowrap; }
.toolbar { align-items: center; gap: .75rem; flex-wrap: wrap; }
.file-label { font-size: .85rem; opacity: .85; }
#file-input { font: inherit; font-size: .85rem; max-width: 16rem; }
#file-input:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.media-list { display: flex; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }
.media { margin: 0; max-width: 14rem; }
.media img, .media video { max-width: 100%; border-radius: 6px; display: block; }
.media audio { max-width: 100%; display: block; }
.media figcaption { font-size: .78rem; display: flex; gap: .4rem; flex-wrap: wrap; align-items: baseline; }
.media-role { text-transform: uppercase; letter-spacing: .04em; font-weight: 600; opacity: .8; }
.media-role.media-failure { color: #b04a4a; opacity: 1; }
.media-absent { border: 1px dashed color-mix(in srgb, currentColor 30%, transparent); border-radius: 6px; padding: .5rem .6rem; }
.media-missing { opacity: .7; font-style: italic; }
</style>
</head>
<body>
<main>
<h1>RCP viewer</h1>
<p>Valide e leia um documento RCP — tudo corre localmente, nada é enviado. A caixa aceita colar (teclado) ou arrastar o ficheiro.</p>
<label for="input">Documento .rcp.yaml ou JSON</label>
<div class="toolbar"><button id="load-example" type="button">Carregar exemplo (torta de três camadas)</button>
<label class="file-label" for="file-input">Ficheiros (documento e/ou media)</label>
<input id="file-input" type="file" multiple></div>
<textarea id="input" spellcheck="false" autocomplete="off"></textarea>
<p id="busy" hidden>a validar…</p>
<div id="verdicts" aria-live="polite"></div>
<div id="render"></div>
</main>

y domain exercises; this profile tightens the pastry profile block and carries the pastry bounds as data (DS-VAL-003 adjusted).",type:"object",properties:{profile:{type:"object",properties:{laminated:{type:"boolean"},serve_within:{type:"object",required:["value","unit"],properties:{value:{type:"number",exclusiveMinimum:0},unit:{type:"string"}},additionalProperties:!1},make_ahead:{type:"object",properties:{component:{type:"string"},max_lead_time:{type:"string"},storage_method:{type:"string"}},additionalProperties:!1}},additionalProperties:!1,description:"Hardened: the pastry profile block admits exactly these fields (research 04: make-ahead/serve-within are first-class)."}},"x-rcp-bounds":{custard_temperature_c:{min:80,max:84,severity:"warn",reason:{pt:"Creme inglês/custard coagula mal fora de 80–84 °C (nappe a 82–84 °C; talha acima).",en:"Custard sets wrong outside 80–84 °C (nappe at 82–84 °C; curdles above). Research 04."}},lamination_max_temperature_c:{max:18,severity:"warn",reason:{pt:"Acima de 18 °C a manteiga funde durante a laminagem e as camadas perdem-se.",en:"Above 18 °C butter melts during lamination and layers are lost. Research 04."}}}},component:{$schema:"https://json-schema.org/draft/2020-12/schema",$id:"https://paodeportugal.pt/schema/rcp/1/profiles/component.schema.json",title:"RCP Component Profile (DRAFT)","x-rcp-maturity":"draft",description:"DRAFT profile (SR-PROF-003; DECISIONS #18 spec-all-7): valid to author against, NOT conformance-guaranteed — the harness labels every pass 'maturity: draft'. produced intermediates (ganache); yield machinery is core; minimal draft. Additive alongside core (SSP-002).",type:"object",properties:{profile:{type:"object",properties:{},additionalProperties:!0,description:"Draft: known fields typed, unknown fields admitted (drafts grow; hardening closes them)."}}},ferment:{$schema:"https://json-schema.org/draft/2020-12/schema",$id:"https://paodeportugal.pt/schema/rcp/1/profiles/ferment.schema.json",title:"RCP Ferment Profile (DRAFT)","x-rcp-maturity":"draft",description:"DRAFT profile (SR-PROF-003; DECISIONS #18 spec-all-7): valid to author against, NOT conformance-guaranteed — the harness labels every pass 'maturity: draft'. ferment_type safety_refs vessel_headspace observed on chucrute; graduates to hardened in v1 (FEAT-PROF-004). Additive alongside core (SSP-002).",type:"object",properties:{profile:{type:"object",properties:{ferment_type:{enum:["lacto","wild","koji","acetic"]},safety_refs:{type:"array",items:{type:"string"},description:"Ingredient ids carrying the safety constraints (single-sourcing, DS-PR-004) — never numbers."},vessel_headspace:{type:"object"}},additionalProperties:!0,description:"Draft: known fields typed, unknown fields admitted (drafts grow; hardening closes them)."}}}}},bd={taxonomy:{algarve:"Algarve",aperitif:"Aperitivo",base:"Base",beans:"Feijão",beef:"Carne de vaca",biscuit:"Biscoito americano",bread:"Pão",breakfast:"Pequeno-almoço",cake:"Bolo",chili:"Chili",chocolate:"Chocolate",cocktail:"Cocktail",custard:"Creme","lacto-fermented":"Lactofermentado",laminated:"Laminado",madeleine:"Madalena",marbled:"Marmoreado","old-dough":"Massa velha",pastry:"Pastelaria",portuguese:"Português",preserve:"Conserva","quick-bread":"Pão rápido",regional:"Regional",seafood:"Marisco","small-cake":"Bolo pequeno","spirit-forward":"À base de destilado",stew:"Guisado",stirred:"Mexido",texan:"Texano","tray-bake":"Bolo de tabuleiro",vegetable:"Legumes",wheat:"Trigo"},tags:{alentejo:"Alentejo",classic:"Clássico","double-fermentation":"Dupla fermentação","equal-parts":"Partes iguais",iba:"IBA","wood-fired-oven":"Forno a lenha"}},yd=`rcp: 1
id: torta-tres-camadas-teste
kind: pastry
lang: pt-PT
name:
  pt: Torta de três camadas (documento de teste)
  en: Three-layer torte (test document)
description:
  pt: Documento sintético para testar o visualizador — três camadas, duas delas sub-receitas.
taxonomy:
  category: pastry
  subcategory:
  - cake
  - chocolate
  difficulty: 4
tags:
- classic
times:
  active:
    target: 1h10m
  total:
    min: 4h
    target: 5h
  prep:
    target: 40m
  cook:
    target: 30m
  chill:
    min: 2h
    max: 12h
storage:
- where: refrigerator
  container:
    pt: Caixa hermética
  duration:
    min: 2d
    max: 3d
  note:
    pt: Retirar 30 minutos antes de servir.
- where: freezer
  duration:
    target: 3w
  note:
    pt: Congelar sem a cobertura.
provenance:
  confidence: LOW
  status: draft
  sources:
  - label: Documento sintético de teste
    type: blog
    work: RCP viewer stress test
    page: n/a
  notes:
    pt: Dificuldade assinalada diretamente na escala 1-5 (sem mapeamento de livro).
scaling:
  default_yield:
    servings: 10
bases:
  flour:
    sum: ingredients
    where:
      roles:
      - flour
ingredients:
- id: farinha
  item: ingredient.flour.wheat.t55
  amount:
    value: 250
    unit: g
  roles:
  - flour
- id: acucar
  item: ingredient.sweetener.sugar.white
  amount:
    ratio: 0.8
    of: flour
  roles:
  - sweetener
- id: manteiga
  item: ingredient.fat.butter
  amount:
    ratio: 0.6
    of: flour
  roles:
  - fat
  prep:
    state: softened
    note:
      pt: amolecida
- id: ovos
  item: ingredient.egg.whole
  amount:
    value: 200
    unit: g
  roles:
  - binder
  - hydration
- id: fermento
  item: ingredient.raising.baking-powder
  amount:
    ratio: 0.04
    of: flour
  roles:
  - leaven
components:
- id: ganache-cobertura
  kind: component
  name:
    pt: Ganache de cobertura
  ingredients:
  - id: chocolate
    item: ingredient.chocolate.dark.70
    amount:
      value: 200
      unit: g
    roles:
    - flavour
    - thickener
  - id: natas
    item: ingredient.dairy.cream.35
    amount:
      value: 200
      unit: g
    roles:
    - fat
    - hydration
  steps:
  - id: g1
    primitive:
      id: primitive.melt
      v: 1
    uses:
    - chocolate
  - id: g2
    primitive:
      id: primitive.emulsify
      v: 1
    uses:
    - natas
    after:
    - g1
- id: calda-cafe
  kind: component
  name:
    pt: Calda para embeber
  ingredients:
  - id: agua-calda
    item: ingredient.water
    amount:
      value: 100
      unit: g
    roles:
    - hydration
  - id: acucar-calda
    item: ingredient.sweetener.sugar.white
    amount:
      value: 80
      unit: g
    roles:
    - sweetener
  steps:
  - id: c1
    primitive:
      id: primitive.cook-syrup
      v: 1
    uses:
    - agua-calda
    - acucar-calda
    until:
    - kind: core-temperature
      value: 104
      unit: C
steps:
- id: s1
  title:
    pt: Bater a manteiga com o açúcar até ficar clara e fofa.
  primitive:
    id: primitive.mix
    v: 1
  uses:
  - manteiga
  - acucar
- id: s2
  title:
    pt: Incorporar os ovos, depois a farinha com o fermento.
  primitive:
    id: primitive.incorporate
    v: 1
  uses:
  - ovos
  - farinha
  - fermento
  after:
  - s1
- id: s3
  title:
    pt: Cozer em forma untada.
  primitive:
    id: primitive.bake
    v: 1
  duration:
    min: 25m
    target: 30m
    max: 35m
  until:
  - kind: visual
    expect: palito sai seco
  after:
  - s2
- id: s4
  title:
    pt: Arrefecer completamente antes de montar.
  primitive:
    id: primitive.cool
    v: 1
  after:
  - s3
- id: s5
  title:
    pt: Montar em camadas, embeber com a calda, cobrir com a ganache.
  primitive:
    id: primitive.assemble
    v: 1
  after:
  - s4
  uses:
  - ganache-cobertura
  - calda-cafe
options:
- id: sem-calda
  kind: toggle
  default: false
  label:
    pt: Versão sem calda (mais firme)
substitutions:
- scope: ingredient
  replaces: manteiga
  class: direct
  with: ingredient.fat.olive-oil
  note:
