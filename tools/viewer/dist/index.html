<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-DmKaT+EXLcjr3B0N3Y6Fde4aYAt8Tet8GVxu4+i1eZo='; style-src 'sha256-AFABKVBgeidcQ8u8bJ+1h0Wd3rTmxaKpVMYTJTUTSTI='; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCP viewer</title>
<style>/* RCP viewer — recipe-card styling. Classes only (CSP bans style attrs). */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 60rem; padding: 1.5rem; font: 16px/1.55 system-ui, sans-serif; }
h1 { font-size: 1.4rem; }
main { display: grid; gap: 1.25rem; }
textarea#input { width: 100%; min-height: 12rem; padding: .75rem; font: 13px/1.4 ui-monospace, monospace; border: 2px dashed color-mix(in srgb, currentColor 35%, transparent); border-radius: 8px; }
textarea#input:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.empty .hint { opacity: .7; font-size: .9rem; }
.verdicts { border-left: 4px solid #4a7dbd; padding: .25rem 1rem; overflow-x: auto; }
.verdicts.parse-error { border-color: #b04a4a; }
.verdicts .ok { color: #2c7a3d; font-weight: 600; }
.verdicts .bad { color: #b04a4a; font-weight: 600; }
.verdicts .sev { font-weight: 700; font-size: .75rem; margin-right: .35rem; }
.verdicts li.sev-error .sev { color: #b04a4a; }
.verdicts li.sev-warning .sev { color: #9a7b1f; }
.verdicts code, .taxonomy .tag { overflow-wrap: anywhere; }
.recipe { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 10px; padding: 1rem 1.25rem; }
.recipe header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.badge { font-size: .72rem; padding: .15rem .5rem; border-radius: 999px; background: #2c7a3d22; border: 1px solid #2c7a3d66; }
.badge-warn { background: #9a7b1f22; border-color: #9a7b1f66; }
.taxonomy { opacity: .85; }
.taxonomy .tag { background: color-mix(in srgb, currentColor 10%, transparent); border-radius: 4px; padding: 0 .35rem; }
.ingredients { max-height: 24rem; overflow-y: auto; padding-left: 1.25rem; }
.ingredients .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
.ingredients .unresolved { opacity: .75; }
.ingredients .prep, .steps .note { opacity: .8; font-size: .9rem; }
.steps li { margin: .35rem 0; overflow-wrap: anywhere; }
.component { margin-top: 1rem; border-top: 1px dashed color-mix(in srgb, currentColor 25%, transparent); padding-top: .5rem; }
#busy { font-style: italic; }
.toolbar { display: flex; justify-content: flex-end; }
.toolbar button { font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); cursor: pointer; }
.toolbar button:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
</style>
</head>
<body>
<main>
<h1>RCP viewer</h1>
<p>Valide e leia um documento RCP — tudo corre localmente, nada é enviado. A caixa aceita colar (teclado) ou arrastar o ficheiro.</p>
<label for="input">Documento .rcp.yaml ou JSON</label>
<div class="toolbar"><button id="load-example" type="button">Carregar exemplo (torta de três camadas)</button></div>
<textarea id="input" spellcheck="false" autocomplete="off"></textarea>
<p id="busy" hidden>a validar…</p>
<div id="verdicts" aria-live="polite"></div>
<div id="render"></div>
</main>

ype:"array",items:{$ref:"#/$defs/slug"}},label:{$ref:"#/$defs/text"},note:{$ref:"#/$defs/text"}},additionalProperties:!1}},substitutions:{type:"array",items:{$ref:"#/$defs/substitution"}},execution_modes:{type:"array",items:{$ref:"#/$defs/executionMode"}},serving:{type:"object"},times:{description:"Recipe-level time metadata (DS-PR-005; research 04:79-80). `active` (hands-on) and `total` are deliberately separate fields — same total, opposite effort (stir-fry vs risotto). Each value is a duration window; single book values encode as `target`. Closed object: a new phase name is a schema change, not authoring freedom.",type:"object",properties:{active:{$ref:"#/$defs/duration"},total:{$ref:"#/$defs/duration"},prep:{$ref:"#/$defs/duration"},cook:{$ref:"#/$defs/duration"},chill:{$ref:"#/$defs/duration"},rest:{$ref:"#/$defs/duration"}},additionalProperties:!1},storage:{description:"Storage guidance (DS-PR-007). An array because book pages routinely give multiple conditions (days airtight at room, months frozen). `where` is a closed enum; free-text nuance goes in `container`/`note`.",type:"array",items:{type:"object",required:["where"],properties:{where:{enum:["room","refrigerator","freezer"]},container:{$ref:"#/$defs/text"},duration:{$ref:"#/$defs/duration"},note:{$ref:"#/$defs/text"}},additionalProperties:!1}},provenance:{$ref:"#/$defs/provenance"},licence:{type:"object",properties:{text:{type:"string"},media:{type:"string"}},additionalProperties:!1},version:{type:"integer",minimum:1,description:"Revision number of THIS document, pinned by componentRef.version at reference sites. HARDENED (P8 triage): componentRef always pinned a version, but no field existed for the target to declare one — the gap the brownie→ganache defect exposed."},lineage:{type:"object",properties:{forked_from:{$ref:"#/$defs/slug"},family:{$ref:"#/$defs/slug"},variant_of:{$ref:"#/$defs/slug"},variant_label:{$ref:"#/$defs/text"}},additionalProperties:!1},profile:{type:"object",description:"Category-specific extension block. Validated by the profile schema selected by `kind`."},import:{$ref:"#/$defs/import"}},patternProperties:{"^x-":{description:"Vendor extension bucket. Consumers MUST ignore and MUST preserve unknown x- fields on round-trip."}}},slug:{type:"string",pattern:"^[a-z0-9][a-z0-9._-]*$"},componentRef:{description:"A component included by reference to another recipe document. Rules: (1) only `published` recipes may be referenced — a draft ref is a validation warning; (2) `version` pins the referenced revision, so editing the ganache never silently changes every brownie; (3) at publish/bundle time the ref is RESOLVED and the component embedded (SPEC-006: delivered snapshots are self-contained for offline), keeping ref+version as lineage; (4) the validator rejects reference cycles.",type:"object",required:["id","ref"],properties:{id:{$ref:"#/$defs/slug",description:"Local alias used by `ingredients[].component` and step `uses`/`after` in THIS recipe."},ref:{$ref:"#/$defs/slug",description:"Id of the referenced recipe document."},version:{type:"integer",minimum:1,description:"Pinned revision of the referenced recipe. Omit only in authoring; publish resolves and pins."},draw:{$ref:"#/$defs/quantity",description:"How much of the referenced recipe's yield this parent consumes ('makes 500 g, use 200 g'). The scaler sizes the component batch from this, respecting the child's min_batch."},overrides:{type:"array",items:{$ref:"#/$defs/substitution"},description:"Reference-site adjustments ('this brownie's ganache uses 70% chocolate') expressed with the same substitution ops, scoped to the referenced component. Large divergence should fork a variant instead — same promotion rule as D8c."},note:{$ref:"#/$defs/text"}},additionalProperties:!1},text:{description:"Prose. Either a bare string in the document's `lang`, or a locale map. Prose is permitted ONLY where the sole consumer is a human eye — anything the renderer, scaler, substitution engine or safety checker reads must be an enum or a registry reference.",oneOf:[{type:"string"},{type:"object",minProperties:1,propertyNames:{pattern:"^[a-z]{2}(-[A-Z]{2})?$"},additionalProperties:{type:"string"}}]},kind:{description:"CLOSED ENUM. Selects the profile schema. Adding a category is a new profile file, not a change to core.",enum:["bread","pastry","ferment","preserve","drink","coffee","dish","component"]},role:{description:"CLOSED ENUM. The functional role an ingredient plays. Substitution matches on roles, not names — which is why egg (binder + leavener + emulsifier + moisture + colourant) has no drop-in replacement.",enum:["flour","hydration","leaven","salt","fat","sweetener","acid","binder","emulsifier","thickener","gelling","aromatic","spirit","bitter","aromatised-wine","tannin","substrate","preservative","colourant","enzyme","tenderiser","lamination","flavour","fermentation-control","dilution","inclusion","coating"]},quantity:{description:"TAGGED UNION. A bare number cannot honestly hold every domain's quantities.",oneOf:[{title:"fixed",type:"object",required:["value","unit"],properties:{value:{type:"number",exclusiveMinimum:0},unit:{$ref:"#/$defs/unit"},scaling:{$ref:"#/$defs/scalingBehaviour"}},additionalProperties:!1},{title:"ratio",type:"object",required:["ratio","of"],properties:{ratio:{type:"number",exclusiveMinimum:0},of:{type:"string",description:"Name of a declared basis."},unit:{$ref:"#/$defs/unit"}},additionalProperties:!1},{title:"parts",type:"object",required:["parts"],properties:{parts:{type:"number",exclusiveMinimum:0}},additionalProperties:!1,description:"Dimensionless until instantiated at a chosen target. A Negroni is genuinely 1:1:1 with no absolute quantities."},{title:"range",type:"object",required:["min","max","unit"],properties:{min:{type:"number"},max:{type:"number"},unit:{$ref:"#/$defs/unit"},scaling:{$ref:"#/$defs/scalingBehaviour"}},additionalProperties:!1},{title:"open",type:"object",required:["variant"],properties:{variant:{enum:["to_taste","as_needed","to_consistency"],description:"Never scales. `to_consistency` (choux egg) additionally carries a non-binding guide and a sensory endpoint, because the true amount is not knowable in advance."},guide:{$ref:"#/$defs/quantity"},until:{type:"array",items:{$ref:"#/$defs/endpoint"}}},additionalProperties:!1}]},unit:{description:"TWO TIERS. `convertible` units map to UCUM and support exact arithmetic. `discrete` units are only ever multiplied, never converted — and the list is registry-backed, not frozen, because a closed unit enum (Crouton's mistake) cannot add a regional unit without a client update. Weight/volume conversion is per-ingredient via catalog density, never assumed 1 g = 1 ml.",type:"string",anyOf:[{enum:["g","kg","ml","l","C","F","cup","tbsp","tsp","floz","oz","lb"]},{$ref:"#/$defs/slug"}]},scalingBehaviour:{description:"CLOSED ENUM. A single global multiplier is wrong in every domain. `area` covers pan geometry (r², so 20cm→23cm is ~1.32x, not 1.15x).",enum:["linear","fixed","sublinear","stepwise","area","formula"],default:"linear"},basis:{type:"object",oneOf:[{required:["sum"],properties:{sum:{const:"ingredients"},where:{type:"object",properties:{roles:{type:"array",items:{$ref:"#/$defs/role"}}},additionalProperties:!1},include_components:{type:"boolean",default:!1}},additionalProperties:!1},{required:["ingredient"],properties:{ingredient:{$ref:"#/$defs/slug"}},additionalProperties:!1}]},ingredient:{type:"object",required:["id"],properties:{id:{$ref:"#/$defs/slug"},item:{anyOf:[{$ref:"#/$defs/slug"},{type:"null"}],description:"REGISTRY REFERENCE into the ingredient-class catalog (e.g. ingredient.flour.wheat.t65). Recipes reference a class, never a purchasable product — the shopping layer resolves class to product. HARDENED (SR-PR-002/DS-PR-003): null is schema-valid and marks an unresolved import (freshly-ingested, not yet mapped) — the semantic linter WARNS on null, the schema never errors; `raw` always survives for audit and re-parsing."},amount:{$ref:"#/$defs/quantity"},roles:{type:"array",items:{$ref:"#/$defs/role"}},component:{$ref:"#/$defs/slug",description:"This ingredient is produced by the named component."},prep:{type:"object",properties:{cut:{$ref:"#/$defs/slug"},state:{$ref:"#/$defs/slug"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},constraints:{type:"array",items:{$ref:"#/$defs/constraint"}},optional:{type:"boolean",default:!1},removed_after:{$ref:"#/$defs/slug",description:"Step id. For cultures/SCOBYs/aromatics present during the process but removed rather than consumed — excluded from final nutrition."},proposed_class:{$ref:"#/$defs/slug",description:"Extraction's proposed canonical ENGLISH class for an unresolved item (item: null) — the gap ledger groups by this so cross-language raws (cebola/onion) consolidate under one mint candidate (SR-REG-005). Never a mint; a proposal for the steward."},raw:{type:"string",description:"Original text as scraped or extracted. Preserved for audit and re-parsing even after canonical resolution."},note:{$ref:"#/$defs/text"}},additionalProperties:!1},constraint:{description:"Bounded quantity. A `critical` constraint may not be violated by scaling or substitution — the engine must refuse and explain, not silently produce an unsafe recipe. HARDENED (SR-PR-002): at least one bound is required — a constraint without bounds is not a constraint; ratio bounds require `of` naming the basis they are ratios of.",type:"object",required:["severity","reason"],anyOf:[{required:["min_ratio"]},{required:["max_ratio"]},{required:["min_value"]},{required:["max_value"]}],dependentRequired:{min_ratio:["of"],max_ratio:["of"]},properties:{min_ratio:{type:"number"},max_ratio:{type:"number"},min_value:{type:"number"},max_value:{type:"number"},of:{type:"string"},unit:{$ref:"#/$defs/unit"},severity:{enum:["info","warn","critical"]},reason:{$ref:"#/$defs/text"},source:{type:"string",format:"uri"}},additionalProperties:!1},duration:{description:"A window, never a bare number — lamination rests, cold retard and macaron skinning all fail on BOTH sides.",type:"object",anyOf:[{required:["target"]},{required:["min"]}],properties:{min:{$ref:"#/$defs/isoDuration"},target:{$ref:"#/$defs/isoDuration"},max:{$ref:"#/$defs/isoDuration"}},additionalProperties:!1},isoDuration:{type:"string",pattern:"^(\\d+(\\.\\d+)?(s|m|h|d|w))+$",description:"Compound durations allowed: 4h30m, 1h15m."},temperature:{description:"FOUR SHAPES: scalar; band with tolerance (crème anglaise 80-84C, where 86C is scrambled); a registry-backed named stage (sugar work, with fuzzy source-dependent boundaries); or a curve of waypoints (chocolate tempering: melt to cool to rework, all three differing by chocolate type).",type:"object",properties:{target:{type:"number"},min:{type:"number"},max:{type:"number"},falling_to:{type:"number"},unit:{enum:["C","F"],default:"C"},stage:{$ref:"#/$defs/slug",description:"Registry reference, e.g. soft-ball, hard-crack."},curve:{type:"array",items:{type:"object",required:["phase","target"],properties:{phase:{$ref:"#/$defs/slug"},target:{type:"number"},min:{type:"number"},max:{type:"number"}},additionalProperties:!1}},altitude_correction:{type:"object",properties:{per_300m:{type:"number"},unit:{enum:["C","F"]}},additionalProperties:!1},reason:{$ref:"#/$defs/text"}},additionalProperties:!1},endpoint:{description:"How you know it is ready. CLOSED ENUM on `kind`. Multiple endpoints coexist — '96C core OR hollow when tapped' is how people actually bake. Sensory endpoints are where per-step media earns its place; 'smells lactic, not putrid' resists numeric encoding entirely.",type:"object",required:["kind"],properties:{kind:{enum:["sensory","core-temperature","volume","pH","specific-gravity","visual","weight"]},test:{$ref:"#/$defs/slug"},expect:{$ref:"#/$defs/text"},op:{enum:["<","<=","=",">=",">"]},value:{type:["number","string"]},change:{type:"string",pattern:"^[+-]\\d+%$"},unit:{$ref:"#/$defs/unit"}},additionalProperties:!1},trigger:{description:"When a scheduled event fires. FOUR SHAPES, one union: elapsed (V60 pour at 0:45), remaining (hop addition 20 min before boil-end), recurring (fold every 30min x4; burp daily), and measurement-triggered (rack when SG < 1.005 — no calendar date at all).",type:"object",required:["kind"],properties:{kind:{enum:["at_elapsed","at_remaining","recurring","on_measurement"]},at:{$ref:"#/$defs/isoDuration"},anchor:{enum:["step_start","step_end","process_start","process_end"]},first:{$ref:"#/$defs/isoDuration"},increment:{$ref:"#/$defs/isoDuration"},times:{type:"integer",minimum:1},until:{$ref:"#/$defs/endpoint"},measurement:{$ref:"#/$defs/slug"},op:{enum:["<","<=","=",">=",">"]},value:{type:"number"},action:{$ref:"#/$defs/slug"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},step:{type:"object",required:["id","primitive"],properties:{id:{$ref:"#/$defs/slug"},primitive:{description:"REGISTRY REFERENCE, versioned. Follows SPEC-008's rule: a new capability is a new id, never a repurposed one; params only ever grow optionally.",type:"object",required:["id","v"],properties:{id:{$ref:"#/$defs/slug"},v:{type:"integer",minimum:1}},additionalProperties:!1},after:{type:"array",items:{$ref:"#/$defs/slug"},description:"Step ids, component ids, OR produced-intermediate ids this depends on. Anchoring on an intermediate (massa-misturada) rather than a step id is what lets guarded alternative paths coexist: whichever active step `produces` it satisfies the dependency. OMIT for simple sequential order — the DAG is opt-in."},uses:{type:"array",items:{$ref:"#/$defs/slug"}},produces:{$ref:"#/$defs/slug",description:"Intermediate product, e.g. 'the poolish'."},track:{enum:["main","prep","overnight","day-before"]},section:{$ref:"#/$defs/slug",description:"Named method section this step belongs to (mistura, fermentacao, cozedura). Sections are the unit method-level substitutions can replace wholesale."},title:{$ref:"#/$defs/text"},body:{$ref:"#/$defs/text"},duration:{$ref:"#/$defs/duration"},temperature:{$ref:"#/$defs/temperature"},scales_with:{enum:["temperature","batch","thickness","none"]},scaling:{$ref:"#/$defs/scalingBehaviour"},until:{type:"array",items:{$ref:"#/$defs/endpoint"}},triggers:{type:"array",items:{$ref:"#/$defs/trigger"}},repeat:{type:"object",properties:{times:{type:"integer",minimum:1},until:{$ref:"#/$defs/endpoint"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},rest:{$ref:"#/$defs/duration"},equipment:{type:"array",items:{$ref:"#/$defs/slug"}},params:{type:"object",description:"Primitive-specific parameters (SPEC-008 paramValues): lamination geometry, fold type, pour weight. Validated by the primitive's ParamSpec in the registry, not by core.",additionalProperties:{type:["number","string","boolean"]}},media:{type:"array",items:{$ref:"#/$defs/media"}},cues:{description:"Troubleshooting: if you observe X, do Y. Structured, not buried in prose.",type:"array",items:{type:"object",required:["condition","action"],properties:{condition:{$ref:"#/$defs/text"},action:{$ref:"#/$defs/text"},severity:{enum:["info","warn","critical"]},recoverable:{type:"boolean",description:"False for irreversible failures like over-mixed macaronage."}},additionalProperties:!1}},when:{$ref:"#/$defs/guard"},constraints:{type:"array",items:{$ref:"#/$defs/constraint"}},note:{$ref:"#/$defs/text"},source:{$ref:"#/$defs/text"}},additionalProperties:!1},guard:{description:"Conditional content. A step or ingredient is active only when the guard matches the currently selected options. This ONE mechanism serves substitution deltas, equipment branches, execution modes and dietary transforms — four things four domain tracks independently asked for.",type:"object",properties:{execution_mode:{type:["string","array"]},equipment:{type:["string","array"]},substitution:{type:["string","array"]},diet:{type:["string","array"]},option:{type:["string","array"],description:"Matches when the named toggle option is on, or 'id:value' for a choice option."},not:{$ref:"#/$defs/guard"}},additionalProperties:!1},media:{type:"object",required:["role","type","uri","licence"],properties:{role:{enum:["technique","result","ingredient","equipment","failure"],description:"`failure` matters: kahm yeast vs mould is a photo, not a sentence."},type:{enum:["photo","video","audio","diagram"]},uri:{type:"string"},licence:{type:"string",description:"REQUIRED. This project runs two tiers deliberately: written heritage CC BY 4.0, media all rights reserved. A media model without a licence field quietly erases that."},credit:{type:"string"},source_url:{type:"string",format:"uri"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},equipmentRef:{type:"object",required:["ref"],properties:{ref:{$ref:"#/$defs/slug",description:"Registry reference to an equipment profile document."},role:{enum:["primary","vessel","mould","tool","measuring"]},required:{type:"boolean",default:!0,description:"False where the equipment is a convenience; true where it is a feasibility gate (brioche at 60% butter, Italian meringue)."},substitutes:{type:"array",items:{$ref:"#/$defs/slug"},description:"Swapping these triggers a method delta via the same mechanism as ingredient substitution."},note:{$ref:"#/$defs/text"}},additionalProperties:!1},substitution:{description:"Substitution targets are NOT only ingredients. `scope` says what is being swapped: an ingredient slot, a piece of equipment, one or more steps, a whole named section of the method (hand-knead vs mixer vs no-knead folds; steam vs bake), or an entire component sub-recipe (levain -> commercial-yeast prep). Method-level substitutions use `with_steps`; everything else uses `with`.",type:"object",required:["replaces","class"],anyOf:[{required:["with"]},{required:["with_steps"]}],properties:{scope:{enum:["ingredient","equipment","steps","section","component"],default:"ingredient"},replaces:{oneOf:[{$ref:"#/$defs/slug"},{type:"array",items:{$ref:"#/$defs/slug"}}]},with:{$ref:"#/$defs/slug"},with_steps:{type:"array",items:{$ref:"#/$defs/step"},description:"Replacement steps when scope is steps/section. Must produce the same intermediate (`produces`) as the replaced ones so downstream steps still resolve."},ratio:{type:"number"},amount:{$ref:"#/$defs/quantity"},formula:{type:"string",description:"Closed arithmetic grammar, never eval. E.g. hop substitution by alpha-acid units."},class:{enum:["direct","quantity-forcing","technique-forcing","balance-forcing","compensation-forcing","computed","method-changing"],description:"What else must be recomputed or warned about. `compensation-forcing`: one swap requires correlated additions (NA spirit needs added acid + tannin)."},quality:{type:"integer",minimum:1,maximum:5},tested:{type:"boolean"},preserves:{type:"array",items:{$ref:"#/$defs/role"}},loses:{type:"array",items:{$ref:"#/$defs/role"}},tags:{type:"array",items:{$ref:"#/$defs/slug"}},requires_additions:{type:"array",items:{$ref:"#/$defs/ingredient"}},when_applied:{description:"The method delta. See 06-substitution-model.md.",type:"object",properties:{remove_steps:{type:"array",items:{$ref:"#/$defs/slug"}},add_steps:{type:"array",items:{$ref:"#/$defs/step"}},patch:{type:"array",items:{type:"object",required:["step","set"],properties:{step:{$ref:"#/$defs/slug"},set:{type:"object"}},additionalProperties:!1}},warn:{$ref:"#/$defs/text"}},additionalProperties:!1},source:{type:"string",format:"uri"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},executionMode:{description:"The same recipe executed differently. Dilution is the canonical case: water that ice contributes for free to a stirred drink must become an explicit measured ingredient when batching, or the batch is ~20% over-strength.",type:"object",required:["id"],properties:{id:{$ref:"#/$defs/slug"},technique:{$ref:"#/$defs/slug"},equipment:{type:"array",items:{$ref:"#/$defs/slug"}},dilution:{type:"object",properties:{ratio:{type:"number"},of:{type:"string"},source:{enum:["ice","added-water","none"]}},additionalProperties:!1},adds_ingredient:{$ref: lang: pt-PT
name:
  pt: Torta de três camadas (documento de teste)

description:

  - cake
  - chocolate
  difficulty: 4
tags:
- classic
times:

    pt: Caixa hermética
  duration:
    min: 2d
    max: 3d
  note:
    pt: Retirar 30 minutos antes de servir.
- where: freezer
  duration:
    target: 3w
  note:
    pt: Congelar sem a cobertura.
provenance:
  confidence: LOW
  status: draft
  sources:
  - label: Documento sintético de teste

    servings: 10

    sum: ingredients
    where:
      roles:
      - flour
ingredients:

  item: ingredient.flour.wheat.t55
  amount:
    value: 250
    unit: g
  roles:
  - flour
- id: acucar
  item: ingredient.sweetener.sugar.white
  amount:
    ratio: 0.8
    of: flour
  roles:
  - sweetener
- id: manteiga

    ratio: 0.6
    of: flour
  roles:
  - fat

  amount:
    value: 200
    unit: g
  roles:
  - binder
  - hydration
- id: fermento
  item: ingredient.raising.baking-powder
  amount:
    ratio: 0.04
    of: flour
  roles:
  - leaven
components:

  kind: component
  name:
    pt: Ganache de cobertura
  ingredients:
  - id: chocolate
    item: ingredient.chocolate.dark.70
    amount:
      value: 200
      unit: g
    roles:
    - flavour
    - thickener
  - id: natas
    item: ingredient.dairy.cream.35
    amount:
      value: 200
      unit: g
    roles:
    - fat
    - hydration
  steps:
  - id: g1
    primitive:
      id: primitive.melt
      v: 1
    uses:
    - chocolate
  - id: g2
    primitive:
      id: primitive.emulsify
      v: 1
    uses:
    - natas
    after:
    - g1

  - id: agua-calda

    amount:

      unit: g
    roles:
    - hydration

    amount:
      value: 80
      unit: g
    roles:
    - sweetener
  steps:
  - id: c1
    primitive:
      id: primitive.cook-syrup
      v: 1
    uses:
    - agua-calda
    - acucar-calda
    until:
    - kind: core-temperature
      value: 104
      unit: C
steps:
- id: s1
  title:
    pt: Bater a manteiga com o açúcar até ficar clara e fofa.
  primitive:
    id: primitive.mix
    v: 1
  uses:
  - manteiga
  - acucar

  title:

    id: primitive.incorporate

  uses:

  - farinha
  - fermento
  after:
  - s1

  title:
    pt: Cozer em forma untada.

    id: primitive.bake
    v: 1
  duration:
    min: 25m
    target: 30m
    max: 35m

  - kind: visual
    expect: palito sai seco
  after:
  - s2

  title:

  primitive:
    id: primitive.cool
    v: 1
  after:
  - s3

  title:
    pt: Montar em camadas, embeber com a calda, cobrir com a ganache.
  primitive:
    id: primitive.assemble

  after:
  - s4
