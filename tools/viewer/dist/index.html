<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-ZIm9mfxGVtn8EGIy4p+3j28kwKaFn9OR3z3A/eelYp4='; style-src 'sha256-FzWQdKxigm1tjhASxg6cT49CfsXugMBATUg8/G5lb3A='; img-src data: blob:; media-src data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCP viewer</title>
<style>/* RCP viewer — recipe-card styling. Classes only (CSP bans style attrs). */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 60rem; padding: 1.5rem; font: 16px/1.55 system-ui, sans-serif; }
h1 { font-size: 1.4rem; }
main { display: grid; gap: 1.25rem; }
textarea#input { width: 100%; min-height: 12rem; padding: .75rem; font: 13px/1.4 ui-monospace, monospace; border: 2px dashed color-mix(in srgb, currentColor 35%, transparent); border-radius: 8px; }
textarea#input:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.empty .hint { opacity: .7; font-size: .9rem; }
.verdicts { border-left: 4px solid #4a7dbd; padding: .25rem 1rem; overflow-x: auto; }
.verdicts.parse-error { border-color: #b04a4a; }
.verdicts .ok { color: #2c7a3d; font-weight: 600; }
.verdicts .bad { color: #b04a4a; font-weight: 600; }
.verdicts .sev { font-weight: 700; font-size: .75rem; margin-right: .35rem; }
.verdicts li.sev-error .sev { color: #b04a4a; }
.verdicts li.sev-warning .sev { color: #9a7b1f; }
.verdicts code, .taxonomy .tag { overflow-wrap: anywhere; }
.recipe { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 10px; padding: 1rem 1.25rem; }
.recipe header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.badge { font-size: .72rem; padding: .15rem .5rem; border-radius: 999px; background: #2c7a3d22; border: 1px solid #2c7a3d66; }
.badge-warn { background: #9a7b1f22; border-color: #9a7b1f66; }
.taxonomy { opacity: .85; }
.taxonomy .tag { background: color-mix(in srgb, currentColor 10%, transparent); border-radius: 4px; padding: 0 .35rem; }
.ingredients { max-height: 24rem; overflow-y: auto; padding-left: 1.25rem; }
.ingredients .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
.ingredients .unresolved { opacity: .75; }
.ingredients .prep, .steps .note { opacity: .8; font-size: .9rem; }
.steps li { margin: .35rem 0; overflow-wrap: anywhere; }
.component { margin-top: 1rem; border-top: 1px dashed color-mix(in srgb, currentColor 25%, transparent); padding-top: .5rem; }
#busy { font-style: italic; }
.toolbar { display: flex; justify-content: flex-end; }
.toolbar button { font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); cursor: pointer; }
.toolbar button:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.steps .chip { font-size: .72rem; padding: .1rem .45rem; border-radius: 999px; background: color-mix(in srgb, currentColor 9%, transparent); border: 1px solid color-mix(in srgb, currentColor 20%, transparent); white-space: nowrap; }
.toolbar { align-items: center; gap: .75rem; flex-wrap: wrap; }
.file-label { font-size: .85rem; opacity: .85; }
#file-input { font: inherit; font-size: .85rem; max-width: 16rem; }
#file-input:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.media-list { display: flex; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }
.media { margin: 0; max-width: 14rem; }
.media img, .media video { max-width: 100%; border-radius: 6px; display: block; }
.media audio { max-width: 100%; display: block; }
.media figcaption { font-size: .78rem; display: flex; gap: .4rem; flex-wrap: wrap; align-items: baseline; }
.media-role { text-transform: uppercase; letter-spacing: .04em; font-weight: 600; opacity: .8; }
.media-role.media-failure { color: #b04a4a; opacity: 1; }
.media-absent { border: 1px dashed color-mix(in srgb, currentColor 30%, transparent); border-radius: 6px; padding: .5rem .6rem; }
.media-missing { opacity: .7; font-style: italic; }
.scale-control { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; margin: .75rem 0; }
.scale-control label { font-size: .85rem; }
.scale-control input { font: inherit; width: 5rem; padding: .25rem .4rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
.scale-control input:focus-visible, .scale-control button:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.scale-control button { font: inherit; font-size: .85rem; padding: .25rem .8rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); cursor: pointer; }
.scale-msg-invalid { color: #b04a4a; font-size: .85rem; }
.clamp-refusal { border: 1px solid #b04a4a88; border-radius: 8px; padding: .5rem .75rem; margin: .5rem 0; }
.clamp-refusal p { font-weight: 600; color: #b04a4a; }
.schedule { margin-top: 1rem; border-top: 1px dashed color-mix(in srgb, currentColor 25%, transparent); padding-top: .5rem; }
.sched-day h4 { margin: .5rem 0 .25rem; text-transform: uppercase; letter-spacing: .04em; font-size: .78rem; opacity: .8; }
.sched-day ol { padding-left: 1.25rem; }
.sched-offset { font-variant-numeric: tabular-nums; font-weight: 600; }
.sched-range { opacity: .7; font-size: .85rem; }
.schedule time { font-variant-numeric: tabular-nums; }
.scale-default { font-size: .85rem; opacity: .8; }
.linked-method { margin: .5rem 0; border-left: 3px solid color-mix(in srgb, currentColor 25%, transparent); padding-left: .75rem; }
.linked-method summary { cursor: pointer; font-size: .9rem; }
.linked-method summary:focus-visible { outline: 3px solid #4a7dbd; outline-offset: 2px; }
.linked-body { margin-top: .5rem; }
.link-omission { color: #9a7b1f; font-size: .9rem; margin-top: .5rem; }
</style>
</head>
<body>
<main>
<h1>RCP viewer</h1>
<p>Valide e leia um documento RCP — tudo corre localmente, nada é enviado. A caixa aceita colar (teclado) ou arrastar o ficheiro.</p>
<label for="input">Documento .rcp.yaml ou JSON</label>
<div class="toolbar"><button id="load-example" type="button">Carregar exemplo (torta de três camadas)</button>
<label class="file-label" for="file-input">Ficheiros (documento e/ou media)</label>
<input id="file-input" type="file" multiple></div>
<textarea id="input" spellcheck="false" autocomplete="off"></textarea>
<p id="busy" hidden>a validar…</p>
<div id="verdicts" aria-live="polite"></div>
<div id="render"></div>
</main>

ref:"#/$defs/slug"}]},scalingBehaviour:{description:"CLOSED ENUM. A single global multiplier is wrong in every domain. `area` covers pan geometry (r², so 20cm→23cm is ~1.32x, not 1.15x).",enum:["linear","fixed","sublinear","stepwise","area","formula"],default:"linear"},basis:{type:"object",oneOf:[{required:["sum"],properties:{sum:{const:"ingredients"},where:{type:"object",properties:{roles:{type:"array",items:{$ref:"#/$defs/role"}}},additionalProperties:!1},include_components:{type:"boolean",default:!1}},additionalProperties:!1},{required:["ingredient"],properties:{ingredient:{$ref:"#/$defs/slug"}},additionalProperties:!1}]},ingredient:{type:"object",required:["id"],properties:{id:{$ref:"#/$defs/slug"},item:{anyOf:[{$ref:"#/$defs/slug"},{type:"null"}],description:"REGISTRY REFERENCE into the ingredient-class catalog (e.g. ingredient.flour.wheat.t65). Recipes reference a class, never a purchasable product — the shopping layer resolves class to product. HARDENED (SR-PR-002/DS-PR-003): null is schema-valid and marks an unresolved import (freshly-ingested, not yet mapped) — the semantic linter WARNS on null, the schema never errors; `raw` always survives for audit and re-parsing."},amount:{$ref:"#/$defs/quantity"},roles:{type:"array",items:{$ref:"#/$defs/role"}},component:{$ref:"#/$defs/slug",description:"This ingredient is produced by the named component."},prep:{type:"object",properties:{cut:{$ref:"#/$defs/slug"},state:{$ref:"#/$defs/slug"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},constraints:{type:"array",items:{$ref:"#/$defs/constraint"}},optional:{type:"boolean",default:!1},removed_after:{$ref:"#/$defs/slug",description:"Step id. For cultures/SCOBYs/aromatics present during the process but removed rather than consumed — excluded from final nutrition."},proposed_class:{$ref:"#/$defs/slug",description:"Extraction's proposed canonical ENGLISH class for an unresolved item (item: null) — the gap ledger groups by this so cross-language raws (cebola/onion) consolidate under one mint candidate (SR-REG-005). Never a mint; a proposal for the steward."},raw:{type:"string",description:"Original text as scraped or extracted. Preserved for audit and re-parsing even after canonical resolution."},note:{$ref:"#/$defs/text"}},additionalProperties:!1},constraint:{description:"Bounded quantity. A `critical` constraint may not be violated by scaling or substitution — the engine must refuse and explain, not silently produce an unsafe recipe. HARDENED (SR-PR-002): at least one bound is required — a constraint without bounds is not a constraint; ratio bounds require `of` naming the basis they are ratios of.",type:"object",required:["severity","reason"],anyOf:[{required:["min_ratio"]},{required:["max_ratio"]},{required:["min_value"]},{required:["max_value"]}],dependentRequired:{min_ratio:["of"],max_ratio:["of"]},properties:{min_ratio:{type:"number"},max_ratio:{type:"number"},min_value:{type:"number"},max_value:{type:"number"},of:{type:"string"},unit:{$ref:"#/$defs/unit"},severity:{enum:["info","warn","critical"]},reason:{$ref:"#/$defs/text"},source:{type:"string",format:"uri"}},additionalProperties:!1},duration:{description:"A window, never a bare number — lamination rests, cold retard and macaron skinning all fail on BOTH sides.",type:"object",anyOf:[{required:["target"]},{required:["min"]}],properties:{min:{$ref:"#/$defs/isoDuration"},target:{$ref:"#/$defs/isoDuration"},max:{$ref:"#/$defs/isoDuration"}},additionalProperties:!1},isoDuration:{type:"string",pattern:"^(\\d+(\\.\\d+)?(s|m|h|d|w))+$",description:"Compound durations allowed: 4h30m, 1h15m."},temperature:{description:"FOUR SHAPES: scalar; band with tolerance (crème anglaise 80-84C, where 86C is scrambled); a registry-backed named stage (sugar work, with fuzzy source-dependent boundaries); or a curve of waypoints (chocolate tempering: melt to cool to rework, all three differing by chocolate type).",type:"object",properties:{target:{type:"number"},min:{type:"number"},max:{type:"number"},falling_to:{type:"number"},unit:{enum:["C","F"],default:"C"},stage:{$ref:"#/$defs/slug",description:"Registry reference, e.g. soft-ball, hard-crack."},curve:{type:"array",items:{type:"object",required:["phase","target"],properties:{phase:{$ref:"#/$defs/slug"},target:{type:"number"},min:{type:"number"},max:{type:"number"}},additionalProperties:!1}},altitude_correction:{type:"object",properties:{per_300m:{type:"number"},unit:{enum:["C","F"]}},additionalProperties:!1},reason:{$ref:"#/$defs/text"}},additionalProperties:!1},endpoint:{description:"How you know it is ready. CLOSED ENUM on `kind`. Multiple endpoints coexist — '96C core OR hollow when tapped' is how people actually bake. Sensory endpoints are where per-step media earns its place; 'smells lactic, not putrid' resists numeric encoding entirely.",type:"object",required:["kind"],properties:{kind:{enum:["sensory","core-temperature","volume","pH","specific-gravity","visual","weight"]},test:{$ref:"#/$defs/slug"},expect:{$ref:"#/$defs/text"},op:{enum:["<","<=","=",">=",">"]},value:{type:["number","string"]},change:{type:"string",pattern:"^[+-]\\d+%$"},unit:{$ref:"#/$defs/unit"},stage:{type:"object",additionalProperties:!1,required:["class","id"],description:"Reference to a graded stage on a preparation class (DECISIONS #28). The class owns what the stage MEANS; this names which one the recipe is cooking to. When the recipe's own measurement falls outside the class's bounds for that stage, validation WARNS naming both and the MEASUREMENT WINS — books name stages loosely and an author who measured did so deliberately. A labelling disagreement, never a safety bound: severity-critical constraints stay fail-closed under the Calculus.",properties:{class:{$ref:"#/$defs/slug",description:"The registry class carrying the stages."},id:{type:"string",pattern:"^[a-z0-9][a-z0-9._-]*$",description:"The stage id within that class."}}}},additionalProperties:!1},trigger:{description:"When a scheduled event fires. FOUR SHAPES, one union: elapsed (V60 pour at 0:45), remaining (hop addition 20 min before boil-end), recurring (fold every 30min x4; burp daily), and measurement-triggered (rack when SG < 1.005 — no calendar date at all).",type:"object",required:["kind"],properties:{kind:{enum:["at_elapsed","at_remaining","recurring","on_measurement"]},at:{$ref:"#/$defs/isoDuration"},anchor:{enum:["step_start","step_end","process_start","process_end"]},first:{$ref:"#/$defs/isoDuration"},increment:{$ref:"#/$defs/isoDuration"},times:{type:"integer",minimum:1},until:{$ref:"#/$defs/endpoint"},measurement:{$ref:"#/$defs/slug"},op:{enum:["<","<=","=",">=",">"]},value:{type:"number"},action:{$ref:"#/$defs/slug"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},step:{type:"object",required:["id","primitive"],properties:{id:{$ref:"#/$defs/slug"},primitive:{description:"REGISTRY REFERENCE, versioned. Follows SPEC-008's rule: a new capability is a new id, never a repurposed one; params only ever grow optionally.",type:"object",required:["id","v"],properties:{id:{$ref:"#/$defs/slug"},v:{type:"integer",minimum:1}},additionalProperties:!1},after:{type:"array",items:{$ref:"#/$defs/slug"},description:"Step ids, component ids, OR produced-intermediate ids this depends on. Anchoring on an intermediate (massa-misturada) rather than a step id is what lets guarded alternative paths coexist: whichever active step `produces` it satisfies the dependency. OMIT for simple sequential order — the DAG is opt-in."},uses:{type:"array",items:{$ref:"#/$defs/slug"}},produces:{$ref:"#/$defs/slug",description:"Intermediate product, e.g. 'the poolish'."},track:{enum:["main","prep","overnight","day-before"]},section:{$ref:"#/$defs/slug",description:"Named method section this step belongs to (mistura, fermentacao, cozedura). Sections are the unit method-level substitutions can replace wholesale."},title:{$ref:"#/$defs/text"},body:{$ref:"#/$defs/text"},duration:{$ref:"#/$defs/duration"},temperature:{$ref:"#/$defs/temperature"},scales_with:{enum:["temperature","batch","thickness","none"]},scaling:{$ref:"#/$defs/scalingBehaviour"},until:{type:"array",items:{$ref:"#/$defs/endpoint"}},triggers:{type:"array",items:{$ref:"#/$defs/trigger"}},repeat:{type:"object",properties:{times:{type:"integer",minimum:1},until:{$ref:"#/$defs/endpoint"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},rest:{$ref:"#/$defs/duration"},equipment:{type:"array",items:{$ref:"#/$defs/slug"}},params:{type:"object",description:"Primitive-specific parameters (SPEC-008 paramValues): lamination geometry, fold type, pour weight. Validated by the primitive's ParamSpec in the registry, not by core.",additionalProperties:{type:["number","string","boolean"]}},media:{type:"array",items:{$ref:"#/$defs/media"}},cues:{description:"Troubleshooting: if you observe X, do Y. Structured, not buried in prose.",type:"array",items:{type:"object",required:["condition","action"],properties:{condition:{$ref:"#/$defs/text"},action:{$ref:"#/$defs/text"},severity:{enum:["info","warn","critical"]},recoverable:{type:"boolean",description:"False for irreversible failures like over-mixed macaronage."}},additionalProperties:!1}},when:{$ref:"#/$defs/guard"},constraints:{type:"array",items:{$ref:"#/$defs/constraint"}},note:{$ref:"#/$defs/text"},source:{$ref:"#/$defs/text"}},additionalProperties:!1},guard:{description:"Conditional content. A step or ingredient is active only when the guard matches the currently selected options. This ONE mechanism serves substitution deltas, equipment branches, execution modes and dietary transforms — four things four domain tracks independently asked for.",type:"object",properties:{execution_mode:{type:["string","array"]},equipment:{type:["string","array"]},substitution:{type:["string","array"]},diet:{type:["string","array"]},option:{type:["string","array"],description:"Matches when the named toggle option is on, or 'id:value' for a choice option."},not:{$ref:"#/$defs/guard"}},additionalProperties:!1},media:{type:"object",required:["role","type","uri","licence"],properties:{role:{enum:["technique","result","ingredient","equipment","failure"],description:"`failure` matters: kahm yeast vs mould is a photo, not a sentence."},type:{enum:["photo","video","audio","diagram"]},uri:{type:"string"},licence:{type:"string",description:"REQUIRED. This project runs two tiers deliberately: written heritage CC BY 4.0, media all rights reserved. A media model without a licence field quietly erases that."},credit:{type:"string"},source_url:{type:"string",format:"uri"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},equipmentRef:{type:"object",required:["ref"],properties:{ref:{$ref:"#/$defs/slug",description:"Registry reference to an equipment profile document."},role:{enum:["primary","vessel","mould","tool","measuring"]},required:{type:"boolean",default:!0,description:"False where the equipment is a convenience; true where it is a feasibility gate (brioche at 60% butter, Italian meringue)."},substitutes:{type:"array",items:{$ref:"#/$defs/slug"},description:"Swapping these triggers a method delta via the same mechanism as ingredient substitution."},note:{$ref:"#/$defs/text"}},additionalProperties:!1},substitution:{description:"Substitution targets are NOT only ingredients. `scope` says what is being swapped: an ingredient slot, a piece of equipment, one or more steps, a whole named section of the method (hand-knead vs mixer vs no-knead folds; steam vs bake), or an entire component sub-recipe (levain -> commercial-yeast prep). Method-level substitutions use `with_steps`; everything else uses `with`.",type:"object",required:["replaces","class"],anyOf:[{required:["with"]},{required:["with_steps"]}],properties:{scope:{enum:["ingredient","equipment","steps","section","component"],default:"ingredient"},replaces:{oneOf:[{$ref:"#/$defs/slug"},{type:"array",items:{$ref:"#/$defs/slug"}}]},with:{$ref:"#/$defs/slug"},with_steps:{type:"array",items:{$ref:"#/$defs/step"},description:"Replacement steps when scope is steps/section. Must produce the same intermediate (`produces`) as the replaced ones so downstream steps still resolve."},ratio:{type:"number"},amount:{$ref:"#/$defs/quantity"},formula:{type:"string",description:"Closed arithmetic grammar, never eval. E.g. hop substitution by alpha-acid units."},class:{enum:["direct","quantity-forcing","technique-forcing","balance-forcing","compensation-forcing","computed","method-changing"],description:"What else must be recomputed or warned about. `compensation-forcing`: one swap requires correlated additions (NA spirit needs added acid + tannin)."},quality:{type:"integer",minimum:1,maximum:5},tested:{type:"boolean"},preserves:{type:"array",items:{$ref:"#/$defs/role"}},loses:{type:"array",items:{$ref:"#/$defs/role"}},tags:{type:"array",items:{$ref:"#/$defs/slug"}},requires_additions:{type:"array",items:{$ref:"#/$defs/ingredient"}},when_applied:{description:"The method delta. See 06-substitution-model.md.",type:"object",properties:{remove_steps:{type:"array",items:{$ref:"#/$defs/slug"}},add_steps:{type:"array",items:{$ref:"#/$defs/step"}},patch:{type:"array",items:{type:"object",required:["step","set"],properties:{step:{$ref:"#/$defs/slug"},set:{type:"object"}},additionalProperties:!1}},warn:{$ref:"#/$defs/text"}},additionalProperties:!1},source:{type:"string",format:"uri"},note:{$ref:"#/$defs/text"}},additionalProperties:!1},executionMode:{description:"The same recipe executed differently. Dilution is the canonical case: water that ice contributes for free to a stirred drink must become an explicit measured ingredient when batching, or the batch is ~20% over-strength.",type:"object",required:["id"],properties:{id:{$ref:"#/$defs/slug"},technique:{$ref:"#/$defs/slug"},equipment:{type:"array",items:{$ref:"#/$defs/slug"}},dilution:{type:"object",properties:{ratio:{type:"number"},of:{type:"string"},source:{enum:["ice","added-water","none"]}},additionalProperties:!1},adds_ingredient:{$ref:"#/$defs/ingredient"},warn:{$ref:"#/$defs/text"}},additionalProperties:!1},yield:{type:"object",properties:{units:{type:"number"},unit_weight:{$ref:"#/$defs/quantity"},servings:{type:"number"},serving_volume:{$ref:"#/$defs/quantity"},total:{$ref:"#/$defs/quantity"},loss:{type:"number",description:"Fractional loss between raw and finished, e.g. baker's loss ~0.12."},variable:{type:"boolean",description:"True where yield genuinely cannot be predicted, e.g. oleo saccharum."}},additionalProperties:!1},provenance:{description:"First-class, and disagreement is data. Almost nobody else models this; for a heritage archive it is the whole point.",type:"object",properties:{confidence:{enum:["HIGH","MEDIUM-HIGH","MEDIUM","LOW"]},notes:{$ref:"#/$defs/text",description:"Provenance working notes — where per-ingest judgment calls are recorded (e.g. the DS-PR-006 hat-scale-to-1..5 difficulty mapping, a storage-location reading the book left implicit). ADDITION during PLAN-rcp-v02 Phase 8: DS-PR-006 mandated the record but no field existed."},status:{enum:["draft","unverified","published","archived"]},sources:{type:"array",items:{type:"object",required:["label"],properties:{label:{type:"string"},url:{type:"string",format:"uri"},type:{enum:["official","academic","press","testimony","blog","book"]},work:{type:"string",description:"Publication/book title (DS-PR-008) — the work the page reference points into."},page:{type:"string",description:"Page reference as a string: admits '123', '123-125', 'xii' (DS-PR-008)."}},additionalProperties:!1}},witnesses:{type:"array",items:{type:"object",properties:{name:{type:"string"},role:{$ref:"#/$defs/text"},place:{type:"string"},quote:{$ref:"#/$defs/text"},source:{type:"string"}},additionalProperties:!1}},divergences:{description:"Recorded disagreements between sources, deliberately left unresolved.",type:"array",items:{type:"object",required:["topic","versions"],properties:{topic:{$ref:"#/$defs/text"},versions:{type:"array",items:{type:"object",properties:{claim:{$ref:"#/$defs/text"},source:{type:"string"}},additionalProperties:!1}}},additionalProperties:!1}},verified:{type:"object",properties:{by:{type:"string"},role:{$ref:"#/$defs/text"},place:{type:"string"},date:{type:"string",format:"date"}},additionalProperties:!1}},additionalProperties:!1},import:{description:"Ingestion metadata. Capture loosely, resolve canonically later, never block on perfect identity resolution. Imported recipes land unverified — for this archive an import is a lead, not a publication.",type:"object",properties:{source_url:{type:"string",format:"uri"},method:{enum:["json-ld","microdata","opengraph","selector","vision-llm","manual"]},extracted_at:{type:"string",format:"date-time"},extractor:{type:"string"},field_confidence:{type:"object",additionalProperties:{type:"number",minimum:0,maximum:1}},unresolved:{type:"array",items:{type:"string"},description:"Paths the extractor could not resolve to registry values. It emits null and keeps `raw`; it never invents."}},additionalProperties:!1},collectionId:{type:"string",minLength:1,maxLength:200,pattern:"^[^\\s]+$",description:"A collection identifier — an opaque string in its own value space, deliberately separate from the recipe `id` slug so a distribution layer can use domains or URIs here without widening the frozen id pattern."},lineageRef:{description:"A pointer to another document, in componentRef's shape: the target id, an OPTIONAL collection qualifier (required only when crossing collections — an unqualified pointer resolves in this document's own collection), and an OPTIONAL pinned revision. Pinning is what makes drift DETECTABLE: when the target moves past the pinned revision, validation reports staleness naming both. Compiled variants were considered and rejected (DECISIONS #29) — a variant is a self-contained snapshot, so detection replaces propagation.",oneOf:[{$ref:"#/$defs/slug",description:"Shorthand: the target id, unqualified and unpinned."},{type:"object",additionalProperties:!1,required:["id"],properties:{id:{$ref:"#/$defs/slug",description:"The target document's id."},collection:{$ref:"#/$defs/collectionId",description:"The target's collection. REQUIRED when the pointer crosses collections; omitted means this document's own collection."},version:{type:"integer",minimum:1,description:"Pinned revision of the target. When the target declares a later revision, validation reports staleness; when the target declares a DIFFERENT revision than pinned, that is a mismatch and fails."}}}]},variantAxis:{type:"string",enum:["consistency","other"],description:"WHAT KIND of difference makes this a variant — the machine-readable half of the discriminator (variant_label is the human half and is never machine-read). Seeded ONLY from axes real documents exercise, the same discipline the registry follows: `consistency` comes from the graded white-sauce family (1½ → 2 → 3 tablespoons → ⅓ cup flour, everything else identical); `other` is the catch-all, mandatory from day one so an unlisted axis decodes rather than failing (decode-compat, DECISIONS #14). Adding an axis later is an ADDITION, never a MODEL bump — so waiting for evidence costs nothing, while shipping a value nothing resolves against costs credibility. Candidates awaiting a document that needs them: equipment (the Bimby fork), technique, region, season, scale.\n\nA VARIANT is not a STAGE. A stage is one preparation whose identity forks on a measured checkpoint — same ingredients, different endpoint (Escoffier's roux blanc/blond/brun differ only by cook time; the pontos de açúcar by temperature); stages live on the preparation class and are referenced by a recipe's endpoint. A variant is a parallel preparation with DIFFERENT INPUTS, coexisting as its own document. Encoding one as the other is the mistake this line exists to prevent."},variantDiscriminator:{type:"object",additionalProperties:!1,required:["axis"],description:"The machine-readable answer to 'what makes this the variant it is'. OPTIONAL: a variant without one stay   pt: Torta de três camadas (documento de teste)

description:
  pt: Documento sintético para testar o visualizador — três camadas, duas delas sub-receitas.
media:
  - role: result

  - cake

tags:
- classic
times:
  active:

  total:

    target: 5h
  prep:
    target: 40m
  cook:
    target: 30m
  chill:
    min: 2h
    max: 12h
storage:
- where: refrigerator
  container:
    pt: Caixa hermética
  duration:
    min: 2d
    max: 3d
  note:
    pt: Retirar 30 minutos antes de servir.
- where: freezer
  duration:
    target: 3w
  note:
    pt: Congelar sem a cobertura.

  confidence: LOW
  status: draft
  sources:
  - label: Documento sintético de teste

  flour:

      roles:
      - flour

  amount:

    unit: g
  roles:
  - binder
  - hydration

  item: ingredient.raising.baking-powder
  amount:
    ratio: 0.04
    of: flour
  roles:
  - leaven

- id: ganache-cobertura
  kind: component
  name:
    pt: Ganache de cobertura
  ingredients:
  - id: chocolate
    item: ingredient.chocolate.dark.70
    amount:
      value: 200
      unit: g
    roles:
    - flavour
    - thickener
  - id: natas
    item: ingredient.dairy.cream.35
    amount:
      value: 200
      unit: g
    roles:
    - fat
    - hydration
  steps:
  - id: g1
    primitive:
      id: primitive.melt
      v: 1
    uses:
    - chocolate
  - id: g2
    primitive:
      id: primitive.emulsify
      v: 1
    uses:
    - natas
    after:
    - g1
- id: calda-cafe
  kind: component
  name:
    pt: Calda para embeber
  ingredients:
  - id: agua-calda
    item: ingredient.water
    amount:
      value: 100
      unit: g
    roles:
    - hydration
  - id: acucar-calda
    item: ingredient.sweetener.sugar.white
    amount:
      value: 80
      unit: g
    roles:
    - sweetener
  steps:
  - id: c1
    primitive:
      id: primitive.cook-syrup
      v: 1
    uses:
    - agua-calda
    - acucar-calda
    until:
    - kind: core-temperature
      value: 104
      unit: C
steps:
- id: s1
  title:
    pt: Bater a manteiga com o açúcar até ficar clara e fofa.
  primitive:
    id: primitive.mix
    v: 1
  uses:
  - manteiga
  - acucar
- id: s2
  title:
    pt: Incorporar os ovos, depois a farinha com o fermento.
  primitive:
    id: primitive.incorporate
    v: 1
  uses:
  - ovos
  - farinha
  - fermento
  after:
  - s1
- id: s3
  title:
    pt: Cozer em forma untada.
  primitive:
    id: primitive.bake
    v: 1
  duration:
    min: 25m
    target: 30m
    max: 35m
  until:
  - kind: visual
    expect: palito sai seco
  after:
  - s2
- id: s4
  title:
    pt: Arrefecer completamente antes de montar.
  primitive:
    id: primitive.cool
    v: 1
  after:
  - s3
- id: s5
  title:
    pt: Montar em camadas, embeber com a calda, cobrir com a ganache.
  primitive:
    id: primitive.assemble
    v: 1
  after:
  - s4
  uses:
  - ganache-cobertura
  - calda-cafe
options:
- id: sem-calda
  kind: toggle
  default: false
  label:
    pt: Versão sem calda (mais firme)
substitutions:
- scope: ingredient
  replaces: manteiga
  class: direct
  with: ingredient.fat.olive-oil
  note:
    pt: Versão com azeite — textura mais densa, sabor mais rústico.
