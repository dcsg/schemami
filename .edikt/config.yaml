# .edikt/config.yaml — generated by edikt:init
edikt_version: 0.6.0
base: docs

# Harness language undecided until SPEC picks it (likely TypeScript for ajv).
# Empty stack = agent templates install unfiltered; add the language here
# (and its rule pack) when the choice lands.
stack: []

paths:
  decisions: docs/architecture/decisions
  invariants: docs/architecture/invariants
  plans: docs/plans
  specs: docs/product/specs
  prds: docs/product/prds
  guidelines: docs/guidelines
  reports: docs/reports
  project-context: docs/project-context.md

rules:
  code-quality: { include: all }
  testing: { include: all }
  security: { include: all }
  error-handling: { include: all }
  architecture: { include: all }

# Toggle optional behaviors. All default to true.
# The governance core (rules, compile, drift, review-governance) is always on.
features:
  auto-format: true
  session-summary: true
  signal-detection: true
  plan-injection: true
  quality-gates: true

# Post-flight review composition.
# Auto-fires from phase-end-detector.sh after L1 PASS; composes L1 (criteria
# verify) + L2 (governance verifier) + L3 (specialist routing) + synthesis.
# Kill-switch env var: EDIKT_DISABLE_POST_FLIGHT=1 (overrides config).
post-flight:
  enabled: true
  specialists:
    required: []
    auto: ['*']
    never: []

artifacts:
  database:
    # Protocol repo: persistence is app-side per decisions #19/#21.
    # auto = detect from spec each time; no DB is expected in this repo.
    default_type: auto

  fixtures:
    # Fixture format. yaml is portable — transform to your stack at implementation time.
    format: yaml

  versions:
    # Spec versions for generated artifacts. Override if your team pins older versions.
    # openapi: "3.1.0"
    # asyncapi: "3.0.0"
    # json_schema: "https://json-schema.org/draft/2020-12/schema"

sdlc:
  # Plain imperative why-focused messages (see CLAUDE.md), not conventional commits.
  commit-convention: none
  pr-template: false

# Gate severity thresholds per agent domain. Override via EDIKT_GATE_SEVERITY_THRESHOLD.
# Values: critical (default) | warning | info
gates:
  security: warning
  dba: critical
  sre: warning
  architect: warning
  performance: critical
  api: warning
  default: critical
