  - text: "The v0.2 engine MUST be JavaScript: YAML 1.2 parse plus a JSON Schema 2020-12 validator, with a runtime dependency budget of **at most 2 exact-pinned packages** and **zero UI dependencies** (vanilla DOM). (ref: ADR-002)"
