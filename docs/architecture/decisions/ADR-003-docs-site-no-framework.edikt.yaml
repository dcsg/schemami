# yaml-language-server: $schema=../../../../templates/schemas/gov-sidecar.v1.schema.json
# Governance sidecar — co-located with an ADR / invariant / guideline .md.
# Edit prose in the parent .md, then re-run /edikt:adr:compile to regenerate.

schema_version: 1
topic: "tooling"
path: "docs/architecture/decisions/ADR-003-docs-site-no-framework.md"

signals:
  - "documentation site"
  - "static site generator"
  - "docs framework"
  - "dependency freeze"
  - "markdown rendering"
  - "schema rendering"
  - "site navigation"
  - "no egress"

paths:
  - tools/docsite/**
  - tools/rcplint/scripts/accept.sh

directives:
  - text: "The documentation site MUST be generated by a plain Bun script in `tools/docsite/`, with `marked` as its single dependency. A documentation framework MUST NOT be introduced. (ref: ADR-003)"
    source_excerpt:
      line_start: 62
      line_end: 64
      quote: "**The site is generated by a plain Bun script in `tools/docsite/`, with `marked` as its single dependency. No documentation framework.**"

  - text: "The JSON Schema reference pages MUST be rendered by our own code that walks `$defs` and renders `$ref` as a link, rather than dereferencing — no off-the-shelf renderer preserves our `$defs` description prose or produces JSON-Pointer-shaped anchors. (ref: ADR-003)"
    source_excerpt:
      line_start: 82
      line_end: 85
      quote: "**We must hand-roll the schema renderer regardless.** Since no tool renders our schema faithfully, the largest single piece of work is ours either way."

  - text: "The dependency freeze widens by exactly one entry, from two to three; DEP-FREEZE MUST be updated to assert the new EXACT set and MUST NOT be relaxed to a maximum. (ref: ADR-003)"
    source_excerpt:
      line_start: 102
      line_end: 104
      quote: "**The dependency freeze widens by exactly one entry**, from two to three, and DEP-FREEZE is updated to assert the new exact set. The gate stays exact — it is not relaxed to a maximum."

  - text: "Because no framework supplies them, navigation, typography and layout MUST be treated as engineering deliverables with their own acceptance criterion (FR-DOC-006 in PRD-005), not as incidental styling. (ref: ADR-003)"
    source_excerpt:
      line_start: 106
      line_end: 109
      quote: "**Because the framework is not providing navigation, typography or layout, those become explicit engineering work with their own requirement** — see FR-DOC-006 in PRD-005."

  - text: "Site output MUST use relative paths so it works from `file://` and from any static bucket, matching the viewer's existing posture. (ref: ADR-003)"
    source_excerpt:
      line_start: 96
      line_end: 98
      quote: "**Relative-path output keeps `file://` working**, matching the viewer's existing posture."

  - text: "A mise/Bun setup step MUST be added to CI before the site drift gate can run there — the current workflow installs Go only. (ref: ADR-003)"
    source_excerpt:
      line_start: 124
      line_end: 127
      quote: "**Prerequisite this surfaces.** CI installs Go only (`.github/workflows/validate.yml`), so it cannot run Bun today. A mise/Bun setup step is a hard prerequisite for the drift gate running in CI at all."

prohibitions:
  - text: "A hand-rolled Markdown subset renderer MUST NOT be used for normative documents — a subtly wrong renderer damages exactly the pages that must not lie. (ref: ADR-003)"
    source_excerpt:
      line_start: 92
      line_end: 95
      quote: "A hand-rolled Markdown subset was rejected: a spec document is exactly where a subtly wrong renderer does damage, and a mangled table in `VERSIONING.md` is a lying page — the failure this whole cut exists to prevent."

manual_directives: []

suppressed_directives: []

reminders:
  - "ADR-003 rejected Starlight, whose main value was the navigation and theme we now owe by hand. If the hand-rolled manual is worse to navigate than a themed framework would have been, this decision was wrong and should be revisited — not defended."

verification: []
