directives:
  - text: "Every addition or change to a registry vocabulary MUST be approved by him — today that means his own PRs; tomorrow it means he reviews others'. (ref: registry-governance)"
    source_excerpt:
      line_start: 10
      line_end: 12
      quote: "Every addition or change to a registry vocabulary is approved by him — today that means his own PRs; tomorrow it means he reviews others'."

  - text: "Additions via PR, never direct edits — even solo. (ref: registry-governance)"
    source_excerpt:
      line_start: 13
      line_end: 13
      quote: "Additions via PR, never direct edits — even solo."

  - text: "The PR description MUST state *why* the entry is needed (which recipe or profile demanded it). (ref: registry-governance)"
    source_excerpt:
      line_start: 13
      line_end: 14
      quote: "The PR description states *why* the entry is needed (which recipe or profile demanded it)."

  - text: "Registry entries are never deleted or repurposed. (ref: registry-governance)"
    source_excerpt:
      line_start: 15
      line_end: 15
      quote: "Registry entries are never deleted or repurposed."

  - text: "Mistakes MUST be handled by deprecating the entry (marked, kept resolvable) and adding a corrected one. (ref: registry-governance)"
    source_excerpt:
      line_start: 16
      line_end: 17
      quote: "Mistakes are handled by deprecating the entry (marked, kept resolvable) and adding a corrected one."

  - text: "Published recipes MUST keep resolving forever. (ref: registry-governance)"
    source_excerpt:
      line_start: 17
      line_end: 17
      quote: "Published recipes must keep resolving forever."

  - text: "Registry changes MUST bump the registry version; recipes MUST reference entries by stable ID, and publish-time resolution MUST pin resolver_version + content hashes (engineering obligation #3). (ref: registry-governance)"
    source_excerpt:
      line_start: 18
      line_end: 20
      quote: "Registry changes bump the registry version; recipes reference entries by stable ID, and publish-time resolution pins resolver_version + content hashes (engineering obligation #3)."

  - text: "IDs MUST be stable, lowercase, dot-namespaced English slugs (`ingredient.flour.wheat.t65`, `primitive.fold`, `equipment.oven.deck`). (ref: registry-governance)"
    source_excerpt:
      line_start: 22
      line_end: 23
      quote: "IDs are stable, lowercase, dot-namespaced English slugs (`ingredient.flour.wheat.t65`, `primitive.fold`, `equipment.oven.deck`)."

  - text: "IDs never encode display names and never change once merged. (ref: registry-governance)"
    source_excerpt:
      line_start: 24
      line_end: 24
      quote: "IDs never encode display names and never change once merged."

  - text: "Flour types are always explicit (T65, T80, T130, …). (ref: registry-governance)"
    source_excerpt:
      line_start: 25
      line_end: 25
      quote: "Flour types are always explicit (T65, T80, T130, …)."

  - text: "Display names may be localized (pt-PT terms kept exact — massa velha ≠ isco); the ID is not. (ref: registry-governance)"
    source_excerpt:
      line_start: 26
      line_end: 27
      quote: "Display names may be localized (pt-PT terms kept exact — massa velha ≠ isco); the ID is not."

  - text: "Required fields before merge MUST include: stable ID, kind (ingredient class / primitive / equipment profile), display name, definition prose, and the machine-read fields the schema demands for that kind (e.g. functional roles for ingredient classes, parameters for equipment profiles). (ref: registry-governance)"
    source_excerpt:
      line_start: 28
      line_end: 31
      quote: "Required fields before merge: stable ID, kind (ingredient class / primitive / equipment profile), display name, definition prose, and the machine-read fields the schema demands for that kind (e.g. functional roles for ingredient classes, parameters for equipment profiles)."

  - text: "An entry that a machine reads MUST be complete for the maths it participates in. (ref: registry-governance)"
    source_excerpt:
      line_start: 31
      line_end: 33
      quote: "An entry that a machine reads must be complete for the maths it participates in."

  - text: "The extraction pipeline may only map to existing registry entries or flag a gap for review — it never mints IDs. (ref: registry-governance)"
    source_excerpt:
      line_start: 34
      line_end: 36
      quote: "The extraction pipeline may only map to existing registry entries or flag a gap for review — it never mints IDs."

  - text: "New entries always arrive through this process. (ref: registry-governance)"
    source_excerpt:
