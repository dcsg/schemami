directives:
  - text: "Every PRD functional requirement MUST use a component-coded ID of the form `FR-<CODE>-NNN`, numbered per component from 001. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 18
      line_end: 19
      quote: "- Every PRD functional requirement MUST use a component-coded ID of the\n  form `FR-<CODE>-NNN`, numbered per component from 001."
  - text: "New components MUST be added to this guideline (new code) before use — never invented ad hoc. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 21
      line_end: 22
      quote: "New components MUST be added\n  to this guideline (new code) before use — never invented ad hoc."
  - text: "Every PRD requirement MUST carry a `component:` field naming its component and a `trace:` list referencing at least one DECISIONS.md entry, research file, or recorded inventory that justifies it. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 23
      line_end: 25
      quote: "- Every PRD requirement MUST carry a `component:` field naming its\n  component and a `trace:` list referencing at least one DECISIONS.md\n  entry, research file, or recorded inventory that justifies it."
  - text: "Acceptance criteria MUST inherit their FR's code and number (`AC-<CODE>-NNN-M`), so the component is readable from any AC id. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 26
      line_end: 27
      quote: "- Acceptance criteria MUST inherit their FR's code and number\n  (`AC-<CODE>-NNN-M`), so the component is readable from any AC id."
  - text: "Every SPEC item MUST reference the FR and/or AC ids it implements; a SPEC item implementing nothing traceable MUST NOT exist. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 28
      line_end: 29
      quote: "- Every SPEC item MUST reference the FR and/or AC ids it implements; a SPEC\n  item implementing nothing traceable MUST NOT exist."
  - text: "Every generated artifact (data model, contract, fixture) MUST carry the spec-item or FR ids it realizes, in its header or sidecar metadata. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 30
      line_end: 31
      quote: "- Every generated artifact (data model, contract, fixture) MUST carry the\n  spec-item or FR ids it realizes, in its header or sidecar metadata."
  - text: "Every plan phase MUST list the FR/AC ids it delivers, and its verify criteria MUST map to those ACs. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 32
      line_end: 33
      quote: "- Every plan phase MUST list the FR/AC ids it delivers, and its verify\n  criteria MUST map to those ACs."
  - text: "Sidecars (PRD, SPEC, plan) MUST preserve the id chain unbroken so drift checks can walk PRD → SPEC → plan → code mechanically. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 34
      line_end: 35
      quote: "- Sidecars (PRD, SPEC, plan) MUST preserve the id chain unbroken so drift\n  checks can walk PRD → SPEC → plan → code mechanically."
  - text: "NEVER rename or renumber a coded ID after the owning artifact leaves draft status — IDs are frozen at acceptance; corrections happen by deprecating and adding. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 36
      line_end: 38
      quote: "- NEVER rename or renumber a coded ID after the owning artifact leaves\n  draft status — IDs are frozen at acceptance; corrections happen by\n  deprecating and adding."
  - text: "NEVER introduce a deliverable without a trace — \"no decision, no work\" is the default; the escape hatch is recording the decision first. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 39
      line_end: 40
      quote: "- NEVER introduce a deliverable without a trace — \"no decision, no work\" is\n  the default; the escape hatch is recording the decision first."

