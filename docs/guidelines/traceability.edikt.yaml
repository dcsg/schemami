directives:
  - text: "Every PRD functional requirement MUST use a component-coded ID of the form `FR-<CODE>-NNN`, numbered per component from 001. (ref: traceability)"
    source_excerpt:
      line_start: 18
      line_end: 19
      quote: "Every PRD functional requirement MUST use a component-coded ID of the\nform `FR-<CODE>-NNN`, numbered per component from 001."

  - text: "New components MUST be added to this guideline (new code) before use — never invented ad hoc. (ref: traceability)"
    source_excerpt:
      line_start: 21
      line_end: 22
      quote: "New components MUST be added\nto this guideline (new code) before use — never invented ad hoc."

  - text: "Every PRD requirement MUST carry a `component:` field naming its component and a `trace:` list referencing at least one DECISIONS.md entry, research file, or recorded inventory that justifies it. (ref: traceability)"
    source_excerpt:
      line_start: 23
      line_end: 25
      quote: "Every PRD requirement MUST carry a `component:` field naming its\ncomponent and a `trace:` list referencing at least one DECISIONS.md\nentry, research file, or recorded inventory that justifies it."

  - text: "Acceptance criteria MUST inherit their FR's code and number (`AC-<CODE>-NNN-M`), so the component is readable from any AC id. (ref: traceability)"
    source_excerpt:
      line_start: 26
      line_end: 27
      quote: "Acceptance criteria MUST inherit their FR's code and number\n(`AC-<CODE>-NNN-M`), so the component is readable from any AC id."

  - text: "Every SPEC item MUST reference the FR and/or AC ids it implements; a SPEC item implementing nothing traceable MUST NOT exist. (ref: traceability)"
    source_excerpt:
      line_start: 28
      line_end: 29
      quote: "Every SPEC item MUST reference the FR and/or AC ids it implements; a SPEC\nitem implementing nothing traceable MUST NOT exist."

  - text: "Anything that must be implemented MUST carry an id: requirements as `SR-<CODE>-NNN`, design decisions as `DS-<CODE>-NNN`, buildable units as `CMP-<CODE>-NNN` (in the spec sidecar's `design:` block, each with a `serves:` list of SR ids), acceptance checks as `AC`/`SAC`. (ref: traceability)"
    source_excerpt:
      line_start: 30
      line_end: 34
      quote: "**Anything that must be\nimplemented MUST carry an id**: requirements as `SR-<CODE>-NNN`, design\ndecisions as `DS-<CODE>-NNN`, buildable units as `CMP-<CODE>-NNN` (in the\nspec sidecar's `design:` block, each with a `serves:` list of SR ids),\nacceptance checks as `AC`/`SAC`."

  - text: "Plan phases, commits, and adjustments MUST cite the DS/CMP/SR ids they build or change; adjusting a DS appends a revision_history entry naming the id, sets its status to `adjusted`, and its `serves:` SRs and their ACs MUST be re-checked. (ref: traceability)"
    source_excerpt:
      line_start: 36
      line_end: 39
      quote: "Plan phases, commits, and adjustments MUST cite the DS/CMP/SR ids they\nbuild or change; adjusting a DS appends a revision_history entry naming\nthe id, sets its status to `adjusted`, and its `serves:` SRs and their\nACs MUST be re-checked."

  - text: "Every generated artifact (data model, contract, fixture) MUST carry the spec-item or FR ids it realizes, in its header or sidecar metadata. (ref: traceability)"
    source_excerpt:
      line_start: 40
      line_end: 41
      quote: "Every generated artifact (data model, contract, fixture) MUST carry the\nspec-item or FR ids it realizes, in its header or sidecar metadata."

  - text: "Every plan phase MUST list the FR/AC ids it delivers, and its verify criteria MUST map to those ACs. (ref: traceability)"
    source_excerpt:
      line_start: 42
      line_end: 43
      quote: "Every plan phase MUST list the FR/AC ids it delivers, and its verify\ncriteria MUST map to those ACs."

  - text: "Sidecars (PRD, SPEC, plan) MUST preserve the id chain unbroken so drift checks can walk PRD → SPEC → plan → code mechanically. (ref: traceability)"
    source_excerpt:
      line_start: 44
      line_end: 45
      quote: "Sidecars (PRD, SPEC, plan) MUST preserve the id chain unbroken so drift\nchecks can walk PRD → SPEC → plan → code mechanically."

  - text: "NEVER rename or renumber a coded ID after the owning artifact leaves draft status — IDs are frozen at acceptance; corrections happen by deprecating and adding. (ref: traceability)"
    source_excerpt:
      line_start: 46
      line_end: 48
      quote: "NEVER rename or renumber a coded ID after the owning artifact leaves\ndraft status — IDs are frozen at acceptance; corrections happen by\ndeprecating and adding."

  - text: "NEVER introduce a deliverable without a trace — \"no decision, no work\" is the default; the escape hatch is recording the decision first. (ref: traceability)"
    source_excerpt:
      line_start: 49
      line_end: 50
      quote: "NEVER introduce a deliverable without a trace — \"no decision, no work\" is\nthe default; the escape hatch is recording the decision first."

