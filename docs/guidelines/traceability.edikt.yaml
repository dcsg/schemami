schema_version: 1
topic: "data-model"
path: "docs/guidelines/traceability.md"

signals:
  - "component-coded id"
  - "feat id"
  - "spec item"
  - "acceptance criteria"
  - "plan phase"
  - "sidecar"
  - "id chain"
  - "trace list"
  - "features.yaml"
  - "decisions.md entry"

paths:
  - "docs/product/**/*.yaml"
scope: [implementation, review]

directives:
  - text: "Features are the top of the chain: every product feature MUST have a `FEAT-<AREA>-NNN` entry in `docs/product/features.yaml` (areas are defined in that file's header; a new area MUST be added there before use). (ref: guideline-traceability)"
    source_excerpt:
      line_start: 18
      line_end: 21
      quote: "Features are the top of the chain: every product feature MUST have a `FEAT-<AREA>-NNN` entry in `docs/product/features.yaml` (areas are defined in that file's header; a new area MUST be added there before use)."

  - text: "Every PRD FR MUST trace to a FEAT id (first entry of its `trace:` list). (ref: guideline-traceability)"
    source_excerpt:
      line_start: 21
      line_end: 22
      quote: "Every PRD FR MUST trace to a FEAT id (first entry of its `trace:` list)."

  - text: "Non-goals in any PRD or SPEC MUST reference the FEAT id they defer, or a DECISIONS entry when no feature exists yet. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 22
      line_end: 23
      quote: "Non-goals in any PRD or SPEC MUST reference the FEAT id they defer, or a DECISIONS entry when no feature exists yet."

  - text: "Deferred and external features MUST NOT carry implementation ids until they graduate into a PRD, recorded via `graduates_to:`. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 24
      line_end: 25
      quote: "Deferred and external features carry NO implementation ids until they graduate into a PRD, recorded via `graduates_to:`."

  - text: "Every PRD functional requirement MUST use a component-coded ID of the form `FR-<CODE>-NNN`, numbered per component from 001. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 26
      line_end: 27
      quote: "Every PRD functional requirement MUST use a component-coded ID of the form `FR-<CODE>-NNN`, numbered per component from 001."

  - text: "The codes MUST be: `PR` `protocol-core`, `REG` `registry`, `PROF` `profiles`, `VAL` `validator`, `SAFE` `safety-clamp`, `TOOL` `developer tooling (viewer/playground)`, `I18N` `localization layer` (added 2026-08-02 for PRD-002), `CALC` `recipe calculus — the cook-time pure-function library and its conformance vectors` (added 2026-08-03 for PRD-003). (ref: guideline-traceability)"
    source_excerpt:
      line_start: 27
      line_end: 32
      quote: "The codes are: `PR` `protocol-core`, `REG` `registry`, `PROF` `profiles`, `VAL` `validator`, `SAFE` `safety-clamp`, `TOOL` `developer tooling (viewer/playground)`, `I18N` `localization layer` (added 2026-08-02 for PRD-002), `CALC` `recipe calculus — the cook-time pure-function library and its conformance vectors` (added 2026-08-03 for PRD-003)."

  - text: "New components MUST be added to this guideline (new code) before use — never invented ad hoc. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 33
      line_end: 34
      quote: "New components MUST be added to this guideline (new code) before use — never invented ad hoc."

  - text: "Every PRD requirement MUST carry a `component:` field naming its component and a `trace:` list referencing at least one DECISIONS.md entry, research file, or recorded inventory that justifies it. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 37
      line_end: 39
      quote: "Every PRD requirement MUST carry a `component:` field naming its component and a `trace:` list referencing at least one DECISIONS.md entry, research file, or recorded inventory that justifies it."

  - text: "Acceptance criteria MUST inherit their FR's code and number (`AC-<CODE>-NNN-M`), so the component is readable from any AC id. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 40
      line_end: 41
      quote: "Acceptance criteria MUST inherit their FR's code and number (`AC-<CODE>-NNN-M`), so the component is readable from any AC id."

  - text: "Every SPEC item MUST reference the FR and/or AC ids it implements; a SPEC item implementing nothing traceable MUST NOT exist. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 42
      line_end: 43
      quote: "Every SPEC item MUST reference the FR and/or AC ids it implements; a SPEC item implementing nothing traceable MUST NOT exist."

  - text: "**Anything that must be implemented MUST carry an id**: requirements as `SR-<CODE>-NNN`, design decisions as `DS-<CODE>-NNN`, buildable units as `CMP-<CODE>-NNN` (in the spec sidecar's `design:` block, each with a `serves:` list of SR ids), acceptance checks as `AC`/`SAC`. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 44
      line_end: 48
      quote: "**Anything that must be implemented MUST carry an id**: requirements as `SR-<CODE>-NNN`, design decisions as `DS-<CODE>-NNN`, buildable units as `CMP-<CODE>-NNN` (in the spec sidecar's `design:` block, each with a `serves:` list of SR ids), acceptance checks as `AC`/`SAC`."

  - text: "Plan phases, commits, and adjustments MUST cite the DS/CMP/SR ids they build or change; adjusting a DS appends a revision_history entry naming the id, sets its status to `adjusted`, and its `serves:` SRs and their ACs MUST be re-checked. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 50
      line_end: 53
      quote: "Plan phases, commits, and adjustments MUST cite the DS/CMP/SR ids they build or change; adjusting a DS appends a revision_history entry naming the id, sets its status to `adjusted`, and its `serves:` SRs and their ACs MUST be re-checked."

  - text: "Every generated artifact (data model, contract, fixture) MUST carry the spec-item or FR ids it realizes, in its header or sidecar metadata. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 54
      line_end: 55
      quote: "Every generated artifact (data model, contract, fixture) MUST carry the spec-item or FR ids it realizes, in its header or sidecar metadata."

  - text: "Every plan phase MUST list the FR/AC ids it delivers, and its verify criteria MUST map to those ACs. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 56
      line_end: 57
      quote: "Every plan phase MUST list the FR/AC ids it delivers, and its verify criteria MUST map to those ACs."

  - text: "Sidecars (PRD, SPEC, plan) MUST preserve the id chain unbroken so drift checks can walk PRD → SPEC → plan → code mechanically. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 58
      line_end: 59
      quote: "Sidecars (PRD, SPEC, plan) MUST preserve the id chain unbroken so drift checks can walk PRD → SPEC → plan → code mechanically."

  - text: "NEVER rename or renumber a coded ID after the owning artifact leaves draft status — IDs are frozen at acceptance; corrections happen by deprecating and adding. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 60
      line_end: 62
      quote: "NEVER rename or renumber a coded ID after the owning artifact leaves draft status — IDs are frozen at acceptance; corrections happen by deprecating and adding."

  - text: "NEVER introduce a deliverable without a trace — \"no decision, no work\" is the default; the escape hatch is recording the decision first. (ref: guideline-traceability)"
    source_excerpt:
      line_start: 63
      line_end: 64
      quote: "NEVER introduce a deliverable without a trace — \"no decision, no work\" is the default; the escape hatch is recording the decision first."

manual_directives: []
suppressed_directives: []
reminders: []
verification: []
