  - id: FEAT-I18N-001
    name: "Translation layer over English bases"
    description: >-
      Every machine-read vocabulary is English-base (registry IDs by
      governance; taxonomy slugs by DECISIONS #24); localized display is
      a translation layer on top, generalizing the registry
      display_name{pt,en} pattern to taxonomy terms, technique names,
      endpoint tests and UI-facing vocabulary. Integrations bind to
      stable English identifiers; renderers pick the viewer's language;
      pt-PT culinary exactness (massa velha ≠ isco) lives in the
      translations and content fields, never in the identifiers.
    personas: [rcp.dev.surface-engineer, rcp.cook.home-cook]
    icp: ICP-1
    status: shipped
    target: v1
    trace: ["DECISIONS #24", "registry-governance guideline (IDs never localized)"]
    graduates_to: PRD-002
    realized_by: ['FR-I18N-001']

  - id: FEAT-REG-004
    name: "Ontology grounding & cross-language matching"
    description: >-
      Every registry class anchored to external ontologies via cross_refs
      (FooDON as the food-ontology spine; FDC/OFF for nutrition/product
      data), and the ingestion pipeline made language-aware: extraction
      proposes the canonical English class for each unresolved item
      (cebola -> onion at extraction time, where the knowledge exists),
      and the gap ledger groups by proposal instead of raw-string
      normalization — the fix for the cross-language consolidation
      blindness dogfood run #5 exposed. Builds on the ontology-paths rule
      (registry-governance rule 6): IDs are taxonomy paths, families
      resolve by prefix.
    personas: [rcp.registry.steward, rcp.ingester.personal-collector]
    icp: ICP-1
    status: shipped
    target: v1
    trace: ["registry-governance rule 6 (2026-08-02)", "research 02:367-378 (cross-refs)", "dogfood run #5 finding"]
    graduates_to: PRD-002
    realized_by: ['FR-REG-004']

  - id: FEAT-REG-005
    name: "Derived search index (edges + facets over the ontology)"
    description: >-
      The find-anything layer, per DECISIONS #7 (no graph DB — documents
      are the record, edges projected): a derived, always-rebuildable
      edge index (research 07 rcp_edges: recipe -uses-class-> ingredient,
      uses-equipment, component-of, substitutes) combined with prefix
      queries over ontology paths (ingredient.spice.cinnamon.* finds
      ground AND stick), role queries (everything that leavens), and the
      #10 derived facets (time, diets, techniques, main ingredients).
      Four axes, zero new protocol machinery. Informative surface
      (DECISIONS #21) — implementable in-repo as tooling or app-side.
    personas: [rcp.cook.home-cook, rcp.ingester.personal-collector, rcp.dev.surface-engineer]
    icp: ICP-1
    status: deferred
    target: v1
    trace: ["DECISIONS #7", "DECISIONS #10", "DECISIONS #21", "research 07:396-420"]
    graduates_to: null


  - id: FEAT-CALC-002
    name: "Derived execution ordering & timeline (DAG + durations → schedule)"
    description: >-
      Presentation order and cooking schedule are DERIVED from the
      document, never stored in it (DECISIONS #3: the DAG is data). Three
      escalating projections over the same graph: (1) topological reading
      order — component methods before the steps that consume them (the
      mise-en-place projection the v0.2 viewer ships); (2) interleaved
      execution with parallel tracks — 'meanwhile, cook the calda' — via
      the step track field; (3) the time-anchored schedule: combining the
      DAG with times and step durations to compute WHEN to start each
      part ('start the ganache 40 minutes before assembly'; the entremet
      multi-day case, research 04). Ownership split captured 2026-08-03
      (Daniel, viewer session): the referencing recipe owns WHEN a
      component applies (its steps anchor the componentRef); the
      referenced recipe owns HOW; the schedule is computed, not authored.
      Cross-document stitching (brownie inlining the published ganache's
      method) additionally requires verified reference resolution
      (engineering obligation #3) and respects the private-vs-published
      boundary.
    personas: [rcp.cook.home-cook, rcp.cook.production-scaler, rcp.dev.surface-engineer]
    icp: both
    status: deferred
    target: v1 — PRD-003 candidate (Daniel 2026-08-03), with FEAT-CALC-001 (the derivations are Calculus functions; the viewer consumes them through the engine seam)
    trace: ["DECISIONS #3", "research 04:61-80", "CONCLUSIONS §7", "Daniel 2026-08-03 viewer review"]

  - id: FEAT-TOOL-002
    name: "Media surfaces: asset conventions + rendering"
    description: >-
      The media model shipped in v0.1 core and is already referenced by
      the examples (step media on the alentejano, the negroni's stir
      video, technique teaches/media) — a deliberately rich shape: role
      includes failure (kahm yeast vs mould is a photo, not a sentence)
      and licence is REQUIRED, encoding the two-tier stance (written
      heritage CC BY 4.0, media all rights reserved). What does not
      exist yet: the assets themselves (example URIs are placeholders),
      viewer rendering (media is ignored today), and the conventions —
      where assets live relative to documents, how the single-file
      viewer handles them, and the boundary that asset HOSTING is
      app-side (DECISIONS #19/#21) while the reference shape is
      protocol. Privacy line recorded: personal photos of one's own
      cooking are fine in the private collection; a source book's media
      is never reproduced (the private-use ingestion right does not
      extend to media). Surfaced by Daniel 2026-08-03: no media visible
      anywhere in the viewer.
    personas: [rcp.cook.home-cook, rcp.ingester.personal-collector, rcp.dev.surface-engineer]
    icp: both
    status: deferred
    target: post-v0.2; scope decided at the next PRD interview (viewer rendering is the cheap half; conventions + real assets the substantive half)
    trace: ["research 04 media_hint findings", "core $defs/media (v0.1)", "Daniel 2026-08-03 viewer review"]
  - id: FEAT-CORE-005
    name: "Dogfood field additions (times, difficulty, storage, source detail)"
    description: >-
      The small ADDITION-class core fields five real cookbook pages asked
      for and v0.1 parked in description prose: recipe-level
      preparation/cooking/chilling time metadata (books state them;
      research 04 wanted hands-on vs total), a difficulty asserted facet
      (DECISIONS #10 lists it; taxonomy lacks it), storage guidance
      (pastry profile's hardened block rejects it today), and a
      provenance source-detail field (book/page). Each is additive and
      MODEL-1-legal per VERSIONING.md.
    personas: [rcp.ingester.personal-collector, rcp.cook.home-cook]
    icp: ICP-1
    status: shipped
    target: v0.2 (proposed — the dogfood-taught release)
    trace: ["dogfood runs #1-#5 findings", "DECISIONS #10", "research 04:76-80"]
    graduates_to: PRD-002
    realized_by: ['FR-PR-003']

  - id: FEAT-PUB-001
    name: "Verified publish-time reference resolution (resolver_version + content hashes)"
    description: >-
      Published documents pin what they resolved: every embedded
      component and registry reference carries resolver_version and a
      content hash, so a resolver bug can be identified and republished
      instead of shipping silently into immutable offline snapshots with
      no repair path.
    personas: [rcp.verifier.editorial, rcp.dev.surface-engineer]
    icp: ICP-1
    status: deferred
    target: v1
    trace: ["DECISIONS #21", "engineering obligation #3"]
    graduates_to: null

  - id: FEAT-TOOL-001
    name: "RCP playground — paste/drop a recipe, validate and render it (the jwt.io move)"
    description: >-
      A static website where anyone pastes or drops an .rcp.yaml/JSON
      document and instantly sees: L1+L2 validation verdicts with the same
      file+pointer errors the harness gives, the recipe rendered
      human-readable (ingredients with resolved bases, the step DAG,
      per-component profiles and maturity labels), and a live scaling
      slider guarded by the fail-closed clamp — drag past the 2% brine
      floor and watch the authored refusal appear. Architecture (ADR-002):
      split at a versioned engine interface — a lightweight Bun-toolchained
      JS engine first (verdict parity with rcplint via CI-tested
      conformance vectors), the WASM-compiled Go core later behind the
      same seam for L2+CUE+clamp — no server, no data leaves the page.
      Sits on the informative surface (SSP-001): the protocol never
      depends on it; it exists to make the protocol legible to integrators
      in thirty seconds.
    personas: [rcp.dev.surface-engineer, rcp.ingester.personal-collector, rcp.cook.home-cook]
    icp: both
    status: shipped-lightweight
    target: >-
      lightweight cut DELIVERED in v0.2 (FR-TOOL-001, engine seam per
      ADR-002); full playground later. Render rules shipped 2026-08-03
      from Daniel's live review: registry display-name resolution (both
      localization layers consumed), composed instruction lines for
      prose-less steps (verb from primitive, objects from uses, until
      chips — authored title always wins), and mise-en-place reading
      order (component methods before the parent method that consumes
      them). All pinned by render tests.
    phasing: >-
      v0.2 LIGHTWEIGHT VIEWER: paste/drop a document, see L1 validation
      verdicts and the recipe rendered human-readable (ingredients with
      bases, step sections, profile + maturity labels). Static page, no
      server, no accounts; JS engine behind the ADR-002 engine interface,
      Bun via mise, conformance-vector parity. LATER (full playground):
      the WASM-compiled rcplint drops in behind the same interface for
      exact-CI L2 + CUE verdicts in-browser, and the clamp-guarded scaling
      slider — the signature demo. UI survives the engine swap by design.
    trace: ["DECISIONS #19", "DECISIONS #21", "PRD-001 integrator guarantee"]
    graduates_to: PRD-002

