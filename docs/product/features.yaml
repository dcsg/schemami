  - id: FEAT-SUB-001
    name: "Global substitution catalog (typed op-lists + variants, curated)"
    description: >-
      The novel part of RCP as shared content: curated cross-recipe
      substitutions (gelatine→agar boils; yeast→levain grafts a subtree)
      as typed op-lists anchored to step slugs with fail-closed guards —
      method deltas included, because 15 of 18 researched substitutions
      change the method. LLM-drafted, human-reviewed, never auto-applied.
      Serves the diaspora availability problem (T65 doesn't exist abroad
