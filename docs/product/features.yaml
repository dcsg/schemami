# RCP feature ledger — source of truth (mirror: FEATURES.md).
# Top of the traceability chain: FEAT → FR (PRD) → SR/DS/CMP (SPEC) → plan → code.
#
# ID scheme: FEAT-<AREA>-NNN (traceability guideline). Areas defined here;
# new areas are added to this header before use:
#   CORE protocol core schema · REG registry · PROF profiles ·
#   VAL validation · SAFE safety machinery · CALC recipe calculus ·
#   SUB substitution · PUB publishing/resolution · TOOL developer-facing
#   protocol tooling (playground/viewer — informative surface, SSP-001) ·
#   I18N localization layer over English bases · APP app-side (external)
#
# Fields:
#   status: shipping (in an accepted PRD) | deferred (target names the
#           release) | external (app-side per DECISIONS #19/#21 — tracked
#           for the map, never implemented in this repo)
#   description: what the feature IS and why it exists — grounded in the
#           research corpus and decisions, never invented
#   personas: stable keys from docs/personas.md served by this feature
#   icp: ICP-1 (infrastructure — validated, the ecosystem itself) |
#        ICP-2 (expansion — hypothesis, gated on AT-2/AT-4) | both
#   realized_by: FR ids once in a PRD; graduates_to: PRD id when a
#           deferred feature enters one. Deferred/external features carry
#           NO implementation ids until graduation.

features:
  # ── Shipping in v0.1 (PRD-001, SPEC-001) ──────────────────────────────
  - id: FEAT-CORE-001
    name: "Frozen, versioned core schema"
    description: >-
      One small machine-readable schema (JSON Schema 2020-12) able to hold
      any recipe category: ingredients as role-tagged rows, basis
      percentages, opt-in step DAG, bounded constraints. Frozen at v0.1
      with documented version semantics and decode-compatibility rules
      binding every later change — replacing five divergent in-house
      representations with a single validated target that documents can
      outlive code on.
    personas: [rcp.dev.surface-engineer, rcp.ingester.personal-collector]
    icp: ICP-1
    status: shipped
    target: v0.1 (tag rcp-v0.1, PRD-001 shipped 2026-08-02)
    trace: ["DECISIONS #14", "DECISIONS #21", "DECISIONS #22"]
    realized_by: [FR-PR-001]
  - id: FEAT-CORE-002
    name: "Hardened constraint & safety encoding (single-sourced bounds)"
    description: >-
      Safety-critical quantities (brine %, cure ppm, salt ratios) are
      bounded data with authored reasons, encoded exactly once per
      document and referenced elsewhere — never duplicated prose. The
      schema rejects bound-less constraints, so a safety rule cannot
      silently degrade into a comment. Foundation for every fail-closed
      check downstream (A11×A5: a mis-extracted salt quantity must be
      catchable).
    personas: [rcp.verifier.editorial, rcp.cook.production-scaler, rcp.ingester.personal-collector]
    icp: ICP-1
    status: shipped
    target: v0.1 (tag rcp-v0.1, PRD-001 shipped 2026-08-02)
    trace: ["DECISIONS #5"]
    realized_by: [FR-PR-002]
  - id: FEAT-REG-001
    name: "Registry entry formats (ingredient class, step primitive, equipment profile)"
    description: >-
      The three shared vocabularies get document formats of their own:
      ingredient classes (functional roles, localized display names,
      optional density/allergen/cross-refs), versioned step primitives
      with ParamSpecs (SPEC-008 lineage: new capability = new id), and
      equipment profiles whose parameters participate in the maths.
      Kind-prefixed stable IDs, append-only, governed — so recipes
      reference meaning, not strings.
    personas: [rcp.registry.steward, rcp.dev.surface-engineer]
    icp: ICP-1
    status: shipped
    target: v0.1 (tag rcp-v0.1, PRD-001 shipped 2026-08-02)
    trace: ["DECISIONS #16", "DECISIONS #23"]
    realized_by: [FR-REG-001]
  - id: FEAT-REG-002
    name: "Seed registry + kind-prefixed slug migration"
    description: >-
      The vocabulary stops being implicit: every slug the six example
      recipes reference (~30 ingredient classes, 24 primitives, 6
      equipment profiles) becomes a real governed entry, and the examples
      migrate to the kind-prefixed convention. From here, extraction can
      only map to existing entries or flag a gap — never mint IDs — which
      is what keeps ingestion from polluting the vocabulary.
    personas: [rcp.registry.steward, rcp.ingester.personal-collector]
    icp: ICP-1
    status: shipped
    target: v0.1 (tag rcp-v0.1, PRD-001 shipped 2026-08-02)
    trace: ["DECISIONS #22", "DECISIONS #23"]
    realized_by: [FR-REG-002]
  - id: FEAT-PROF-001
    name: "Bread profile (hardened)"
    description: >-
      The category RCP was born from, fully enforced: total-flour basis
      across component trees (preferment flour counts), maintenance
      cultures (massa-mãe feed ratios, minimum batches, carry-forward),
      and bread safety/sanity bounds as data. The validated bread segment
      is the one place the ecosystem already has real users.
    personas: [rcp.cook.home-cook, rcp.ingester.personal-collector]
    icp: ICP-1
    status: shipped
    target: v0.1 (tag rcp-v0.1, PRD-001 shipped 2026-08-02)
    trace: ["DECISIONS #18"]
    realized_by: [FR-PROF-001]
  - id: FEAT-PROF-002
    name: "Pastry profile (hardened)"
    description: >-
      The domain that breaks naive recipe models, enforced: quantities
      that are tests not numbers (to_consistency), four temperature
      shapes (target / range / named stage / curve), lamination and rest
      structures, make-ahead windows. Proves the core generalizes beyond
      bread with the nata — a pastry containing a bread — as the living
      test.
    personas: [rcp.ingester.personal-collector, rcp.cook.home-cook]
    icp: ICP-1
    status: shipped
    target: v0.1 (tag rcp-v0.1, PRD-001 shipped 2026-08-02)
    trace: ["DECISIONS #18"]
    realized_by: [FR-PROF-002]
  - id: FEAT-PROF-003
    name: "Draft profiles ×5 with machine-readable maturity"
    description: >-
      Ferment, preserve, drink, coffee and component/dish exist as draft
      schemas — valid to author against, honestly labelled
      non-conformance-guaranteed via x-rcp-maturity. Keeps the core
      checked against the full seven-category roster (a single-profile
      core silently overfits, the original defect) without paying five
      hardening costs before the dogfood.
    personas: [rcp.dev.surface-engineer, rcp.ingester.personal-collector]
    icp: ICP-1
    status: shipped
    target: v0.1 (tag rcp-v0.1, PRD-001 shipped 2026-08-02)
    trace: ["DECISIONS #18"]
    realized_by: [FR-PROF-003]
  - id: FEAT-VAL-001
    name: "Two-layer validation harness (schema + semantic linter with CUE)"
    description: >-
      The protocol becomes executable: Layer 1 validates shape
      (core ∧ profile[kind]); Layer 2 enforces what schemas cannot —
      every reference resolves, every guard combination yields a complete
      DAG, no cycles, no orphan intermediates — with declarative ratio
      bounds in CUE. One command, CI-able. Integrators inherit a
      validated contract instead of hand-writing validation; the repo's
      'examples are the regression suite' rule finally runs.
    personas: [rcp.dev.surface-engineer, rcp.registry.steward]
    icp: ICP-1
    status: shipped
    target: v0.1 (tag rcp-v0.1, PRD-001 shipped 2026-08-02)
    trace: ["DECISIONS #8"]
    realized_by: [FR-VAL-001, FR-VAL-002]
  - id: FEAT-SAFE-001
    name: "Fail-closed safety clamp (throwaway precursor)"
    description: >-
      A minimal scaler-guard proving the protocol's central safety claim:
      scale a recipe until a critical bound breaks and the transformation
      is refused with the author's reason shown — never silently
      accepted. Explicitly throwaway; exists so the dogfood's
      'zero silent quantity errors' criterion is testable before the real
      Recipe Calculus (FEAT-CALC-001).
    personas: [rcp.verifier.editorial, rcp.cook.production-scaler, rcp.ingester.personal-collector]
    icp: ICP-1
    status: shipped
    target: v0.1 (tag rcp-v0.1, PRD-001 shipped 2026-08-02)
    trace: ["DECISIONS #15", "DECISIONS #22"]
    realized_by: [FR-SAFE-001]

