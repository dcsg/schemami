# RCP feature ledger — source of truth (mirror: FEATURES.md).
# Top of the traceability chain: FEAT → FR (PRD) → SR/DS/CMP (SPEC) → plan → code.
#
# ID scheme: FEAT-<AREA>-NNN (traceability guideline). Areas defined here;
# new areas are added to this header before use:
#   CORE protocol core schema · REG registry · PROF profiles ·
#   VAL validation · SAFE safety machinery · CALC recipe calculus ·
#   SUB substitution · PUB publishing/resolution · APP app-side (external)
#
# status: shipping (in an accepted PRD) | deferred (target names the release)
#         | external (app-side per DECISIONS #19/#21 — tracked for the map,
#           never implemented in this repo)
# realized_by: FR ids once in a PRD; graduates_to: PRD id when a deferred
# feature enters one. Deferred/external features carry NO implementation ids
# until graduation (rule: context needs no ids; implemented work does).

