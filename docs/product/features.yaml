    name: "Recipe Calculus with cross-stack conformance vectors"
    description: >-
      The one named library of pure functions every surface computes with
      at cook time — scaling, basis resolution, guard-path selection,
      fail-closed constraint enforcement, duration re-estimation —
      specified once, shipped with conformance test vectors so TS, Swift
      and Go implementations are proven equivalent instead of drifting
      (the disease RCP exists to cure). Replaces the throwaway clamp.
    personas: [rcp.dev.surface-engineer, rcp.cook.home-cook, rcp.cook.production-scaler]
    icp: ICP-1
    status: deferred
    target: v1
    trace: ["DECISIONS #13", "DECISIONS #15"]
