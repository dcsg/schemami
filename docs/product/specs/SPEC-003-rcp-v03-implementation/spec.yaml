requirements:
- id: SR-CALC-001
  implements: FR-CALC-001
  text: 'Normative Calculus spec at calculus/SPEC.md (every exported function: scaling uniform+pivot,
    basis resolution, guard-path selection, fail-closed enforcement with authored reasons, min_batch floors,
    fixed-quantity asymmetry, duration re-estimation — domain/unit/edge semantics defined). Normative
    surface gains calculus/ (DS-PR-001 extended). Go reference at tools/rcplint/calc (pure package, stdlib
    only); rcplint clamp subcommand rewired through it; every existing clamp test case passes verbatim
    (outcomes + pt/en reasons); clamp.go then deleted.'
  status: proposed
- id: SR-CALC-002
  implements: FR-CALC-002
  text: 'Conformance vectors at calculus/vectors/ (normative data): {function, edge_classes[], input,
    expected} JSON written by rcplint calc-vectors — never hand-authored. TS implementation at tools/viewer/src/calc/
    (inside the viewer package — zero new packages/deps; import-free so later extraction is mechanical)
    replays the full set via bun test. Edge-class enumeration machine-readable in calculus/SPEC.md; a
    coverage checker fails when any class lacks vectors. Disagreements fixed in the replayer; vectors
    regenerate only on SPEC change.'
  status: proposed
- id: SR-CALC-003
  implements: FR-CALC-003
  text: 'Ordering and timeline as Calculus functions, vector-covered in both implementations: topological
    reading order (specifying v0.2''s mise-en-place order), parallel-track interleaving via track, and
    the schedule — offsets from t0, {item, start_offset:{min,target,max}, duration:{min,target,max}},
    target as scalar, min/max as conservative interval bounds; serve-anchored views are a presentation
    transform. Referencing documents contribute WHEN edges; referenced documents contribute HOW internals.'
  status: proposed
- id: SR-TOOL-002
  implements: FR-TOOL-002
  text: 'Media conventions at schema/MEDIA.md (normative): relative URIs from document location; private
    assets in private/collection/media/ (gitignored, covered by the standing privacy guard); licence required;
    source-book media never — enforced by a repo media attestation check (no binary media outside an allowlist).
    Viewer renders media by role (failure visibly labelled) via drag-in object URLs; CSP img-src extends
    to data: blob: ONLY; placeholder URIs marked absent, never silently skipped.'
  status: proposed
- id: SR-TOOL-003
  implements: FR-TOOL-003
  text: 'Viewer consumes the TS Calculus through the seam: capabilities.clamp defines the reserved scale();
    capabilities.timeline gates a new OPTIONAL schedule() member (additive; RcpEngine stays version 1).
    Scale control exists only when clamp is declared and renders authored pt/en refusals past critical
    bounds; schedule view exists only when timeline is declared. Mock-engine test extended to {l1, clamp,
    timeline} proving zero UI changes; UI never imports the Calculus directly — engine interface only.'
  status: proposed
- id: SR-PR-004
  implements: FR-PR-004
  text: 'Decode-compat CI gate: the frozen v0.1-era reader is hand-written Go decode structs capturing
    exactly the tag rcp-v0.1 field surface (tag SHA pinned in a comment), default unknown-field tolerance
    — NOT the v0.1 schema, which is deliberately closed and tests the wrong thing. Fixtures both directions:
    frozen reader decodes every current document; current tooling decodes rcp-v0.1-tagged documents (extracted
    to testdata/compat/v01/). A breaking fixture proves the gate CAN fail, run as an inverted test. Wired
    into make accept.'
  status: proposed
