- id: SAC-CALC-001
  source: spec
  given: the full Calculus vector set and both implementations
  when: make calculus runs
  then: the Go vector suite and the TS replay both exit green in one command
  verify: make calculus
- id: SAC-CALC-002
  source: spec
  given: the machine-readable edge-class enumeration
  when: the coverage checker runs against a set with a deliberately emptied class
  then: it exits nonzero naming the class — the gate is proven able to fail (inverted test)
  verify: cd tools/rcplint && go test -run TestCalcCoverage ./...
- id: SAC-PR-002
  source: spec
  given: the decode-compat gate wired into make accept
  when: the breaking fixture's inverted test runs
  then: the gate fails on it while staying green on the real corpus
  verify: cd tools/rcplint && go test -run TestDecodeCompat ./...
- id: SAC-TOOL-003
  source: spec
  given: the rebuilt viewer
  when: the CSP and purity checks run
  then: 'img-src is exactly data: blob:, no other new source; forbidden-API greps green; bundle under
    500 KB'
  verify: 'sh -c ''f=tools/viewer/dist/index.html; grep -q "img-src data: blob:" $f && ! grep -q connect-src
    $f && [ $(wc -c < $f) -lt 512000 ]'''
design:
  statements:
  - id: DS-CALC-001
    text: 'Calculus placement (resolves PRD-003 OQ-1): normative spec + vectors at top-level calculus/
      (they ship WITH the protocol — engineering obligation #1''s own words); Go reference inside tools/rcplint/calc
      (informative surface, consumed by the clamp subcommand); TS inside tools/viewer/src/calc (no new
      package — no second consumer exists, the code is import-free pure functions, extraction later is
      mechanical; premature packaging rejected). Two-surface split extended: calculus/ is normative.'
    serves:
    - SR-CALC-001
    - SR-CALC-002
    status: proposed
  - id: DS-CALC-002
    text: 'Vector discipline: the reference writes, replayers replay (v0.2''s proven L1 loop, generalized).
      Record shape {function, edge_classes[], input, expected}; edge-class enumeration is a machine-readable
      block in calculus/SPEC.md; the coverage gate fails on any vectorless class — attacking the recorded
      riskiest assumption mechanically. Vectors regenerate ONLY when the SPEC changes; a replay disagreement
      is always a replayer bug until the SPEC says otherwise.'
    serves:
    - SR-CALC-002
    status: proposed
  - id: DS-CALC-003
    text: 'Timeline semantics (resolves OQ-2): offsets from t0 — never wall-clock (purity; vector determinism).
      Schedule = {item, start_offset window, duration window}: target propagates as scalar arithmetic;
      min/max as conservative interval bounds, semantics DEFINED with worked examples in calculus/SPEC.md.
      Serve-time anchoring is a render transform (total − offset), not a second derivation.'
    serves:
    - SR-CALC-003
    status: proposed
  - id: DS-TOOL-003
    text: 'Media conventions (resolves OQ-3): documents reference assets by relative URI from their own
      location (schema/MEDIA.md, normative); private assets under private/collection/media/ (gitignored).
      The pasted-document viewer has no filesystem context, so assets arrive by dragging the files in
      — object URLs, CSP img-src data: blob: only (neither scheme can reach a network; connect-src stays
      absent). Failure-role media visibly labelled. Book media kept out mechanically: repo attestation
      check, binary media only on an allowlist.'
    serves:
    - SR-TOOL-002
    status: proposed
  - id: DS-TOOL-004
    text: 'Seam growth without seam change: scale() was reserved in RcpEngine v1 and now gets its definition
      under capabilities.clamp; schedule() enters as a NEW OPTIONAL member under capabilities.timeline
      — additive in the decode-compat sense, version stays 1 (SP-003). UI gates every Calculus-powered
      control on the capability and imports only the engine interface; the extended mock-engine test ({l1,
      clamp, timeline}) is the executable no-rewrite proof.'
    serves:
    - SR-TOOL-003
    status: proposed
  - id: DS-PR-009
    text: 'Frozen reader (resolves OQ-4): hand-written Go decode structs for the exact rcp-v0.1 field
      surface (tag SHA pinned), tolerating unknowns by decoder default — because the v0.1 SCHEMA is deliberately
      closed (unevaluatedProperties: false): it validates strictness, it cannot test tolerance; #14 binds
      decoders. Both directions fixtured; the gate''s ability to fail is itself proven by an inverted
      breaking-fixture test.'
    serves:
    - SR-PR-004
    status: proposed
  components:
  - id: CMP-CALC-001
    path: calculus/SPEC.md + calculus/vectors/
    description: 'The normative Calculus: function semantics with machine-readable edge-class enumeration;
      reference-written vector set'
    serves:
    - SR-CALC-001
    - SR-CALC-002
    status: proposed
  - id: CMP-CALC-002
    path: tools/rcplint/calc/ + rcplint calc-vectors subcommand + clamp rewiring
    description: Go reference implementation (pure, stdlib-only); vector writer; clamp parity migration
      then clamp.go deletion
    serves:
    - SR-CALC-001
    - SR-CALC-002
    status: proposed
  - id: CMP-CALC-003
    path: tools/viewer/src/calc/ + conformance replay
    description: Import-free TS implementation; bun-test vector replay; purity check
    serves:
    - SR-CALC-002
    - SR-CALC-003
    status: proposed
  - id: CMP-TOOL-002
    path: schema/MEDIA.md + private/collection/media/ + media attestation check
    description: Asset conventions (normative), personal asset home, book-media keep-out gate
    serves:
    - SR-TOOL-002
    status: proposed
  - id: CMP-TOOL-003
    path: tools/viewer/src/{engine.ts capabilities, render.ts scale+schedule+media views, app.ts drag-in}
      + build CSP
    description: Seam capability growth; scale control with authored refusals; schedule view; media rendering
      via object URLs
    serves:
    - SR-TOOL-002
    - SR-TOOL-003
    status: proposed
  - id: CMP-PR-004
    path: tools/rcplint/compat/ (frozen v0.1 structs) + testdata/compat/v01/ + accept.sh wiring
    description: Bidirectional decode-compat gate with inverted breaking-fixture proof
    serves:
    - SR-PR-004
    status: proposed
protections:
- id: SP-001
  text: 'Fail-closed parity: the clamp-to-Calculus replacement changes no refusal outcome and no authored
    reason; safety semantics survive verbatim (DECISIONS #15).'
  source: prd
- id: SP-002
  text: 'ADDITION-only continues: every document valid at rcp-v0.2 remains valid throughout v0.3 per schema/VERSIONING.md.'
  source: prd
- id: SP-003
  text: 'Engine-seam stability: RcpEngine version 1 unchanged; new powers arrive only as additive capabilities
    (ADR-002 no-rewrite guarantee).'
  source: prd
- id: SP-004
  text: 'Media boundary: licence stays required; personal assets only; source-book media never enters
    the repo in any form.'
  source: prd
- id: SSP-005
  text: 'Calculus purity: no IO, no clock, no randomness, no globals, in both implementations — structurally
    checked (import allowlists), not promised.'
  source: spec
