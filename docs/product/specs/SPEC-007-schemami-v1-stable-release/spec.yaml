revision_history:
  - at: "2026-08-11T12:00:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted formula terms as the sole quantity authority for their ingredients; resolve_formula and scale return ordered effective quantities, scale exact anchors and explicit linear quantities, preserve fixed/open quantities, and refuse missing authority."
  - at: "2026-08-11T11:30:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted closed operation result envelopes and deterministic earliest-start scheduling from explicit after dependencies and target durations."
  - at: "2026-08-11T00:45:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted the minimal v1 Calculus surface with deterministic reading_order; deferred lanes, tracks, interleaving, options, guards, and constraints; accepted local pack identity, optional unresolved URI references, source evidence, canonical prose, extension grammar, and problem URI registry."
  - at: "2026-08-11T00:35:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted a 16-total-digit maximum (excluding decimal point and permitted minus sign) for canonical decimal inputs and public results."
  - at: "2026-08-11T00:30:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted a 128-character maximum for recipe-local IDs."
  - at: "2026-08-11T00:25:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted recipe-local IDs as lowercase ASCII alphanumeric tokens with hyphen/underscore, exact case-sensitive matching, and ordinary lowercase UUID-shaped values."
  - at: "2026-08-11T00:15:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted positive standard-shaped elapsed durations and full minimum/target/maximum window names, excluding calendar years/months and Model 1 compact syntax; primary-source grammar verification remains a gate."
  - at: "2026-08-11T00:05:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted the step itself as the recipe-local action, removed mandatory primitive/action identity and params, and deferred protocol operations until Calculus defines and consumes them."
  - at: "2026-08-10T23:59:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted round-half-to-even for exact public results beyond four fractional digits, with exact boundary examples."
  - at: "2026-08-10T23:55:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Replaced public rational results with canonical decimal strings capped at four fractional digits; tie handling remained pending at this revision."
  - at: "2026-08-10T23:45:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted ratios as ordered grouped parts (1:2:2, 1:15) and percentages as direct percentage points against a named basis. Removed ratio and parts from scalar quantity kinds."
  - at: "2026-08-10T23:30:00Z"
    author: Daniel Gomes
    action: created
    note: "Drafted accepted Schemami v1 boundaries and explicitly retained ratio, exact-result, and step-action wire questions for founder decision."
