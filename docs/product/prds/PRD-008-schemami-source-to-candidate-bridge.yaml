forcing_questions:
  problem_behind_problem: "Integrators need reliable source acquisition without moving probabilistic inference into the protocol trust boundary."
  evidence_or_hypothesis: "Schemami v1 can be a useful compilation target if provider-neutral adapters preserve evidence and deterministic tooling exposes every unsupported fact."
  north_metric_and_counter: "North: source-faithful admitted candidates with measured reviewer effort. Counter: zero invented authority and zero recipe/source content in optional telemetry."
  must_not_change: "No runtime model in Schemami, no registry gate, no prose calculation, no website dependency, and no hidden source invention."
  riskiest_assumption: "External adapters can produce candidates that are sufficiently faithful and repairable across real source modalities."
