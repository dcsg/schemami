schema_version: "1.0"
type: prd
id: PRD-008
title: "Schemami source-to-candidate bridge"
slug: schemami-source-to-candidate-bridge
status: accepted
rigor: platform
author: Daniel Gomes
created_at: "2026-08-11T18:21:47Z"
requirements:
  - id: FR-AI-001
    text: "Publish a small immutable provider-neutral acquisition instruction and output contract for one complete or partial untrusted Schemami v1 recipe candidate; components and bundles are linked only after deterministic child admission supplies exact canonical digests, and adapter output MUST NOT claim deterministic admission."
    status: accepted
  - id: FR-AI-002
    text: "Preserve source language, authored ordering, source references, selectors/raw evidence when available, and explicit omissions; acquisition metadata MUST NOT be a Recipe Calculus input."
    status: accepted
  - id: FR-AI-003
    text: "Adapters MUST create valid recipe-local IDs and source-language names for unfamiliar local concepts and MUST NOT invent global vocabulary equivalence or require a Schemami registry."
    status: accepted
  - id: FR-AI-004
    text: "Unsupported, ambiguous, or missing structured facts MUST be omitted rather than guessed; when the optional acquisition report is used, it MUST record them for review."
    status: accepted
  - id: FR-AI-005
    text: "Direct use MUST return one candidate; when an integrator elects to produce a non-normative acquisition report, it MUST remain separate and report bytes MUST NOT affect recipe identity or calculation."
    status: accepted
  - id: FR-AI-006
    text: "Candidates MUST be admitted by a deterministic Schemami SDK or CLI and repaired using stable problem identities and RFC 6901 pointers, with complete re-admission after every repair."
    status: accepted
  - id: FR-AI-007
    text: "Source content MUST be treated as untrusted data and MUST NOT change the acquisition contract, suppress evidence, execute code, fetch undeclared resources, or override validation."
    status: accepted
  - id: FR-AI-008
    text: "Release documentation MUST provide a direct AI workflow and an SDK integration workflow; direct use MUST return an untrusted candidate to deterministic admission and MUST NOT require a hosted service, acquisition report, or model-generated digest."
    status: accepted
  - id: FR-AI-009
    text: "The acquisition request/report and repair contract MUST remain an optional advanced integrator path and MUST NOT affect recipe identity or admission; provider evaluation, telemetry, and support badges are separate later work."
    status: accepted
acceptance_criteria:
  - id: AC-AI-001-1
    fr: FR-AI-001
    given: the same acquisition contract version and source fixture
    when: an adapter emits a candidate
    then: the output identifies the contract version and contains no assertion that substitutes for Schemami admission
    status: proposed
  - id: AC-AI-002-1
    fr: FR-AI-002
    given: source content with ordered structured culinary facts
    when: those facts are captured
    then: represented facts are traceable to the source and authored order is preserved
    status: proposed
  - id: AC-AI-003-1
    fr: FR-AI-003
    given: an unfamiliar but valid local concept
    when: no application catalog mapping exists
    then: capture emits a recipe-local ID and source-language name rather than failing or inventing a global ID
    status: proposed
  - id: AC-AI-004-1
    fr: FR-AI-004
    given: an ambiguous quantity or missing structured relationship
    when: conversion completes
    then: the candidate stays readable where possible, the optional report records the issue when present, and dependent operations refuse instead of consuming a guessed value
    status: proposed
  - id: AC-AI-005-1
    fr: FR-AI-005
    given: candidate JSON and an optional acquisition report
    when: report presence or report-only data changes
    then: recipe bytes, revision, digest, and Calculus results remain unchanged
    status: proposed
  - id: AC-AI-006-1
    fr: FR-AI-006
    given: a schema or semantic problem
    when: a repair cycle is requested
    then: stable problem identities and RFC 6901 pointers are returned and the replacement candidate is fully re-admitted
    status: proposed
  - id: AC-AI-007-1
    fr: FR-AI-007
    given: hostile source instructions
    when: the source is processed
    then: those instructions cannot alter validation behavior, fabricate authority, hide omissions, or execute content
    status: proposed
  - id: AC-AI-008-1
    fr: FR-AI-008
    given: source material and the direct AI guide
    when: a user requests a Schemami candidate
    then: the documented next step is deterministic admission and no model statement substitutes for validity
    status: proposed
  - id: AC-AI-009-1
    fr: FR-AI-009
    given: an integrator requiring source-coverage evidence
    when: it adopts the optional acquisition contract
    then: candidate report and admission remain separate and exact candidate-byte identity is verifiable without hosted capture
    status: proposed
protections:
  - id: SP-001
    text: "Acquisition output remains untrusted until deterministic Schemami admission succeeds."
  - id: SP-002
    text: "Source prose, evidence, confidence, and acquisition-report content never become Recipe Calculus inputs."
  - id: SP-003
    text: "Conversion never depends on a Schemami-owned central vocabulary registry."
  - id: SP-004
    text: "Schemami owns no source upload, OCR, transcription, provider, model runtime, or recipe storage in this release."
  - id: SP-005
    text: "Adapters prefer visible omission or unresolved reporting over unsupported structured invention."
