forcing_questions:
  problem_behind_problem: "A brand rename cannot produce a stable public protocol if the public wire contract remains RCP; retaining a private pre-publication contract as a compatibility burden would weaken the clean Schemami boundary."
  evidence_or_hypothesis: "A full clean Schemami cutover with registry-optional local vocabulary and exact unit conversion can become a stable PaodePortugal-ready boundary without content-service or catalog stewardship."
  north_metric_and_counter: "North: a clean-clone Schemami stable release. Counter: zero active RCP runtime identities, zero central-catalog admission blockers, and no Pão application dependency in the release gate."
  must_not_change: "Translation remains presentation-owned; Schemami does not host recipes or inference; unknown local terms remain readable; mass-volume conversion is out of scope; Pão stays an external future integrator."
  riskiest_assumption: "The clean cutover captures the right protocol boundary without an undisclosed external RCP consumer or an essential Pão dependency."
revision_history:
  - at: "2026-08-11T18:00:00Z"
    author: Daniel Gomes
    action: calculus-closure-approved
    note: "Accepted ADR-016 after aligned Pão and Fornada review: resolve_selection, exhaustive distinct reachable graphs, non-redistributing optional terms, factor XOR root formula_target, exact component scaling, composed schedule reporting, deterministic diagnostics, and portable logical capacity. ADR-017 separately bounds request-scoped residual-analysis states."
  - at: "2026-08-11T16:30:00Z"
    author: Daniel Gomes
    action: wire-closure-approved
    note: "Accepted ADR-015 and the reviewed Phase 7 wire: minimal required identity/readability fields, step-authoritative resource flow, all-branch exact bundles, child-output yield ownership, digest-significant extensions, separate formula allocations, and two-product owner acceptance without application checkouts in conformance."
  - at: "2026-08-11T14:45:00Z"
    author: Daniel Gomes
    action: scope-amended
    note: "Accepted ADR-014 after Pão and Fornada dogfood: preserve authored method hierarchy, actions, completion conditions, alternatives, explicit environment facts, exact recipe composition, and lineage; keep application heuristics, workflow primitives, timer policy, and bake state outside the protocol. The unpublished da8449f candidate is now a verified baseline, not the stable release."
  - at: "2026-08-11T00:45:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted ADR-009: minimal v1 Calculus with reading_order, deferred lanes/branches/constraints, local pack identity, optional unresolved URI references, source evidence, canonical prose, extension grammar, and problem URI registry."
  - at: "2026-08-11T00:35:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted a 16-total-digit maximum (excluding decimal point and permitted minus sign) for canonical decimal inputs and public results, in addition to the four-fractional-digit maximum."
  - at: "2026-08-11T00:30:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted a 128-character maximum for recipe-local IDs."
  - at: "2026-08-10T23:55:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted recipe-practical numeric precision: canonical decimal strings allow at most four fractional digits, normally remain integers, trim trailing zeros, and are used for public results instead of rational objects."
  - at: "2026-08-10T23:45:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted grouped formula semantics: ratios are ordered colon parts such as 1:2:2 or 1:15; percentages store percentage points such as 75 or 1.8 against a named basis. Neither is a scalar quantity kind."
  - at: "2026-08-10T23:15:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted ADR-008: recipe-local techniques/equipment, tagged quantities with canonical decimal strings, UCUM 2.2 measured units, document-level JSON-Pointer evidence, and stable URI/pointer diagnostics."
  - at: "2026-08-10T23:00:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted ADR-007: an ingredient line id is the recipe-local vocabulary identity, with source-language name. No generic terms catalogue, item reference, package vocabulary, or central registry requirement in v1."
  - at: "2026-08-10T22:45:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Verified no remote RCP tags, published schema host, or known external adopter. Accepted ADR-006 clean cutover: no dual reader, migration tool, deprecation window, or Pão integration release dependency."
  - at: "2026-08-10T22:30:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted required content_language as the source-content BCP 47 tag. It replaces Model 1 lang in Schemami v1; no default, UI locale, translation, or geographic-origin semantics are permitted."
  - at: "2026-08-10T22:20:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted Schemami root marker schemami: \"1\" and reserved protocol extension namespace x-schemami-*. Integrator-owned x-<owner>- extensions are preserved but cannot affect protocol logic unless standardized."
  - at: "2026-08-10T22:10:00Z"
    author: Daniel Gomes
    action: decision-recorded
    note: "Accepted schemami.dev as the canonical schema-ID host. Host readiness and immutable HTTPS publication remain release gates. Refined pending root-marker recommendation from numeric schemami: 1 to string schemami: \"1\" after standards comparison."
  - at: "2026-08-10T21:35:00Z"
    author: Daniel Gomes
    action: created
    note: "Drafted after Daniel selected the full wire rename path. AI conversion and documentation follow this stable-release and PaodePortugal adoption proof."
