schema_version: "1.0"
type: prd
id: PRD-007
title: "Schemami stable protocol release — full wire rename and PaodePortugal adoption"
slug: schemami-stable-protocol-release
status: accepted
rigor: platform
author: Daniel Gomes
created_at: "2026-08-10T21:35:00Z"
requirements:
  - id: FR-NAME-001
    component: protocol-identity
    text: "Deliver Schemami wire v1 with accepted schemami: \"1\", protocol-reserved x-schemami- extensions, Schemami-named schema/package/vector/validator artifacts, and immutable canonical schema URLs under the accepted schemami.dev host. New canonical RCP identifiers and rcp.invalid identifiers are rejected. Integrator x-<owner>- extensions are preserved but cannot affect protocol logic unless explicitly standardized."
    status: accepted
  - id: FR-MODEL-001
    component: semantic-field-contract
    text: "Audit every field and public API across documents, packages, schemas, registry, Calculus, validator, viewer, vectors, and cutover inventory. Publish an accepted field-name register before new schemas are written: name, type, scope, semantic definition, and authoritative standard/value vocabulary where one exists. Reuse of a familiar name is allowed when containing type and scope make meaning unambiguous; rename only for a demonstrated semantic collision, not repetition alone. Required content_language contains a BCP 47 source-content tag; UI locale/translation is outside the protocol. Optional origin uses ISO 3166-1 country, matching ISO 3166-2 subdivision, and source-language locality; country/region, unit identity, display formatting, source evidence, local identity, external reference, and app resolution context are all distinct concepts."
    status: accepted
  - id: FR-CUTOVER-001
    component: clean-cutover
    text: "Replace repository-owned active RCP schemas, documents, package artifacts, vectors, generated data, validation, Calculus, and viewer paths with Schemami wire v1. The released reader/writer recognizes Schemami only; RCP input returns an explicit unsupported-legacy diagnostic. Ship no dual reader, public migration tool, alias, or deprecation-window commitment. Historical records may retain historical RCP terminology outside the active normative/runtime surface."
    status: accepted
  - id: FR-VOCAB-001
    component: vocabulary-resolution
    text: "Ingredient lines require recipe-local id and source-language name; recipes MAY also declare local technique and equipment entities with their own local IDs and source-language names. Every recipe-local ID matches ^[a-z0-9][a-z0-9_-]*$ and contains at most 128 characters; matching is exact and case-sensitive, and readers never normalize uppercase. Lowercase UUID strings are permitted without acquiring UUID semantics. A step is itself the recipe-local action and requires id plus source-language instruction; the instruction is the smallest portable method unit in v1. Named sub-actions, editorial grouping, app timer policy, conditional checkpoints, and conditional/alternative schedules remain integrator-owned; an adapter omits duration rather than guessing. A valid v1 document is a normalized culinary/computational backbone, not necessarily a lossless editorial, workflow, or UI interchange document. The step has no mandatory primitive/action reference, registry, version, or parameter object. Ordered unique steps[].techniques references express authored/application order inside one step and MUST be preserved without sorting. These entities remain structurally valid and readable without a central registry. An optional integrator maps (document identity, local id) as application resolution context only. Do not introduce item, generic terms, package-owned vocabulary, federation, or global registries in v1. Local labels do not assert deterministic facts; only explicit structured step fields may drive defined behavior, and operations needing absent facts return structured diagnostics."
    status: accepted
  - id: FR-CALC-006
    component: recipe-calculus
    text: "Define tagged absolute quantity shapes for measured, range, and open; an open guide is measured or range only. Define grouped formula shapes separately: ordered ratio terms store decimal parts and render colon ratios such as 1:2:2; percentage terms store percentage points directly against a named basis (75 means 75%, not 0.75), and the basis occurs exactly once at 100. Canonical numeric values have at most 16 total digits and four fractional digits; public results use the same shape, not rational objects. Exact results beyond four fractional digits use round-half-to-even. The only v1 operations are scale, resolve_formula, convert_quantity, reading_order, and schedule; core scaling is linear or fixed, while unknown extension-defined behavior refuses. Options, guards, constraints, tracks, and interleaving are absent. reading_order is one dependency-respecting linear projection with declaration-order tie breaking. Elapsed durations use the accepted standard-shaped form and every supplied duration-window pair is ordered; measured units use pinned UCUM 2.2; unsupported, ambiguous, and physical requests refuse."
    status: accepted
  - id: FR-EVIDENCE-001
    component: source-evidence-and-diagnostics
    text: "Preserve imported values through optional document-level sources and RFC 6901-targeted evidence. A supplied source has local ID, non-empty URI or URI-reference, optional registered media type, and optional SHA-256 digest. Evidence may carry raw text, 0-to-1 canonical-decimal confidence, and a standard-backed fragment selector locating part of its source. Selector offsets are source locators, never culinary duration or Calculus input. Calculus and validation never parse evidence into structured recipe facts. Operation results use accepted operation tokens, status, stable https://schemami.dev/problems/ type URIs, and RFC 6901 pointers; human rendering and localization remain integrator-owned."
    status: accepted
  - id: FR-PORTABLE-001
    component: portable-data-boundary
    text: "Keep document identity local to an explicit collection: document id and collection use the accepted opaque local-ID grammar; revision is a positive integer, and a published pack pins JCS SHA-256 bytes. Optional external_references contain absolute RFC 3986 URIs without resolution or calculation semantics. Canonical prose is limited to title, name, instruction, and notes. Extension names use lowercase DNS-label-style x-<owner>-<name> tokens, round-trip unchanged, and never affect core logic."
    status: accepted
  - id: FR-PAO-001
    component: adoption-readiness
    text: "Prove the Pão-relevant central-registry boundary with Schemami recipe-local vocabulary and operation diagnostics. Do not change, test-gate, or require a target Pão de Portugal branch; Pão owns any later adapter, mapping, UI overlay, aggregate, and compatibility report."
    status: accepted
  - id: FR-REL-001
    component: release-conformance
    text: "Publish a versioned release manifest, clean-cutover scope note, normative conversion and recipe-local vocabulary vectors, and cross-language conformance results. Create the stable tag only after all release gates pass; Pão adapter adoption is not a gate."
    status: accepted
acceptance_criteria:
  - id: AC-NAME-001-1
    fr: FR-NAME-001
    given: a canonical Schemami v1 schema, package, vector, or document
    when: identity and marker gates run
    then: it uses only the approved Schemami wire identity and protocol-owned immutable URL; legacy RCP identifiers fail in newly written canonical artifacts
    status: accepted
  - id: AC-MODEL-001-1
    fr: FR-MODEL-001
    given: the complete protocol field and API inventory
    when: the field-name review runs
    then: every field has an accepted definition, scope, type, and standard/value vocabulary decision; only same-scope ambiguity, unsafe aliasing, or undocumented semantics fail the review
    status: accepted
  - id: AC-MODEL-001-2
    fr: FR-MODEL-001
    given: a Schemami v1 document, package, validator result, and Calculus result
    when: naming and language ambiguity gates run
    then: contextually repeated names remain valid where their types and scopes differ; required content_language is one BCP 47 field and is never conflated with UI locale, translation, country or region, or display preference
    status: accepted
  - id: AC-CUTOVER-001-1
    fr: FR-CUTOVER-001
    given: an active Schemami v1 schema, package, vector, document, validator, viewer, or Calculus path
    when: the cutover inventory gate runs
    then: it contains only Schemami names and identifiers; RCP remains only in explicitly historical records, ADR-006, or negative unsupported-legacy input vectors
    status: accepted
  - id: AC-CUTOVER-001-2
    fr: FR-CUTOVER-001
    given: an RCP-marked input
    when: the released Schemami reader evaluates it
    then: it returns the documented unsupported-legacy diagnostic and never falls back to a legacy parser or migrator
    status: accepted
  - id: AC-VOCAB-001-1
    fr: FR-VOCAB-001
    given: a recipe-local ingredient, technique, or equipment entity unknown to any catalog
    when: it is structurally validated and rendered
    then: it remains valid and readable from source facts without a central or package entry
    status: accepted
  - id: AC-VOCAB-001-2
    fr: FR-VOCAB-001
    given: an operation requiring an absent fact for an unknown or local term
    when: the operation runs
    then: only that operation refuses with a pointer-specific machine code and the recipe remains available
    status: accepted
  - id: AC-VOCAB-001-3
    fr: FR-VOCAB-001
    given: a step with local id, source-language instruction, and explicit structured facts
    when: it is validated, rendered, and scheduled
    then: it requires no primitive or action catalog and only its explicit structured facts affect protocol behavior
    status: accepted
  - id: AC-VOCAB-001-4
    fr: FR-VOCAB-001
    given: lowercase kebab, snake, UUID-shaped, and 128-character local IDs plus uppercase, dotted, spaced, tilde, non-ASCII, and 129-character neighbours
    when: local identity validation and reference resolution run
    then: lowercase letters, digits, hyphen, and underscore at no more than 128 characters resolve exactly and every unsupported spelling or overlong value rejects without normalization
    status: accepted
  - id: AC-VOCAB-001-5
    fr: FR-VOCAB-001
    given: one step references multiple declared techniques
    when: validation, canonicalization, and round-trip rendering run
    then: ordered unique techniques is preserved byte-significantly; singular technique, duplicates, undeclared IDs, and reader sorting reject or fail conformance
    status: accepted
  - id: AC-CALC-006-1
    fr: FR-CALC-006
    given: explicit UCUM 2.2 same-dimension or Celsius/Fahrenheit input
    when: Go and TypeScript replay shared vectors
    then: they return identical canonical decimal strings with at most 16 total digits and four fractional digits under the pinned tie-rounding rule and no floating tolerance or integrator-dependent rounding
    status: accepted
  - id: AC-CALC-006-2
    fr: FR-CALC-006
    given: bare regional, unknown, formula relationship, non-measured quantity, cross-dimension, or mass-volume input
    when: conversion runs
    then: it refuses with the documented code and does not infer region, density, percentage, ratio, or ingredient facts
    status: accepted
  - id: AC-CALC-006-3
    fr: FR-CALC-006
    given: positive elapsed durations and a duration window
    when: schema validation and Go and TypeScript scheduling run
    then: PT8M, PT1H10M, P2D, and P1W use identical elapsed semantics; minimum, target, and maximum are preserved and every supplied pair is ordered; inverted windows, compact Model 1, negative, year, and month forms reject
    status: accepted
  - id: AC-CALC-006-4
    fr: FR-CALC-006
    given: a recipe with dependency edges and unrelated declared steps
    when: Go and TypeScript run reading_order
    then: they return the same dependency-respecting linear projection, using declaration order only to break ties, with no track or lane field required
    status: accepted
  - id: AC-CALC-006-5
    fr: FR-CALC-006
    given: an open guide plus percentage formulas whose named basis is correct, non-100, or absent
    when: schema, semantic validation, resolve_formula, and scale run
    then: guides admit measured or range only; a percentage basis appears exactly once at 100; recursive open guides and invalid basis authority reject identically
    status: accepted
  - id: AC-EVIDENCE-001-1
    fr: FR-EVIDENCE-001
    given: imported source evidence and a structured target field
    when: evidence validation runs
    then: the evidence uses a valid RFC 6901 target and cannot substitute for or alter the structured value used by logic
    status: accepted
  - id: AC-EVIDENCE-001-2
    fr: FR-EVIDENCE-001
    given: a refused operation
    when: its result is rendered by two integrations
    then: its stable problem type and pointer are identical; each integration may render its own localized wording
    status: accepted
  - id: AC-EVIDENCE-001-3
    fr: FR-EVIDENCE-001
    given: one video source and evidence for a step plus two ordered technique occurrences
    when: evidence validation and URI-fragment reconstruction run
    then: each pointer resolves, W3C temporal intervals are ordered, one source is reused, and selector offsets never alter schedule or culinary duration
    status: accepted
  - id: AC-PORTABLE-001-1
    fr: FR-PORTABLE-001
    given: a packed document and an external URI reference
    when: canonicalization and pack resolution run
    then: identity is local to collection, id, revision, and digest; the URI remains optional and unresolved and cannot alter calculation
    status: accepted
  - id: AC-PAO-001-1
    fr: FR-PAO-001
    given: a Schemami recipe with an unknown recipe-local term
    when: it is validated, rendered, and a fact-dependent operation is evaluated
    then: it remains valid and readable without a central entry; only the dependent operation refuses with a stable diagnostic
    status: accepted
  - id: AC-PAO-001-2
    fr: FR-PAO-001
    given: a Schemami release candidate
    when: release gates run
    then: no Pão repository checkout, branch, adapter, UI overlay, or Pão aggregate field is a required input or release gate
    status: accepted
  - id: AC-REL-001-1
    fr: FR-REL-001
    given: a release candidate
    when: release gates run from a clean clone
    then: cutover, schema, semantic, Calculus, vocabulary, and cross-language conformance gates pass before the stable tag is created
    status: accepted
protections:
  - id: SP-001
    text: "No released Schemami v1 path accepts, emits, aliases, or migrates RCP. Historical records remain clearly historical; an RCP marker receives an explicit unsupported-legacy result."
  - id: SP-002
    text: "Local, package, external, and integrator-resolved facts remain distinguishable in operation diagnostics; resolution never makes an unknown term appear centrally governed."
  - id: SP-003
    text: "The release must not create a Schemami recipe store, translation service, hosted model, or global catalog stewardship obligation."
  - id: SP-004
    text: "Pão adapts after publication on its own schedule. Its product aggregate remains authoritative, and no Pão code, branch, or test is a Schemami v1 release input."
  - id: SP-005
    text: "Active RCP implementation surfaces are classified before replacement; generated data is regenerated from Schemami sources. No text replacement may silently turn a historical record into false Schemami evidence."
  - id: SP-006
    text: "A field rename is a model decision, not a style cleanup. Reuse is permitted when scope and type retain meaning. Schemami v1 carries no convenience aliases or legacy spellings."
