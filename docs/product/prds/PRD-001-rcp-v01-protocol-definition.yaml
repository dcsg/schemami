# Open questions — unresolved items, must be closed before ship
# Resolved 2026-08-02: OQ-1 → DECISIONS #23 (kind-prefixed slugs; migration
# tracked by AC-REG-002-3). OQ-3 → targets set: ≥90% encoding coverage, ≤10 min
# median time-to-correct. OQ-4 → maturity field in each profile schema
# (folded into FR-PROF-003/AC-PROF-003-1).
open_questions:
  - "OQ-2: Harness implementation language — a SPEC (how) decision, to be recorded as an ADR when made. The protocol-level whats are already fixed and must not be re-litigated by the harness choice: JSON Schema 2020-12 dialect and CUE-flavoured declarative constraints (DECISIONS #8). Decision inputs gathered 2026-08-02 (interview): (a) no backend exists or is planned in the ecosystem, so there is no admission point to align with — the DDD review's F5 shared-kernel warning is moot for now and the harness is a CI/local tool; (b) Daniel writes none of the code — implementation is agent-authored and Daniel-reviewed, so the criterion is 'best and most efficient for the job', delegated to the SPEC author; (c) the CUE integration shape (CLI step vs embed vs re-express) is decided in the same SPEC section as the language, since option 'embed' forces Go by itself; (d) Daniel's preference: Node.js/TypeScript is not banned, but choosing it requires very strong, explicitly argued reasons — the SPEC's comparative research carries the burden of proof for Node; absent that proof, prefer alternatives."

