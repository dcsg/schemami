schema_version: "1.0"
type: prd
id: "PRD-001"
title: "RCP v0.1 protocol definition"
slug: "rcp-v01-protocol-definition"
status: accepted
rigor: "solo"
author: "Daniel Gomes"
created_at: "2026-08-02T16:28:22Z"

# Functional requirements — stable IDs flow through to SPEC.
#
# ID scheme (component codes, per docs/guidelines/traceability.md):
#   FR-PR-* protocol-core · FR-REG-* registry · FR-PROF-* profiles ·
#   FR-VAL-* validator · FR-SAFE-* safety-clamp (numbering per component)
# Every FR carries `component:` and a structured `trace:` list
# (DECISIONS #NN / research file refs). Both fields cascade to SPEC,
# artifacts, plans, and their sidecars.
#
# verify: omitted throughout — the validation harness that could run such
# checks IS a v0.1 deliverable (FR-VAL-001/FR-VAL-002); add verify commands via
# continuation once it exists.
requirements:
  - id: FR-PR-001
    component: protocol-core
    text: "The core schema is frozen as protocol v0.1: versioning conventions are documented ($id URL scheme, `rcp` version-field semantics, SchemaVer-flavoured change rules), the decode-compatibility rules bind to every subsequent change (unknown-field tolerance, enum catch-alls, no new required field without a default), and the freeze is a git tag."
    trace: ["FEAT-CORE-001", "DECISIONS #14", "DECISIONS #21", "DECISIONS #22", "research 02:475-560"]
    status: accepted
  - id: FR-PR-002
    component: protocol-core
    text: "Constraint and reference shapes are hardened in core: a constraint requires at least one bound and `of:` when ratio-based; the ingredient.item null-contradiction is resolved; the chucrute safety data (2% brine / pH 4.0) gets exactly one authoritative encoding referenced — not duplicated — by endpoint and profile blocks."
    trace: ["FEAT-CORE-002", "DECISIONS #5", "defect inventory 2026-08-02"]
    status: accepted
  - id: FR-REG-001
    component: registry
    text: "Registry entry document formats exist as JSON Schemas for the three vocabulary kinds — IngredientClass (functional roles, display names with pt-PT exactness, optional density/allergen/cross-reference fields), StepPrimitive (versioned id + ParamSpec, SPEC-008 lineage: new capability = new id), EquipmentProfile (kind + parameters participating in the maths) — honouring every directive in docs/guidelines/registry-governance.md, including the kind-prefixed slug convention (DECISIONS #23: ingredient.* / primitive.* / equipment.*)."
    trace: ["FEAT-REG-001", "DECISIONS #16", "DECISIONS #23", "registry-governance guideline", "research 00 §registry", "research 02:367-378"]
    status: accepted
  - id: FR-REG-002
    component: registry
    text: "The seed registry resolves every reference in the six example recipes (30 ingredient classes, 24 step primitives including trigger action `burp`, 6 equipment profiles, the endpoint-test vocabulary, temperature stage `thread`), and the six examples are migrated to kind-prefixed slugs per DECISIONS #23. A reference to a non-existent entry is a named lint failure; new entries enter only via the governance process — the pipeline never mints IDs."
    trace: ["FEAT-REG-002", "DECISIONS #22", "DECISIONS #23", "examples inventory 2026-08-02", "registry-governance guideline"]
    status: accepted
  - id: FR-PROF-001
    component: profiles
    text: "The bread profile schema exists and is hardened: additive allOf extension of core; flour-basis conventions (total-flour pivot incl. include_components across the component tree); maintenance-culture and carry-forward fields; bread safety bounds encoded as bounded data. Pão Alentejano validates against core AND bread profile."
    trace: ["FEAT-PROF-001", "DECISIONS #18", "research 03"]
    status: accepted
  - id: FR-PROF-002
    component: profiles
    text: "The pastry profile schema exists and is hardened: to_consistency open quantities, the four temperature shapes (target / range / named stage / curve), rest and lamination structures, make-ahead/serve-within fields. Pastéis de nata and brownie-ganache validate against core AND pastry profile, with the nata's embedded bread component passing bread rules."
    trace: ["FEAT-PROF-002", "DECISIONS #18", "research 04"]
    status: accepted
  - id: FR-PROF-003
    component: profiles
    text: "Draft profile schemas exist for the remaining five kinds (ferment, preserve, drink, coffee, component/dish): each defines the profile-block fields already observed or researched, is valid to author against, and carries a machine-readable maturity field (hardened|draft) in the profile schema itself — the harness surfaces maturity on every validation. Negroni (drink) and chucrute (ferment) validate against core AND their draft profiles."
    trace: ["FEAT-PROF-003", "DECISIONS #18", "OQ-4 resolution 2026-08-02"]
    status: accepted
  - id: FR-VAL-001
    component: validator
    text: "A committed Layer-1 validation harness (ajv-compatible, JSON Schema 2020-12) validates every example against core AND the profile selected by `kind`, via a single documented command, runnable in CI — making CLAUDE.md's re-validate-examples rule executable for the first time. Implementation language is a SPEC decision (OQ-2)."
    trace: ["FEAT-VAL-001", "DECISIONS #8", "research 07:38-81", "CLAUDE.md working conventions"]
    status: accepted
  - id: FR-VAL-002
    component: validator
    text: "A Layer-2 semantic linter enforces what the schema cannot: every registry/basis/uses/after reference resolves; every guard combination yields a complete connected DAG; component reference cycles are rejected; ratio-bound and field-relation constraints are expressed in CUE per decision #8. On first run against the unmodified examples it catches the known defects (mm-feed undeclared basis; calda produced-but-never-consumed; ganache version pinned against an unversioned target)."
    trace: ["FEAT-VAL-001", "DECISIONS #8 reaffirmed", "research 07:38-60", "defect inventory 2026-08-02"]
    status: accepted
  - id: FR-SAFE-001
    component: safety-clamp
    text: "A minimal fail-closed safety clamp (explicitly throwaway, NOT the Recipe Calculus) recomputes resolved values of severity-critical constraints under a scale transformation and refuses violations with the authored reason shown; refusal is the default on uncertainty."
    trace: ["FEAT-SAFE-001", "DECISIONS #15", "DECISIONS #22", "research 03:248-253", "CONCLUSIONS §5"]
    status: accepted

# Acceptance criteria — Given/When/Then, one or more per FR.
acceptance_criteria:
  - id: AC-PR-001-1
    fr: FR-PR-001
    given: "the repository at the v0.1 git tag"
    when: "a stranger reads schema/ and its versioning documentation"
    then: "the version semantics and change rules are explicit without asking Daniel anything"
    status: accepted
  - id: AC-PR-001-2
    fr: FR-PR-001
    given: "a proposed schema change that adds a required field without a default"
    when: "it is reviewed against the documented freeze rules"
    then: "the change is rejected by policy, citing the decode-compatibility contract"
    status: accepted
  - id: AC-PR-002-1
    fr: FR-PR-002
    given: "a constraint object carrying severity and reason but zero bound fields"
    when: "validated against the hardened core"
    then: "it is rejected"
    status: accepted
  - id: AC-PR-002-2
    fr: FR-PR-002
    given: "the chucrute document after hardening"
    when: "its safety encoding is inspected"
    then: "the 2% brine / pH 4.0 data exists in exactly one authoritative location, referenced (not duplicated) by the endpoint and profile blocks"
    status: accepted
  - id: AC-REG-001-1
    fr: FR-REG-001
    given: "a registry entry document missing a required field for its kind (e.g. an IngredientClass without functional roles)"
    when: "it is validated against the registry entry schema"
    then: "it is rejected with the missing field named"
    status: accepted
  - id: AC-REG-001-2
    fr: FR-REG-001
    given: "a registry entry or recipe reference using a bare (non-kind-prefixed) slug"
    when: "linted"
    then: "it is rejected citing DECISIONS #23 (kind-prefixed convention: ingredient.* / primitive.* / equipment.*)"
    status: accepted
  - id: AC-REG-002-1
    fr: FR-REG-002
    given: "the six example documents after slug migration"
    when: "Layer-2 reference resolution runs against the seed registry"
    then: "zero unresolved registry references remain"
    status: accepted
  - id: AC-REG-002-2
    fr: FR-REG-002
    given: "a recipe referencing a slug absent from the registry"
    when: "the linter runs"
    then: "the failure names the missing entry — no silent pass, and no code path mints the entry"
    status: accepted
  - id: AC-REG-002-3
    fr: FR-REG-002
    given: "the six examples rewritten to kind-prefixed slugs (DECISIONS #23)"
    when: "the full harness runs"
    then: "all six validate green — the migration is complete with zero information loss and is a recorded, reviewed change (not a silent rewrite)"
    status: accepted
  - id: AC-PROF-001-1
    fr: FR-PROF-001
    given: "examples/alentejano.rcp.yaml with kind: bread"
    when: "validated by the harness"
    then: "it passes core AND bread-profile validation"
    status: accepted
  - id: AC-PROF-001-2
    fr: FR-PROF-001
    given: "a bread document violating a profile-declared bound (e.g. salt ratio beyond the declared maximum)"
    when: "validated"
    then: "the rejection names the violated bound and its authored source"
    status: accepted
  - id: AC-PROF-002-1
    fr: FR-PROF-002
    given: "pasteis-de-nata and brownie-ganache with kind: pastry"
    when: "validated by the harness"
    then: "both pass core AND pastry validation, and the nata's embedded kind: bread component passes bread rules"
    status: accepted
  - id: AC-PROF-003-1
    fr: FR-PROF-003
    given: "negroni (kind: drink) and chucrute (kind: ferment)"
    when: "validated by the harness"
    then: "both pass core AND their draft profiles, and the harness output shows maturity: draft read from the profile schema's maturity field"
    status: accepted
  - id: AC-VAL-001-1
    fr: FR-VAL-001
    given: "a fresh clone of the repository"
    when: "the single documented validation command runs"
    then: "all six examples validate and the command exits 0"
    status: accepted
  - id: AC-VAL-001-2
    fr: FR-VAL-001
    given: "any schema or example edit that breaks shape validation"
    when: "the runner executes"
    then: "it exits non-zero naming the file and the failing JSON pointer"
    status: accepted
  - id: AC-VAL-002-1
    fr: FR-VAL-002
    given: "the current six examples unmodified"
    when: "the semantic linter first runs"
    then: "it reports at least: alentejano's `of: mm-feed` undeclared basis; nata's calda component produced but never consumed; brownie's `version: 1` pin against a ganache document that declares no version"
    status: accepted
  - id: AC-VAL-002-2
    fr: FR-VAL-002
    given: "the linter's findings on the examples"
    when: "v0.1 completes"
    then: "each known defect is either fixed in the examples/schema or explicitly waived in a recorded decision — none silently passes"
    status: accepted
  - id: AC-VAL-002-3
    fr: FR-VAL-002
    given: "a recipe where some guard combination yields a disconnected or non-terminating DAG"
    when: "linted"
    then: "it is rejected naming the guard combination and the unreachable step(s)"
    status: accepted
  - id: AC-SAFE-001-1
    fr: FR-SAFE-001
    given: "chucrute scaled so that salt falls below min_ratio 0.02 of the vegetable basis"
    when: "the safety clamp evaluates the transformation"
    then: "the transformation is refused and the authored reason (pt/en) is surfaced"
    status: accepted
  - id: AC-SAFE-001-2
    fr: FR-SAFE-001
    given: "any severity-critical constraint violation produced by scaling"
    when: "the clamp evaluates"
    then: "no code path silently accepts it — refusal is the default on uncertainty"
    status: accepted

# Protections — what must NOT change when this ships
protections:
  - id: SP-001
    text: "The 8 non-negotiable design decisions in CLAUDE.md (roles-not-fields; basis; opt-in DAG; enum/registry/prose discipline; bounded fail-closed safety data; one core + profiles; documents as system of record; JSON canonical / YAML authoring with BE/CI-only validation) hold for every v0.1 deliverable; reopening any requires an explicit DECISIONS.md entry."

