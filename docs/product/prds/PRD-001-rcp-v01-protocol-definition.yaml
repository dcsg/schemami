# Forcing questions — answered once at authoring, scored by evaluator
forcing_questions:
  problem_behind_problem: "Without RCP v0.1 two failure states persist: (1) five independent recipe representations with no shared type and three divergent baker's-percentage implementations keep drifting across surfaces — every new feature multiplies maintenance (internal evidence, research track 01); (2) Daniel's actual recipes stay trapped in physical books — unscalable, unsearchable, uncookable with any machinery. Without a validated protocol and working harness there is no correct target to converge on and no safe way to bring book recipes in."
  evidence_or_hypothesis: "Internal evidence + n=1 stated behaviour. The codebase inventory (track 01) documented the five representations and three baker's-% implementations first-hand; CONCLUSIONS records that convergence 'is justified by internal evidence alone'. The consumer side is n=1: Daniel's stated behaviour as PO (ingest from his cookbooks and cook from them — DECISIONS #11). Broader demand (ICP-2 expansion) remains explicit hypothesis gated behind AT-2/AT-4; v0.1 does not depend on it."
  north_metric_and_counter: "Daniel's north star, verbatim: 'flexibility to ingest any recipe and easily classify it, and allow integrators to manage and create interfaces that users can easily follow and understand the recipes.' Measurable form (confirmed): NORTH — encoding coverage: % of attempted recipes (any category, from Daniel's real books) that encode fully in RCP with zero information loss and zero core-schema changes, classified via existing facets; numeric target set at dogfood start (OQ-3). Standing integrator guarantee: every valid document renders correctly (if incompletely) from core alone — the additive-profile rule. COUNTER — zero silent safety-bound violations (every violation refused with a reason) AND the six-example regression suite never goes red."
  must_not_change: "The 8 non-negotiable design decisions in CLAUDE.md. Reopening any requires an explicit DECISIONS.md entry."
  riskiest_assumption: "Solo capacity: that the v0.1 scope (core freeze + registry formats/seed + two hardened profiles + five drafts + two-layer harness + clamp) is completable by one person before momentum is lost — ranked above extraction-quality risk (A11×A5), which has AT-3 as its designed test and lands after v0.1."

