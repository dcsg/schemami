cancelled_at: null
cancelled_reason: null
forcing_questions:
  problem_behind_problem: "Integrators need reusable protocol behavior rather than copying a CLI or viewer engine."
  evidence_or_hypothesis: "The existing reference engines can become public packages without changing v1 semantics."
  north_metric_and_counter: "North: two independent package consumers pass the shared corpus. Counter: zero new SDK-only semantics."
  must_not_change: "Schemami v1 wire behavior and app/provider boundaries."
  riskiest_assumption: "Extraction can remove duplication without destabilizing existing CLI/viewer consumers."
