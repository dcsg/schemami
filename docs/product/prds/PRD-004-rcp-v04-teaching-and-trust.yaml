open_questions:
- 'OQ-1: Do structured start/end fields join core beside the #t= fragment encoding, or is
  the fragment blessed as the sole normative form? Resolve in SPEC-004 with renderer and validation
  evidence.'
- 'OQ-2: The axis enum''s initial values (diet / equipment / region / season / technique /
  scale?) and the name of its catch-all — settle against the corpus, seeded only from axes
  real documents exercise.'
- 'OQ-3: How `import` and `provenance` relate to the collection qualifier — research 02 D.4''s
  warning stands: don''t conflate identity with provenance.'
- 'OQ-4: Is the qualifier MANDATORY on cross-collection pointers (the architect''s asymmetry
  point), or does collection-relative resolution make that moot?'
- 'OQ-5: Document versioning remains unspecified (research 09 F9): when must a revision increment,
  is a published revision immutable, what signals that v2 supersedes v1? Decide whether v0.4
  closes this or names it as the next cut''s problem.'
- 'OQ-6: Render-time shadowing (a user''s own roux shadows the canonical link): confirm it
  stays a surface concern with only the resolution ORDER named by the protocol — CSS''s split
  — or whether the protocol must say more.'
