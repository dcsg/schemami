schema_version: '1.0'
type: prd
id: PRD-004
title: 'RCP v0.4 — identity, trust and teaching: which recipe, which variant, which method'
slug: rcp-v04-identity-trust-teaching
status: accepted
rigor: solo
author: Daniel Gomes
created_at: '2026-08-03T14:55:00Z'
requirements:
- id: FR-PACK-001
  component: collections and packs
  text: 'Reference SCOPE is normative: an id is unique within a COLLECTION (the document set
    a consumer loads together); an unqualified reference resolves within the referring document''s
    own collection; a reference crossing into another collection MUST name it. Merging collections
    MUST NOT flatten them — colliding ids from different collections both survive and stay
    resolvable. The protocol never dictates how a system MINTS ids (system concern, DECISIONS
    #19/#21); it always states how a reference RESOLVES (format fact, DECISIONS #21 boundary
    test).'
  trace:
  - BRAIN-001 decisions 1–2
  - research 09 F9
  - 'DECISIONS #21'
  - research 08 F2 (Mealie slug collapse)
  status: proposed
- id: FR-PACK-002
  component: collections and packs
  text: 'The pack/collection manifest is a normative document format: it declares the collection''s
    identifier authoritatively, plus optional publisher, licence and version. Documents MAY
    carry the collection identifier for lone travellers; the manifest wins on conflict. Manifest
    identifiers live in the QUALIFIER''s value space — the recipe `id` pattern MUST NOT widen
    (a widened pattern breaks v0.1-era readers and forces a MODEL bump). Pack SERVICES (hosting,
    publishing workflow, any registry server) remain out of scope, app-side.'
  trace:
  - BRAIN-001 decisions 6–7
  - architect brief 2026-08-03
  - 'DECISIONS #19'
  - 'DECISIONS #14 (decode-compat)'
  status: proposed
- id: FR-PR-007
  component: protocol-core
  text: The lineage block gains defined semantics and version-pinned pointers. Every lineage
    field (forked_from, family, variant_of) MUST be described in the schema and MUST support
    a pinned revision in the same shape componentRef already uses (target-declared version
    + reference-site pin). A fork is a NEW document with its own id carrying a pointer home
    — self-contained snapshots stay settled. `family` is the capability-style grouping slug
    ('these documents fill the same role').
  trace:
  - BRAIN-001 decision 3
  - research 09 F1/F3/F4
  - schema componentRef :374-393
  - research 02 D.4
  status: proposed
- id: FR-PR-008
  component: protocol-core
  text: 'Variant discriminators MUST be machine-readable: a variant declares a typed AXIS
    from a closed enum carrying a catch-all value from day one (decode-compat), plus a registry-resolvable
    VALUE naming the distinction. `variant_label` remains the human display string and is
    never machine-read (decision #4 prose discipline). Absent a resolvable value the document
    stays valid — the discriminator is optional, never required.'
  trace:
  - BRAIN-001 decision 4
  - research 09 F2 (the blocker)
  - 'DECISIONS #4'
  - architect brief (catch-all + absent-registry risk)
  status: proposed
- id: FR-VAL-003
  component: validator
  text: 'Drift is DETECTED, not compiled away: when a document''s lineage pointer pins revision
    N and the parent has moved past N, validation reports staleness NAMING the variant and
    both revisions. The existing componentRef pin check MUST also be hardened to compare the
    pinned version against the target''s declared version (today it only checks that the target
    declares one). Compilation of variants from parent + operations is explicitly NOT adopted
    — it would be a second execution semantics beside the Recipe Calculus and formulas-in-data,
    both founding non-goals; the rejection is recorded as a decision, not left silent.'
  trace:
  - BRAIN-001 decision 5
  - architect brief 2026-08-03
  - research 06 §6 (compiled-not-forked)
  - research 09 F8/F9
  - lint.go:165-174
  status: proposed
- id: FR-REG-007
  component: registry
  text: 'The registry gains the entry kinds the variant discriminator resolves against, seeded
    from real documents only (never speculative vocabulary): the axes actually exercised by
    the corpus get their kinds and seed entries, and an axis with no registry backing MUST
    NOT ship as an enum value — shipping a field that points at absent registries is the failure
    mode.'
  trace:
  - BRAIN-001 open question 2
  - architect brief 2026-08-03
  - 'DECISIONS #23'
  - 'DECISIONS #25'
  status: proposed
- id: FR-PUB-001
  component: publish-time resolution
  text: 'Publish-time reference resolution MUST be verified (engineering obligation 3): a
    resolved cross-document reference carries resolver_version and a content hash of the resolved
    target; verification tooling re-checks the pin; a missing or changed target is DETECTED
    as a verification failure naming the reference — never silently rendered as current. Hashing
    uses the standard library only (dependency freeze).'
  trace:
  - FEAT-PUB-001
  - 'DECISIONS #21'
  - 'engineering obligation #3'
  status: proposed
- id: FR-REG-005
  component: registry
  text: 'Registry entries for preparation classes (ingredient.preparation.*) and techniques
    (technique.*) MUST support an optional canonical-recipe link — a versioned reference to
    the document that teaches the method. Canonical is CURATION, not essence: many roux documents
    may exist; the steward picks what the class points at, and the link never becomes a required
    field.'
  trace:
  - FEAT-REG-006
  - research 08 (F1–F8)
  - 'DECISIONS #7'
  - 'DECISIONS #11'
  status: proposed
- id: FR-REG-006
  component: registry
  text: 'The ingestion extraction rule MUST be binding and machine-checked: an embedded sub-preparation
    is lifted to an inline component when the source gives its method, and referenced as a
    preparation class when it does not — never invented steps, never silently dropped prose.
    The semantic linter MUST surface a sub-preparation mention that anchors to nothing (no
    component, no class reference) as a warning naming the mention.'
  trace:
  - research 08
  - 'DECISIONS #11'
  - prose-parking rule (v0.2)
  status: proposed
- id: FR-TOOL-004
  component: developer tooling
  text: 'Renderers MUST surface a see-the-method affordance wherever a linked mention appears:
    from an ingredient or technique carrying a canonical link, the viewer can load and display
    the linked method (including its schedule placement before the parent method, per the
    Calculus) without losing the parent recipe.'
  trace:
  - FEAT-REG-006
  - 'Daniel 2026-08-02 (end goal: load the technique and do the procedure)'
  - ADR-002 engine seam
  status: proposed
- id: FR-PR-005
  component: protocol-core
  text: 'Media temporal fragments MUST be normative: schema/MEDIA.md blesses W3C Media Fragments
    (#t=start,end) on any media uri; renderers pass the fragment through to playback so one
    full-recipe video is addressable per technique or sub-recipe moment; the same asset may
    be referenced many times with different ranges. Whether structured start/end fields ALSO
    enter core is resolved during the spec (open question OQ-1), and the resolution is recorded
    — fragment-only is the shipped floor either way, never an unresolved placeholder.'
  trace:
  - FEAT-CORE-006
  - Daniel 2026-08-03 (video technique ranges)
  - W3C Media Fragments URI 1.0
  status: proposed
- id: FR-PR-006
  component: protocol-core
  text: 'The stage-forked identity question MUST be settled as a recorded decision (DECISIONS
    entry): when a staged or forked recipe keeps the parent''s identity (lineage) versus becoming
    a new document — with the schema consequence expressed in lineage fields and demonstrated
    by validating example documents for both sides of the line.'
  trace:
  - FEAT-REG-006 (stage-forked identity Q)
  - Fornada padaria.recipes.forked_from
  - 'DECISIONS #7'
  status: proposed
acceptance_criteria:
- id: AC-PACK-001-1
  fr: FR-PACK-001
  given: two collections each containing a document with the id "pao-alentejano", loaded together
  when: validation and reference resolution run
  then: both documents survive and stay individually resolvable; no id is rewritten and no
    pointer rebinds — the collision is not an error
  status: proposed
- id: AC-PACK-001-2
  fr: FR-PACK-001
  given: a document whose lineage or component reference names an id present in BOTH its own
    collection and another loaded collection
  when: the reference resolves
  then: it resolves to its OWN collection's document; a reference intended for the other collection
    is only valid when qualified
  status: proposed
- id: AC-PACK-002-1
  fr: FR-PACK-002
  given: a collection with a manifest declaring its identifier, and a document declaring a
    different one
  when: the collection loads
  then: the manifest identifier wins and the conflict is reported; a lone document with no
    manifest still self-describes via its own field
  status: proposed
- id: AC-PACK-002-2
  fr: FR-PACK-002
  given: the v0.1-era frozen reader from the decode-compat gate
  when: it decodes documents carrying collection qualifiers and pack manifests exist alongside
  then: decoding succeeds with v0.1 fields intact — the recipe id pattern is unchanged and
    qualification rode in on new optional fields
  status: proposed
- id: AC-PR-007-1
  fr: FR-PR-007
  given: a variant document declaring lineage.variant_of pinned to parent revision N
  when: the schema and linter validate it
  then: every lineage field carries a description in the schema, the pin validates in componentRef's
    shape, and the variant remains a complete self-contained document
  status: proposed
- id: AC-PR-008-1
  fr: FR-PR-008
  given: two sibling variants of one family differing on a declared axis (e.g. axis=diet,
    values gluten-free vs classic)
  when: a consumer inspects them without reading prose
  then: the axis and value are machine-readable and resolve; a document omitting the discriminator
    stays valid; an unknown axis decodes into the catch-all rather than failing
  status: proposed
- id: AC-VAL-003-1
  fr: FR-VAL-003
  given: a variant pinned to parent revision 3 and a parent that has since declared revision
    4
  when: validation runs
  then: staleness is reported naming the variant, the pinned revision and the current one
    — and the same run FAILS a componentRef whose pin no longer matches the target's declared
    version
  status: proposed
- id: AC-VAL-003-2
  fr: FR-VAL-003
  given: the rejection of compiled variants
  when: the decision record is read
  then: DECISIONS carries the entry naming the founding-non-goal grounds (second execution
    semantics; formulas-in-data) so the rejection is recorded rather than silent
  status: proposed
- id: AC-REG-007-1
  fr: FR-REG-007
  given: the axis enum shipped by FR-PR-008
  when: the registry is validated
  then: every non-catch-all axis value has its registry kind and at least one seed entry drawn
    from a real document; no axis ships pointing at an absent registry
  status: proposed
- id: AC-REG-005-1
  fr: FR-REG-005
  given: a technique or preparation-class registry entry carrying a canonical-recipe link
  when: the registry validates
  then: the link's shape (document id + version) validates and the reference resolves to an
    existing document; an entry WITHOUT the link stays valid (optional, never required)
  status: proposed
- id: AC-REG-006-1
  fr: FR-REG-006
  given: a source recipe whose method embeds a sub-preparation WITH its method given (the
    sauces-bible roux)
  when: ingested per the extraction rule
  then: the sub-preparation is an inline component with its own method — no prose parked in
    notes
  status: proposed
- id: AC-REG-006-2
  fr: FR-REG-006
  given: a source recipe that names a sub-preparation WITHOUT giving its method
  when: ingested and linted
  then: the mention is a preparation-class reference with no invented steps; a mention anchoring
    to nothing raises a linter warning naming it
  status: proposed
- id: AC-TOOL-004-1
  fr: FR-TOOL-004
  given: the viewer rendering a document whose ingredient or technique carries a canonical
    link resolvable within the loaded corpus
  when: the user activates the see-the-method affordance
  then: the linked method renders (ingredients + steps) without losing the parent recipe view
  status: proposed
- id: AC-TOOL-004-2
  fr: FR-TOOL-004
  given: a linked sub-recipe with durations, consumed by a parent step
  when: the schedule view renders
  then: 'the linked preparation''s placement appears before the consuming step per the Calculus
    two-stage schedule (the end goal: ''say when that procedure must be done before you start'')'
  status: proposed
- id: AC-PR-005-1
  fr: FR-PR-005
  given: 'a media entry whose uri carries #t=120,180 and whose asset is supplied'
  when: rendered
  then: playback starts at the fragment start (seek honoured), and a second entry referencing
    the SAME asset with a different range renders independently
  status: proposed
- id: AC-PUB-001-1
  fr: FR-PUB-001
  given: a document with cross-document references, resolved at publish time
  when: verification tooling runs
  then: every reference carries resolver_version + content hash and verification passes green
  status: proposed
- id: AC-PUB-001-2
  fr: FR-PUB-001
  given: a resolved reference whose target document has since changed (or vanished)
  when: verification tooling runs
  then: verification FAILS naming the reference and the nature of the break — the inverted
    proof ships with the gate
  status: proposed
- id: AC-PR-006-1
  fr: FR-PR-006
  given: the recorded identity decision and two example documents — a stage-fork that keeps
    identity and a fork that becomes a new recipe
  when: both validate against core
  then: lineage fields distinguish the two cases exactly as the decision prescribes
  status: proposed
protections:
- id: SP-001
  text: 'Fail-closed safety semantics and authored refusal reasons are untouched: the frozen
    calculus vectors stay byte-identical; any vector change outside a calculus/SPEC.md-change
    commit is a defect.'
- id: SP-002
  text: 'Decode-compatibility holds both directions: no new required fields without defaults;
    the frozen v0.1 reader gate and the current-accepts-old gate stay green.'
- id: SP-003
  text: calculus/SPEC.md remains public-normative and self-contained — no project ids, no
    internal references enter it through this cut.
- id: SP-004
  text: 'DECISIONS #26 vocabulary is binding (sub-recipe / preparação / técnica used exactly);
    DECISIONS #27 media boundary and the attestation stay in force — canonical links and fragments
    never smuggle book media.'
- id: SP-005
  text: 'Dependency freeze: PUB-001 hashing and resolution use the standard library only;
    any new dependency requires a recorded decision first.'
- id: SP-006
  text: The recipe `id` value pattern MUST NOT widen. Qualification rides on new OPTIONAL
    fields in the qualifier's value space — widening the pattern breaks v0.1-era readers and
    forces a MODEL bump, the one outcome this cut must avoid (architect brief 2026-08-03).
- id: SP-007
  text: 'Pack SERVICES stay outside the protocol: hosting, publishing workflow and any registry
    server remain app-side per DECISIONS #19/#21. This cut ships the pack FORMAT and its resolution
    semantics — the thing that makes a distribution layer possible later, not the layer.'
