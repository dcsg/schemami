forcing_questions:
  problem_behind_problem: 'FOUR failures now (Daniel, options-interview + brainstorm 2026-08-03).
    The three teaching/trust ones stand: DEAD-END MENTIONS (''faça um roux'' with no path
    to the method — hit twice in real dogfood), UNVERIFIABLE LINKS (references resolve on
    hope; nothing pins what was resolved), UN-ADDRESSABLE VIDEO (''minute 2–3 is the roux''
    is inexpressible). The fourth emerged mid-scoping and reframed the cut: AMBIGUOUS IDENTITY
    — Daniel''s observation that the frequent real case is landing on a VARIATION rather than
    the original, which research 09 traced to bare-slug ids with no defined scope, lineage
    pointers with no version, and a variant discriminator that is prose (so nothing can select
    or explain a choice). Identity is upstream of teaching: canonical links point at documents,
    so the bridge is built on it.'
  evidence_or_hypothesis: 'Dogfood + industry research: the brownie/ganache gap and the sauces-bible
    roux page arose from ingesting real recipes (recorded in DECISIONS and research 08); the
    verified research day found every examined food ontology dissolves intermediates (axiom-level
    foodon.owl finding) and ERP systems unanimously name "sub-recipe" — the industry names
    what the protocol cannot yet express. Plus research 09 (four verified tracks, 2026-08-03):
    RCP''s own lineage block is an undesigned port of Fornada''s columns with zero descriptions,
    zero decision entries and zero uses across all twelve documents; every mature domain (STEP,
    SAP, Gradle, Maven) separates version/variant/fork onto distinct fields; the recipe domain
    has solved none of it (microformats'' u-remix-of blocked for want of any publisher or
    consumer).'
  north_metric_and_counter: 'TWO norths, explicitly: (a) mention→method coverage — every embedded
    sub-preparation across all ingested documents (public examples + private collection) resolves
    to a viewable method; (b) verified-link coverage — 100% of cross-document references in
    the corpus carry hash-pinned resolution, and a broken link is DETECTED, never rendered
    as current. COUNTER (must not move): zero change to any safety refusal or authored reason;
    frozen calculus vectors byte-identical; decode-compat green; the six examples keep validating
    unchanged.'
  must_not_change: 'The full guard set: fail-closed semantics + authored refusals untouched;
    frozen vectors byte-identical; decode-compat both directions (no new required fields);
    calculus/SPEC.md public-normative purity; DECISIONS #26 vocabulary binding and #27 media
    boundary; dependency freeze (PUB-001 hashing via stdlib; new deps need a recorded decision).
    ADDED after the brainstorm: the recipe id value pattern must not widen (SP-006); pack
    services stay app-side (SP-007); offline self-containment of variants stays settled —
    detection replaces compilation, which is rejected as a second execution semantics beside
    the Calculus.'
  riskiest_assumption: TWO now. (1) CURATION SCALES — authored canonical links stay honest
    and complete without drifting toward auto-resolution; if curation cannot keep up, dead-ends
    return wearing links. (2) COLLECTION-SCOPED IDENTITY IS ENOUGH — that scoping ids to a
    collection, with an optional qualifier, genuinely resolves cross-system ambiguity without
    a global namespace or content-addressed identity; if it does not, the qualifier becomes
    mandatory everywhere and the design drifts toward the URI-widening that SP-006 forbids.
