forcing_questions:
  problem_behind_problem: 'The protocol computes nothing: cook-time math lives in a throwaway clamp, so
    every consumer must reimplement scaling/basis/guards — the five-divergent-implementations disease
    waiting at the math layer, where disagreement means a wrong salt quantity, not a rendering glitch.
    Recipes render but cannot schedule; ADDITION discipline is proven by regression, not contract; media
    references point at nothing.'
  evidence_or_hypothesis: 'Direct: the clamp is labelled throwaway by its own AC; the viewer''s JS engine
    already needed conformance vectors to hold L1 parity — the mechanism''s first consumer, proven in
    v0.2 (agreement on first replay); Daniel''s 2026-08-03 review demanded ordering/timeline the viewer
    could not derive; example docs reference media assets that do not exist. Hypothesis-only, honestly
    labelled: how much media value materializes for a five-document collection.'
  north_metric_and_counter: 'NORTH — cross-stack equivalence: Calculus conformance vectors green in two
    independent implementations (Go reference + TS through the engine seam) covering scaling, basis resolution,
    guards, fail-closed clamps, and timeline derivation. COUNTER — no MODEL bump; corpus + private collection
    stay green; the viewer remains a fast self-contained single file.'
  must_not_change: Fail-closed safety survives the clamp-to-Calculus replacement verbatim (same refusals,
    same authored reasons); the engine-seam contract stays intact (WASM still drops in later); the two-surface
    split; the media licence two-tier stance — source-book media never reproduced.
  riskiest_assumption: 'That conformance vectors buy REAL equivalence, not false confidence — vector coverage
    is the risk: an under-covered edge (unit conversion, guard combination, timeline arithmetic) lets
    two green implementations disagree in a kitchen. Secondary: timeline derivation specified from one
    collection''s sparse durations. Mitigation: AC-CALC-002-2 makes edge-class coverage mechanical.'
