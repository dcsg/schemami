requirements:
- id: FR-CALC-001
  component: recipe-calculus
  text: The Recipe Calculus is specified once — a normative spec defining every exported function's domain,
    unit semantics and edge behaviour (zero, min_batch floors, ratio invariance, fixed-scaling asymmetry)
    — with a Go reference implementation replacing the throwaway clamp. Every existing refusal case (the
    v0.2 acceptance sweep's accept/refuse outcomes and authored pt/en reasons) reproduces verbatim through
    the Calculus; the clamp is then deleted.
  trace:
  - FEAT-CALC-001
  - 'DECISIONS #13'
  - 'DECISIONS #15'
  - 'engineering obligation #1'
  status: proposed
- id: FR-CALC-002
  component: recipe-calculus
  text: 'Cross-stack conformance vectors: the reference implementation writes them (the oracle pattern
    proven by v0.2''s L1 vectors), and a second independent implementation — TypeScript, entering through
    the ADR-002 engine seam — replays the full set green in CI. Vector coverage is disciplined mechanically:
    every enumerated edge class (unit boundaries, guard combinations, fixed-quantity refusals, min_batch,
    ratio invariance, timeline arithmetic) has vectors, checked by tooling, not intention.'
  trace:
  - FEAT-CALC-001
  - v0.2 conformance-vector precedent
  - forcing Q5 risk record
  status: proposed
- id: FR-CALC-003
  component: recipe-calculus
  text: 'Ordering and timeline are Calculus functions: topological reading order, parallel-track interleaving,
    and the time-anchored schedule (DAG + durations → per-component start offsets). The when-vs-how split
    holds: the referencing recipe owns WHEN (its steps anchor refs), the referenced owns HOW, the schedule
    is computed. Vector-covered in both implementations.'
  trace:
  - FEAT-CALC-002
  - 'DECISIONS #3'
  - research 04:61-80
  - Daniel 2026-08-03 viewer review
  status: proposed
- id: FR-TOOL-002
  component: tool
  text: 'Media surfaces: asset conventions documented (location, single-file-viewer handling, hosting-is-app-side
    boundary); real personal assets exist for at least one private document and render in the viewer by
    role — failure media visibly labelled as failure reference. Source-book media never enters the repo
    in any form.'
  trace:
  - FEAT-TOOL-002
  - core $defs/media (v0.1)
  - research 04 media_hint
  - Daniel 2026-08-03
  status: proposed
- id: FR-TOOL-003
  component: tool
  text: 'The viewer consumes the TS Calculus through the unchanged engine seam: a scale control appears
    only when the engine declares the clamp capability (scaling past a critical bound renders the authored
    pt/en refusal), and a schedule view renders FR-CALC-003''s derived timeline. Zero changes to the RcpEngine
    v1 interface — capabilities only.'
  trace:
  - FEAT-TOOL-001 playground phase (partial)
  - FEAT-CALC-002
  - ADR-002
  status: proposed
- id: FR-PR-004
  component: protocol-core
  text: 'Decode-compatibility becomes mechanical: bidirectional CI fixtures — a frozen v0.1-era reader
    tolerates every v0.3 document (unknown fields per VERSIONING.md), the current reader decodes every
    v0.1-tagged document — and the gate provably CAN fail (a deliberately breaking fixture fails it).'
  trace:
  - FEAT-CORE-003
  - 'DECISIONS #14'
  - 'engineering obligation #2'
  status: proposed
acceptance_criteria:
- id: AC-CALC-001-1
  fr: FR-CALC-001
  given: every v0.2 refusal case in the acceptance sweep
  when: re-run through the Calculus
  then: accept/refuse outcomes and authored reasons are identical, and the throwaway clamp is deleted
  status: proposed
- id: AC-CALC-001-2
  fr: FR-CALC-001
  given: the Calculus spec
  when: reviewed against the reference implementation
  then: every exported function has domain, unit and edge semantics defined — no behaviour exists only
    in code
  status: proposed
- id: AC-CALC-002-1
  fr: FR-CALC-002
  given: the full Calculus vector set
  when: both implementations replay it in CI
  then: both are green — equivalence is mechanical, not claimed
  status: proposed
- id: AC-CALC-002-2
  fr: FR-CALC-002
  given: the enumerated edge classes
  when: coverage is checked mechanically
  then: every class has vectors; a class without vectors fails the check
  status: proposed
- id: AC-CALC-003-1
  fr: FR-CALC-003
  given: the torta example document
  when: ordering derivation runs
  then: the mise-en-place order and an interleaved schedule with start offsets emerge — pinned by vectors
    in both implementations
  status: proposed
- id: AC-CALC-003-2
  fr: FR-CALC-003
  given: an entremet-class fixture (multi-day, parallel tracks)
  when: the schedule derives
  then: component start times respect the DAG and duration windows — vectors, both implementations
  status: proposed
- id: AC-TOOL-002-1
  fr: FR-TOOL-002
  given: the documented asset conventions and a private document referencing a personal photo
  when: the viewer renders locally
  then: the asset displays; example placeholder URIs are resolved or explicitly marked absent
  status: proposed
- id: AC-TOOL-002-2
  fr: FR-TOOL-002
  given: media entries across roles
  when: rendered
  then: failure media is visibly labelled; no repo asset originates from a source book (reviewed attestation)
  status: proposed
- id: AC-TOOL-003-1
  fr: FR-TOOL-003
  given: an engine declaring the clamp capability
  when: the user scales past a critical bound
  then: the authored pt/en refusal renders; without the capability the control does not exist
  status: proposed
- id: AC-TOOL-003-2
  fr: FR-TOOL-003
  given: the schedule view on the torta
  when: rendered
  then: derived start offsets show; the mock-engine test proves a capability-richer engine changes zero
    UI code
  status: proposed
- id: AC-PR-004-1
  fr: FR-PR-004
  given: the frozen v0.1-era reader and the current reader
  when: both run over the cross-version corpus in CI
  then: old reader tolerates v0.3 documents; current reader decodes v0.1-tagged documents
  status: proposed
- id: AC-PR-004-2
  fr: FR-PR-004
  given: a deliberately breaking fixture (new required field without default)
  when: the compat gate runs
  then: it FAILS — the gate is proven able to fail
  status: proposed
protections:
- id: SP-001
  text: 'Fail-closed parity: the clamp-to-Calculus replacement changes no refusal outcome and no authored
    reason; safety semantics survive verbatim (DECISIONS #15).'
- id: SP-002
  text: 'ADDITION-only continues: every document valid at rcp-v0.2 remains valid throughout v0.3 per schema/VERSIONING.md.'
- id: SP-003
  text: 'Engine-seam stability: RcpEngine version 1 unchanged; new powers arrive only as additive capabilities
    (ADR-002 no-rewrite guarantee).'
- id: SP-004
  text: 'Media boundary: licence stays required; personal assets only; source-book media never enters
    the repo in any form.'
