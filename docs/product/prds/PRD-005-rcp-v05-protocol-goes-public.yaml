forcing_questions:
  problem_behind_problem: >-
    Three failures, selected by Daniel 2026-08-04. (1) THE PROTOCOL IS
    UNREADABLE TO OUTSIDERS — four tagged versions, a normative Calculus with
    27 conformance vectors and a 109-entry registry, and the only way to
    understand any of it is to clone the repo and read raw JSON Schema. A
    protocol nobody can read is a private format with extra steps. (2) THE
    VIEWER EXISTS BUT NOBODY CAN REACH IT — a self-contained 203 KB page that
    answers "what is this?" better than any prose, reachable only by cloning
    and opening a local file. (3) NO ENTRY POINT FOR A SECOND IMPLEMENTER — the
    whole point of a protocol is that someone else can implement it; the
    Calculus SPEC is deliberately public-normative and the vectors are
    shippable, but there is nowhere to send a person who says "I want to write
    an RCP reader". Daniel explicitly did NOT select "you can't share it": this
    is about the artefact being legible, not about promotion.
  evidence_or_hypothesis: >-
    STRUCTURAL, NOT OBSERVED — stated honestly because nobody has yet tried to
    read RCP from outside, so there are no reports to cite. The evidence is the
    gap between what the artefacts CLAIM and what a stranger can reach:
    calculus/SPEC.md is deliberately public-normative and carries no project
    ids (verified by a test), the conformance vectors are shipped with the
    protocol as a cross-stack contract, and VERSIONING.md binds from a tag
    forward — all of which presume an outside reader who currently has no
    surface to read.
  north_metric_and_counter: >-
    TWO norths, explicitly. (a) SECOND-IMPLEMENTER COMPLETENESS — everything a
    second implementation needs is reachable without cloning (Calculus SPEC,
    conformance vectors, core and pack schemas, profiles, registry, versioning
    and decode-compat contract), measured as coverage and asserted by a gate.
    (b) TIME-TO-FIRST-VALIDATION — a stranger can paste a recipe and see a
    verdict within one page-load of arriving, with no install. COUNTER (must
    not move): ZERO DRIFT — no page may state anything the repo does not, and a
    hand-edited copy of a normative source is a build failure; plus the
    viewer's no-egress posture unchanged (CSP source list and the two pinned
    dependencies exactly as at v0.4).
  must_not_change: >-
    The full guard set PLUS no-new-normativity. Never fork a normative source —
    every page renders from the repo at build time. calculus/SPEC.md stays
    public-normative in both directions. No egress: static, no server, no
    analytics, no CDN fonts or scripts. Private collection unreachable.
    Dependency freeze holds. AND: the site is INFORMATIVE, never normative — if
    a page says something the repo does not, the repo wins and the page is the
    defect, stated ON the site, because a nicely-rendered page reads as more
    authoritative than the JSON it came from.
  riskiest_assumption: >-
    RENDERING STAYS IN LOCKSTEP. The bet is that build-time rendering genuinely
    keeps every page identical in content to its source, forever. The moment
    one page is easier to hand-edit than to regenerate, the site starts lying —
    and a lying documentation site is worse than none, because readers trust
    it. Every drift-prevention gate rests on this assumption, which is why
    FR-DOC-003 makes drift mechanically impossible to ship rather than a
    review habit. (Second-place risk, recorded: neither Daniel nor the
    assistant can judge whether the information architecture works for a
    stranger — see OQ-2.)

