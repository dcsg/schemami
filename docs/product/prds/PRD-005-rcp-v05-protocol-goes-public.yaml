schema_version: '1.0'
type: prd
id: PRD-005
title: 'RCP v0.5 — the protocol goes public: a documentation site rendered from
  the repo'
slug: rcp-v05-protocol-goes-public
status: draft
rigor: solo
author: Daniel Gomes
created_at: '2026-08-04T09:00:00Z'
requirements:
- id: FR-DOC-001
  component: documentation site
  text: 'Every NORMATIVE surface MUST have a page rendered from the repo at build
    time: calculus/SPEC.md, schema/rcp-core-v1.schema.json, schema/rcp-pack-v1.schema.json,
    schema/profiles/*, schema/MEDIA.md, schema/VERSIONING.md, and the registry entries.
    A page MUST NOT be a hand-authored copy of a normative source — a build that
    cannot derive a page from its source fails rather than shipping stale prose.'
  trace:
  - FEAT-TOOL-003
  - 'DECISIONS #21 (normative vs informative)'
  - engineering obligation — the protocol is a published language
  status: proposed
- id: FR-DOC-002
  component: documentation site
  text: The site MUST declare itself INFORMATIVE and name the repo as binding, on
    the site itself. Where a page and the repo disagree the repo wins and the page
    is the defect. A rendered page reads as more authoritative than the JSON it
    came from; saying otherwise in prose is the only thing that stops a reader trusting
    the wrong artefact.
  trace:
  - FEAT-TOOL-003
  - 'DECISIONS #21'
  - SSP-001 (informative tooling)
  status: proposed
- id: FR-DOC-003
  component: documentation site
  text: 'Drift MUST be mechanically impossible to ship: a gate MUST fail when any
    published page''s content diverges from the source it claims to render, and
    MUST fail when a normative surface exists in the repo with no page. Coverage
    is asserted, not reviewed.'
  trace:
  - FEAT-TOOL-003
  - Daniel Q5 2026-08-04 (riskiest assumption)
  - PLAN-rcp-v04 DIST-FRESH precedent
  status: proposed
- id: FR-TOOL-005
  component: developer tooling
  text: 'The existing single-file viewer MUST be reachable from the site as the
    live playground, WITHOUT weakening its guarantees: no server, no egress, the
    CSP source list unchanged, the dependency surface unchanged, and the private
    collection unreachable. A stranger MUST be able to paste a document and see
    a verdict without installing anything.'
  trace:
  - FEAT-TOOL-003
  - FEAT-TOOL-001
  - ADR-002 (engine seam)
  - the jwt.io move
  status: proposed
- id: FR-DOC-004
  component: documentation site
  text: 'The site MUST carry an implementer path: what a second implementation needs,
    reachable without cloning — the Calculus SPEC with its rules and worked examples,
    the conformance vectors as downloadable data, the versioning and decode-compatibility
    contract, and the registry. The protocol claims to be implementable by someone
    else; this is where that claim becomes checkable.'
  trace:
  - FEAT-TOOL-003
  - Daniel Q1 2026-08-04
  - calculus/ is public-normative by design
  status: proposed
- id: FR-DOC-005
  component: documentation site
  text: 'The site MUST be static and egress-free as a property of the BUILT OUTPUT,
    verifiable locally: no server-side execution, no analytics, no third-party fonts,
    scripts or styles, and no network request from any page when loaded with the
    network disabled. v0.5 delivers and verifies the site LOCALLY; deployment is
    explicitly out of scope. Hosting is expected to be Cloudflare but is NOT decided
    here — and no requirement in this PRD may depend on which host is chosen.'
  trace:
  - FEAT-TOOL-003
  - Daniel Q4 2026-08-04
  - 'Daniel 2026-08-04 (scope: "the goal is to have it running locally now for testing
    and verifying, first deployment is after")'
  - AC-TOOL-001-2 (viewer self-containment)
  status: proposed
- id: FR-DOC-006
  component: documentation site
  text: 'The site MUST work as a MANUAL, not a reference dump. It MUST be navigable
    (a reader can tell where they are, what else exists, and where to go next from
    any page), it MUST carry a reading path for someone who arrives knowing nothing,
    and it MUST be legible on a phone as well as a desktop. Coverage is necessary
    but NOT sufficient: a site that renders every normative surface and cannot be
    navigated has failed this requirement.'
  trace:
  - FEAT-TOOL-003
  - 'Daniel 2026-08-04 (MUST-have: "the best to act as a manual of the protocol
    and easy to understand and navigate")'
  - ADR-003 (no framework — so navigation is engineering work, not a theme default)
  status: proposed
acceptance_criteria:
- id: AC-DOC-001-1
  fr: FR-DOC-001
  given: the repo's normative surfaces and a built site
  when: the coverage gate runs
  then: every normative surface has a corresponding page, and a surface added to
    the repo with no page FAILS the gate
  status: proposed
- id: AC-DOC-001-2
  fr: FR-DOC-001
  given: a page whose source is calculus/SPEC.md
  when: the source changes and the site is rebuilt
  then: the page changes with it; no manual edit was required and none is possible
    without failing the drift gate
  status: proposed
- id: AC-DOC-002-1
  fr: FR-DOC-002
  given: any rendered normative page
  when: a reader looks at it
  then: the page states that the repo is binding and the site is informative, naming
    the source file it was rendered from
  status: proposed
- id: AC-DOC-003-1
  fr: FR-DOC-003
  given: a published page hand-edited to differ from its source
  when: the drift gate runs
  then: it FAILS naming the page and its source — the inverted proof ships with
    the gate
  status: proposed
- id: AC-TOOL-005-1
  fr: FR-TOOL-005
  given: the site served statically and a recipe document
  when: a visitor pastes it into the embedded playground
  then: verdicts and a rendered recipe appear with no install, and no network request
    leaves the page
  status: proposed
- id: AC-TOOL-005-2
  fr: FR-TOOL-005
  given: the embedded playground
  when: the CSP and dependency assertions run
  then: the viewer's CSP source list and the two pinned dependencies are unchanged
    from v0.4, and the private collection is unreachable
  status: proposed
- id: AC-DOC-004-1
  fr: FR-DOC-004
  given: a developer who has never cloned the repo
  when: they follow the implementer path
  then: they can read the Calculus rules and worked examples, download the conformance
    vectors, and read the versioning and decode-compatibility contract
  status: proposed
- id: AC-DOC-005-1
  fr: FR-DOC-005
  given: the site built locally and served from a local static server (and from
    file://)
  when: every page is loaded with the network disabled
  then: it renders completely and issues no network request — asserted by the build,
    with no deployed host involved
  status: proposed
- id: AC-DOC-006-1
  fr: FR-DOC-006
  given: any page of the site
  when: a reader looks at it
  then: they can see where they are in the whole, what the other sections are, and
    reach any of them without using the back button
  status: proposed
- id: AC-DOC-006-2
  fr: FR-DOC-006
  given: a reader who arrives knowing nothing about RCP
  when: they follow the site's own reading path from the entry page
  then: they reach a working understanding of what a recipe document is and can
    try one in the playground, without being sent to the repo
  status: proposed
- id: AC-DOC-006-3
  fr: FR-DOC-006
  given: the built site on a phone-width viewport
  when: any page is loaded
  then: it is readable and navigable with no horizontal scrolling of the page body;
    wide content (tables, schema blocks) scrolls within its own container
  status: proposed
protections:
- id: SP-001
  text: The site NEVER forks a normative source. Every page renders from schema/,
    calculus/SPEC.md, schema/MEDIA.md, schema/VERSIONING.md and registry/ at build
    time; a hand-authored copy of any of them is a build failure.
- id: SP-002
  text: The site is INFORMATIVE, never normative. If a page says something the repo
    does not, the repo wins and the page is the defect — and the site says so, because
    a rendered page reads as more authoritative than the JSON it came from.
- id: SP-003
  text: 'calculus/SPEC.md stays public-normative: no project ids leak IN, and the
    site''s framing does not leak project vocabulary OUT onto the page.'
- id: SP-004
  text: 'No egress. Static only: no server-side execution, no analytics, no third-party
    fonts, scripts or styles. The viewer''s CSP posture extends to the whole site
    and its source list is unchanged. This is a property of the BUILT OUTPUT, so
    it holds regardless of host — a site that is egress-free only because of a particular
    host''s configuration has not satisfied this.'
- id: SP-005
  text: 'Dependency freeze holds: the viewer keeps exactly its two pinned dependencies,
    and any tooling the site build needs is justified by a recorded decision rather
    than added silently.'
- id: SP-006
  text: The private collection is never reachable, never rendered, and never referenced.
    The existing attestation and provenance checks stay green.
- id: SP-007
  text: Navigation, typography and layout are engineering deliverables with an acceptance
    criterion, not an afterthought. ADR-003 rejected a framework whose main value
    was exactly these; that rejection is only honest if they are actually delivered.
    A site that is complete but unnavigable fails the cut.
