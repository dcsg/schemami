open_questions:
  - "OQ-1: Hosting — where does a static, egress-free site live, and is the choice recorded as a decision (SP-004 requires it be recorded, not assumed)?"
  - "OQ-2: Information architecture — what does a stranger read FIRST? Neither Daniel nor the assistant can judge this from inside the project (Q5's second-place risk); decide whether to test it on a real reader before or after shipping."
  - "OQ-3: Does the site render the registry as browsable pages, or link to the repo for it? 109 entries is a lot of generated pages for a first cut."
  - "OQ-4: Versioned documentation — does the site show only the current tag, or every tagged version? VERSIONING.md binds from a tag, so a reader of an older document may need older docs."

