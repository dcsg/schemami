open_questions:
- 'OQ-1: RESOLVED 2026-08-04 as DEFERRED — hosting is out of scope for v0.5. Daniel:
  likely Cloudflare, "but that is not important since the goal is to have it running
  locally now for testing and verifying; first deployment is after". No requirement
  may depend on the host. Two findings carry forward to whenever deployment happens:
  the zone must be audited for egress (paodeportugal.pt currently sends nel/report-to
  beacons to Cloudflare), and Cloudflare reserves the right to attach headers to
  static asset responses at any time, which composes with the viewer meta-CSP by
  intersection.'
- 'OQ-2: Information architecture — what does a stranger read FIRST? Neither Daniel
  nor the assistant can judge this from inside the project (Q5''s second-place risk);
  decide whether to test it on a real reader before or after shipping.'
- 'OQ-3: Does the site render the registry as browsable pages, or link to the repo
  for it? 109 entries is a lot of generated pages for a first cut.'
- 'OQ-4: Versioned documentation — does the site show only the current tag, or every
  tagged version? VERSIONING.md binds from a tag, so a reader of an older document
  may need older docs.'
- 'OQ-5: CI cannot build the site today — validate.yml installs Go only, no mise/Bun.
  A Bun setup step is a prerequisite for any drift gate running in CI (research
  11 §6).'
- 'OQ-6: media-attest.py scans BUILT output and fails on any data:image base64 URI
  — so no inlined images or data-URI favicon in generated pages. Confirm the site
  design accepts this (research 11 §6).'
