    text: "ADDITION-only: every document valid at tag rcp-v0.1 remains valid throughout v0.2 — additions and tighten-with-defaults only, per schema/VERSIONING.md; any change that would invalidate an existing document is out of scope by definition (it would be a MODEL bump)."

