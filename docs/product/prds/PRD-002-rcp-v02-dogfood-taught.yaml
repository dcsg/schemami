open_questions:
  - "OQ-1: The technique. kind prefix extends DECISIONS #23 (which sanctioned exactly three) — needs Daniel's decision entry before FR-REG-003 lands."
  - "OQ-2: Time-field semantics — hands-on vs total vs per-phase (research 04 wants both); exact shape decided in SPEC."
  - "OQ-3: Difficulty scale representation (books use 1-3 chef hats; asserted facet needs a stable scale)."
  - "OQ-4: Viewer build toolchain — a browser page is JavaScript by nature, but the anti-Node bar (PRD-001 OQ-2 input d) applies to the BUILD chain: zero-build vanilla vs minimal bundler is a SPEC decision with the burden of proof on any npm dependency."

