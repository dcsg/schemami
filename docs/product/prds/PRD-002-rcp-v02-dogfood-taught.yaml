type: prd
id: "PRD-002"
title: "RCP v0.2 — what the dogfood taught"
slug: "rcp-v02-dogfood-taught"
status: draft
rigor: "solo"
author: "Daniel Gomes"
created_at: "2026-08-02T22:07:39Z"

# ID scheme (traceability guideline): component codes, numbering continues
# across PRDs (globally unique). New codes TOOL and I18N declared in the
# guideline 2026-08-02. Every FR trace leads with its FEAT id (graduation).
# verify: omitted — added via continuation as each deliverable lands.
requirements:
  - id: FR-PR-003
    component: protocol-core
    text: "The core schema gains the four ADDITION-class field groups every dogfooded page asked for: recipe-level time metadata (preparation/cooking/chilling and a derived-friendly total), a difficulty asserted facet on taxonomy (DECISIONS #10 lists it), a storage-guidance shape, and provenance source detail (work/page + note). All optional, MODEL-1-legal per VERSIONING.md; the hardened pastry profile block admits storage additively."
    trace: ["FEAT-CORE-005", "dogfood runs #1-#5", "DECISIONS #10", "research 04:76-80"]
    status: proposed
  - id: FR-PROF-004
    component: profiles
    text: "The dish profile hardens from its two real documents (chili, feijoada): x-rcp-maturity flips to hardened; profile-block fields typed from observed use; any numeric bounds enter at warn severity only in this cut (n=2 evidence — the recorded riskiest assumption), with the rationale written into the profile. Both dish documents validate core AND dish (hardened)."
    trace: ["FEAT-PROF-005", "dogfood runs #3/#5", "DECISIONS #18"]
    status: proposed
  - id: FR-REG-003
    component: registry
    text: "Techniques graduate from interim vocab list to governed registry kind: a technique entry schema (display names, definition, teaches/media links, optional primitive association), seed entries from the dogfood harvest (stir, none, bulhao-pato, refogado, flambe at minimum), every technique reference validated against entries, and the interim registry/vocab/techniques.yaml retired. Requires the DECISIONS entry extending #23 with the technique. prefix (OQ-1)."
    trace: ["FEAT-REG-003", "dogfood run #5 harvest", "research 06:270-286", "DECISIONS #10"]
    status: proposed
  - id: FR-REG-004
    component: registry
    text: "Ontology grounding and cross-language matching: every ingredient entry carries at least one external cross_ref (FooDON preferred; FDC/OFF accepted) or a recorded no-match note; the ingestion flow emits a proposed canonical English class per unresolved item; the gap ledger groups by proposal so cebola and onion consolidate to one candidate."
    trace: ["FEAT-REG-004", "registry-governance rule 6", "dogfood run #5 finding", "research 02:367-378"]
    status: proposed
  - id: FR-I18N-001
    component: i18n
    text: "The translation layer's first cut: a taxonomy translation vocabulary (English-base slugs to pt-PT display terms) covering every taxonomy slug used across examples and the private collection, following the registry display_name pattern; identifiers are never localized (DECISIONS #23/#24) and the linter enforces English-base slug shape on taxonomy."
    trace: ["FEAT-I18N-001", "DECISIONS #24"]
    status: proposed
  - id: FR-TOOL-001
    component: tool
    text: "The lightweight viewer ships: a static page where pasting or dropping an .rcp.yaml/JSON document renders L1 validation verdicts and a human-readable recipe view (name, ingredients with resolved basis expressions, step sections with notes, per-component profile and maturity labels, i18n display via FR-I18N-001). No server, no accounts, no network transmission of document content — private-collection-safe by construction (DECISIONS #11/#19). The full WASM playground (L2+CUE verdicts, clamp slider) remains later scope."
    trace: ["FEAT-TOOL-001", "PRD-001 integrator guarantee", "DECISIONS #19", "DECISIONS #21"]
    status: proposed

acceptance_criteria:
  - id: AC-PR-003-1
    fr: FR-PR-003
    given: "every document valid at tag rcp-v0.1"
    when: "validated against the v0.2 core"
    then: "it still validates unchanged — the additions are MODEL-1-legal (no MODEL bump)"
    status: proposed
  - id: AC-PR-003-2
    fr: FR-PR-003
    given: "the five private recipes re-encoded with the new fields"
    when: "their descriptions are inspected"
    then: "zero instances of times, difficulty, storage, or source detail parked in prose — semantic coverage reaches the north metric"
    status: proposed
  - id: AC-PR-003-3
    fr: FR-PR-003
    given: "a pastry document carrying storage guidance"
    when: "validated against the hardened pastry profile"
    then: "it passes — the hardened block admitted the field additively"
    status: proposed
  - id: AC-PROF-004-1
    fr: FR-PROF-004
    given: "chili and feijoada"
    when: "validated by the harness"
    then: "both pass core AND dish with maturity: hardened in output"
    status: proposed
  - id: AC-PROF-004-2
    fr: FR-PROF-004
    given: "the dish profile's bounds"
    when: "inspected"
    then: "every numeric bound carries severity: warn and an authored reason noting the n=2 evidence base — no critical bounds enter on two data points"
    status: proposed
  - id: AC-REG-003-1
    fr: FR-REG-003
    given: "the technique registry entries"
    when: "validated against the technique entry schema"
    then: "all pass, kind-prefixed under the technique. namespace per the extended DECISIONS entry"
    status: proposed
  - id: AC-REG-003-2
    fr: FR-REG-003
    given: "a document referencing an undocumented technique"
    when: "linted"
    then: "it is rejected naming the missing entry; the interim vocab file no longer exists"
    status: proposed
  - id: AC-REG-004-1
    fr: FR-REG-004
    given: "the ingredient registry"
    when: "audited"
    then: "every entry carries at least one cross_ref or a recorded no-match note — none silently ungrounded"
    status: proposed
  - id: AC-REG-004-2
    fr: FR-REG-004
    given: "two unresolved imports whose raws are 'cebola' and 'onion'"
    when: "the gap ledger runs"
    then: "they group under one proposed canonical class — the cross-language consolidation test"
    status: proposed
  - id: AC-I18N-001-1
    fr: FR-I18N-001
    given: "every taxonomy slug used across examples and the private collection"
    when: "looked up in the translation vocabulary"
    then: "each has a pt-PT display term; slugs themselves remain English-base and the linter rejects non-conforming taxonomy slugs"
    status: proposed
  - id: AC-TOOL-001-1
    fr: FR-TOOL-001
    given: "any of the six examples or five private recipes pasted or dropped into the viewer"
    when: "the page processes it"
    then: "L1 verdicts and the rendered recipe view (ingredients with bases, step sections, maturity labels) appear"
    status: proposed
  - id: AC-TOOL-001-2
    fr: FR-TOOL-001
    given: "the viewer processing a private-collection document"
    when: "network activity is inspected"
    then: "zero requests carry document content — rendering is entirely client-side"
    status: proposed

protections:
