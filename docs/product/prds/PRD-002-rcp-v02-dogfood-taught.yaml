forcing_questions:
  problem_behind_problem: "Ingestion loses meaning and the collection stays illegible. Every one of the five ingested recipes parked real information in prose because fields don't exist (times, difficulty, storage, source); both savoury documents run core-only with zero dish enforcement; techniques the books rely on (refogar, bulhao-pato) are unvalidated vocabulary; cross-language ingestion can't consolidate (cebola/onion); and there is no way for a human to look at an ingested recipe except reading raw YAML — the collection grows but stays illegible and semantically lossy."
  evidence_or_hypothesis: "Direct dogfood evidence, n=5 — every v0.2 feature traces to a specific run's finding (5/5 prose-parking; 2/5 unenforced dishes; the run-5 technique harvest and cross-language failure; raw-YAML review on every pass). PLUS one explicit hypothesis, honestly labelled: integrators and others will want to SEE documents (the viewer's audience does not exist yet — it is the same expansion-adjacent bet PRD-001 kept gated, taken here only at lightweight cost)."
  north_metric_and_counter: "NORTH — semantic coverage: % of book-page metadata landing in machine-read fields instead of description prose on newly-ingested recipes; target: zero prose-parking for the four field classes (times, difficulty, storage, source), plus both existing dish documents validating against the hardened dish profile. COUNTER — no MODEL bump: every v0.2 change is ADDITION-class per VERSIONING.md, and the regression suite plus all five private recipes stay green throughout."
  must_not_change: "ADDITION-only: every document valid at rcp-v0.1 remains valid. (Single protection, deliberately — the two-surface split, private-vs-published boundary and English-base identifiers are already protected by standing decisions and SSPs; restating them here would duplicate.)"
  riskiest_assumption: "Dish hardening from n=2: the profile hardens from exactly two real documents, risking rules the third savoury recipe immediately breaks — mitigated by admitting numeric bounds at warn severity only, with the n=2 rationale written into the profile itself."

