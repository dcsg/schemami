forcing_questions:
  problem_behind_problem: "Fornada needs trustworthy native import, calculation, and adjustment review without waiting for unrelated SDK packaging work."
  evidence_or_hypothesis: "A complete Swift-first SDK can dogfood Schemami quickly while a shared corpus prevents a Swift-only protocol fork."
  north_metric_and_counter: "North: Fornada pins and uses a conformant Swift SDK. Counter: zero provider/app policy in the package and zero undocumented Swift-only semantics."
  must_not_change: "No model calls, no original-recipe mutation, no Fornada mappings in SDK products, and no structs-only SDK claim."
  riskiest_assumption: "The full v1 semantics can be delivered on the verified Fornada Swift baseline without waiting for Go/TypeScript package extraction."
